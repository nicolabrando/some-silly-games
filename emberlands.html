const hpFill = document.getElementById('hpFill');
const hpText = document.getElementById('hpText');
const goldText = document.getElementById('goldText');
const placeEl = document.getElementById('place');
const hintEl = document.getElementById('hint');
function syncHud() {
  const p = game.player;
  if (!p) return;
  hpFill.style.width = Math.max(0, (p.hp / p.maxHp) * 100) + '%';
  hpText.textContent = Math.max(0, Math.round(p.hp)) + '/' + p.maxHp;
  goldText.textContent = p.gold;
  placeEl.textContent = game.placeName;
}
function updateHint() {
  hintEl.innerHTML =
    '<span>Frecce</span> muoviti &nbsp;·&nbsp; <span>Spazio</span> spada &nbsp;·&nbsp; <span>S</span> parla<br>' +
    '<span>W</span> mappa &nbsp;·&nbsp; <span>P</span> pausa e salvataggio';
}

/* ============================================================
   DISEGNO
   ============================================================ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let VW = 0, VH = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = window.innerWidth; VH = window.innerHeight;
  canvas.width = Math.floor(VW * DPR);
  canvas.height = Math.floor(VH * DPR);
}
addEventListener('resize', resize);
resize();

function clampCamera() {
  const aw = game.area.w * TS, ah = game.area.h * TS;
  game.cam.x = aw <= VW ? aw / 2 : Math.max(VW / 2, Math.min(aw - VW / 2, game.cam.x));
  game.cam.y = ah <= VH ? ah / 2 : Math.max(VH / 2, Math.min(ah - VH / 2, game.cam.y));
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) + amt, g = ((n >> 8) & 255) + amt, b = (n & 255) + amt;
  r = r < 0 ? 0 : r > 255 ? 255 : r;
  g = g < 0 ? 0 : g > 255 ? 255 : g;
  b = b < 0 ? 0 : b > 255 ? 255 : b;
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
/** prato: variazione morbida a macchie invece della scacchiera per tile */
function grassShade(tx, ty, h) {
  const patch = vnoise(tx / 6, ty / 6, 4242);
  return shade('#4e8b45', ((patch * 20 - 10) + (h * 7 - 3.5)) | 0);
}

/** i tetti prendono il colore del paese a cui appartengono */
let roofCache = null;
function roofColorAt(tx, ty) {
  const c = roofCache;
  if (c && (c.x - tx) ** 2 + (c.y - ty) ** 2 <= (c.r + 4) ** 2) return c.roof;
  for (const s of game.settlements)
    if ((s.x - tx) ** 2 + (s.y - ty) ** 2 <= (s.r + 4) ** 2) { roofCache = s; return s.roof; }
  return '#8c4a3a';
}

function drawTiles(area, camX, camY) {
  const x0 = Math.max(0, Math.floor((camX - VW / 2) / TS) - 1);
  const y0 = Math.max(0, Math.floor((camY - VH / 2) / TS) - 1);
  const x1 = Math.min(area.w - 1, Math.ceil((camX + VW / 2) / TS) + 1);
  const y1 = Math.min(area.h - 1, Math.ceil((camY + VH / 2) / TS) + 1);
  const t = game.time;

  for (let ty = y0; ty <= y1; ty++) {
    for (let tx = x0; tx <= x1; tx++) {
      const id = area.tiles[ty * area.w + tx];
      const px = tx * TS, py = ty * TS;
      const h = hash01(tx, ty, 7);

      switch (id) {
        case T.WATER: {
          const w = Math.sin(t * 1.6 + (tx + ty) * 0.55) * 7;
          ctx.fillStyle = shade('#2b5d8f', (w | 0) - 4);
          ctx.fillRect(px, py, TS, TS);
          if (h > 0.86) {
            ctx.fillStyle = 'rgba(190,225,255,.28)';
            ctx.fillRect(px + 6, py + 12 + Math.sin(t * 2 + tx) * 2, 14, 2);
          }
          break;
        }
        case T.GRASS:
        case T.BUSH: {
          ctx.fillStyle = grassShade(tx, ty, h);
          ctx.fillRect(px, py, TS, TS);
          if (h > 0.80) {
            ctx.fillStyle = 'rgba(255,255,255,.045)';
            ctx.fillRect(px + 7 + (h * 9 | 0), py + 17, 2, 5);
            ctx.fillRect(px + 19 - (h * 6 | 0), py + 9, 2, 5);
          }
          if (id === T.BUSH) {
            ctx.fillStyle = '#3a6f36';
            ctx.beginPath(); ctx.arc(px + 16, py + 18, 9, 0, 6.284); ctx.fill();
            ctx.fillStyle = '#4b8a45';
            ctx.beginPath(); ctx.arc(px + 13, py + 15, 6, 0, 6.284); ctx.fill();
          }
          break;
        }
        case T.TREE: {
          ctx.fillStyle = grassShade(tx, ty, h);
          ctx.fillRect(px, py, TS, TS);
          const jx = (hash01(tx, ty, 41) * 5 - 2.5);
          const rad = 10 + hash01(tx, ty, 53) * 3.5;
          ctx.fillStyle = 'rgba(0,0,0,.24)';
          ctx.beginPath(); ctx.ellipse(px + 16 + jx, py + 27, rad * 0.85, 4.5, 0, 0, 6.284); ctx.fill();
          ctx.fillStyle = '#5a3f28';
          ctx.fillRect(px + 14 + jx, py + 14, 5, 12);
          ctx.fillStyle = shade('#2f6b31', ((h * 22) | 0) - 6);
          ctx.beginPath(); ctx.arc(px + 16 + jx, py + 10, rad, 0, 6.284); ctx.fill();
          ctx.fillStyle = shade('#3f8a3f', 8);
          ctx.beginPath(); ctx.arc(px + 12.5 + jx, py + 7, rad * 0.5, 0, 6.284); ctx.fill();
          break;
        }
        case T.ROCK: {
          ctx.fillStyle = grassShade(tx, ty, h);
          ctx.fillRect(px, py, TS, TS);
          ctx.fillStyle = shade('#7b7d84', ((h * 20) | 0) - 10);
          ctx.beginPath();
          ctx.moveTo(px + 4, py + 27); ctx.lineTo(px + 9, py + 8);
          ctx.lineTo(px + 22, py + 6); ctx.lineTo(px + 28, py + 27);
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,.14)';
          ctx.fillRect(px + 11, py + 11, 7, 4);
          break;
        }
        case T.BRIDGE: {
          ctx.fillStyle = '#2b5d8f'; ctx.fillRect(px, py, TS, TS);
          ctx.fillStyle = '#8a6a42'; ctx.fillRect(px, py + 2, TS, TS - 4);
          ctx.fillStyle = 'rgba(0,0,0,.18)';
          for (let i = 0; i < TS; i += 8) ctx.fillRect(px + i, py + 2, 2, TS - 4);
          break;
        }
        case T.PATH: {
          ctx.fillStyle = shade('#a08c62', ((h * 16) | 0) - 8);
          ctx.fillRect(px, py, TS, TS);
          if (h > 0.8) { ctx.fillStyle = 'rgba(0,0,0,.10)'; ctx.fillRect(px + 9, py + 14, 6, 4); }
          break;
        }
        case T.ROOF:
        case T.CHIMNEY: {
          const col = roofColorAt(tx, ty);
          ctx.fillStyle = shade(col, ((h * 8) | 0) - 4);
          ctx.fillRect(px, py, TS, TS);
          // tegole sfalsate
          ctx.fillStyle = 'rgba(0,0,0,.17)';
          for (let r = 0; r < 4; r++) {
            const off = (r % 2) ? 5 : 0;
            ctx.fillRect(px, py + r * 8 + 6, TS, 1.5);
            for (let c = -1; c < 3; c++) ctx.fillRect(px + off + c * 11 + 10, py + r * 8, 1.5, 6);
          }
          ctx.fillStyle = 'rgba(255,255,255,.06)';
          for (let r = 0; r < 4; r++) ctx.fillRect(px, py + r * 8, TS, 1.5);
          // gronde: bordo del tetto verso l'esterno
          const isR = v => v === T.ROOF || v === T.CHIMNEY;
          if (!isR(tileAt(area, tx, ty - 1))) {
            ctx.fillStyle = shade(col, 26); ctx.fillRect(px, py, TS, 4);
          }
          if (!isR(tileAt(area, tx, ty + 1))) {
            ctx.fillStyle = shade(col, -34); ctx.fillRect(px, py + TS - 5, TS, 5);
            ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fillRect(px, py + TS - 2, TS, 2);
          }
          if (!isR(tileAt(area, tx - 1, ty))) { ctx.fillStyle = shade(col, -20); ctx.fillRect(px, py, 3, TS); }
          if (!isR(tileAt(area, tx + 1, ty))) { ctx.fillStyle = shade(col, -20); ctx.fillRect(px + TS - 3, py, 3, TS); }
          if (id === T.CHIMNEY) {
            ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fillRect(px + 8, py + 16, 16, 5);
            ctx.fillStyle = '#8d7969'; ctx.fillRect(px + 9, py + 1, 14, 18);
            ctx.fillStyle = '#a8968a'; ctx.fillRect(px + 7, py - 1, 18, 4);
            ctx.fillStyle = 'rgba(0,0,0,.30)';
            ctx.fillRect(px + 9, py + 7, 14, 1.6); ctx.fillRect(px + 9, py + 12, 14, 1.6);
            ctx.fillRect(px + 15, py + 3, 1.6, 16);
            ctx.fillStyle = '#231d19'; ctx.fillRect(px + 10, py, 12, 3);
            for (let i = 0; i < 5; i++) {                                   // fumo che sale
              const ph = (t * 0.4 + i * 0.2 + hash01(tx, ty, 5)) % 1;
              ctx.fillStyle = 'rgba(232,232,230,' + (0.42 * (1 - ph) * (1 - ph)) + ')';
              ctx.beginPath();
              ctx.arc(px + 16 + Math.sin(ph * 4 + tx) * 7, py - 2 - ph * 42, 3.5 + ph * 9, 0, 6.284);
              ctx.fill();
            }
          }
          break;
        }
        case T.COBBLE: {
          ctx.fillStyle = shade('#8e8880', ((h * 12) | 0) - 6);
          ctx.fillRect(px, py, TS, TS);
          ctx.fillStyle = 'rgba(0,0,0,.16)';
          for (let i = 0; i < 4; i++) {
            const o = (i % 2) * 8;
            ctx.fillRect(px + o, py + i * 8, 1, 8);
            ctx.fillRect(px + o + 16, py + i * 8, 1, 8);
            ctx.fillRect(px, py + i * 8, TS, 1);
          }
          break;
        }
        case T.FOUNTAIN: {
          ctx.fillStyle = shade('#8e8880', -4); ctx.fillRect(px, py, TS, TS);
          ctx.fillStyle = '#b6ada2';
          ctx.beginPath(); ctx.arc(px + 16, py + 17, 14, 0, 6.284); ctx.fill();
          const w = Math.sin(t * 2.2 + tx) * 4;
          ctx.fillStyle = shade('#3d7fb5', (w | 0));
          ctx.beginPath(); ctx.arc(px + 16, py + 17, 10.5, 0, 6.284); ctx.fill();
          ctx.fillStyle = '#c6bdb1';
          ctx.fillRect(px + 13, py + 8, 6, 11);
          ctx.beginPath(); ctx.arc(px + 16, py + 7, 4, 0, 6.284); ctx.fill();
          ctx.fillStyle = 'rgba(215,240,255,.75)';
          for (let i = 0; i < 4; i++) {
            const a2 = t * 3 + i * 1.57;
            ctx.fillRect(px + 16 + Math.cos(a2) * 6 - 1, py + 10 + Math.abs(Math.sin(a2)) * 6, 2, 4);
          }
          break;
        }
        case T.WELL: {
          ctx.fillStyle = grassShade(tx, ty, h); ctx.fillRect(px, py, TS, TS);
          ctx.fillStyle = 'rgba(0,0,0,.22)';
          ctx.beginPath(); ctx.ellipse(px + 16, py + 26, 12, 5, 0, 0, 6.284); ctx.fill();
          ctx.fillStyle = '#8a8079';
          ctx.beginPath(); ctx.arc(px + 16, py + 20, 11, 0, 6.284); ctx.fill();
          ctx.fillStyle = '#1d2733';
          ctx.beginPath(); ctx.arc(px + 16, py + 20, 7, 0, 6.284); ctx.fill();
          ctx.fillStyle = '#6b4a34';
          ctx.fillRect(px + 5, py + 4, 3, 17); ctx.fillRect(px + 24, py + 4, 3, 17);
          ctx.fillStyle = '#8c4a3a';
          ctx.beginPath(); ctx.moveTo(px + 2, py + 6); ctx.lineTo(px + 16, py); ctx.lineTo(px + 30, py + 6);
          ctx.lineTo(px + 30, py + 9); ctx.lineTo(px + 16, py + 3); ctx.lineTo(px + 2, py + 9); ctx.fill();
          ctx.fillStyle = '#4a3527'; ctx.fillRect(px + 15, py + 6, 2, 9);
          break;
        }
        case T.STATUE: {
          ctx.fillStyle = shade('#8e8880', -4); ctx.fillRect(px, py, TS, TS);
          ctx.fillStyle = 'rgba(0,0,0,.22)';
          ctx.beginPath(); ctx.ellipse(px + 16, py + 27, 11, 4, 0, 0, 6.284); ctx.fill();
          ctx.fillStyle = '#9a958c'; ctx.fillRect(px + 7, py + 22, 18, 6);
          ctx.fillStyle = '#b3aea4'; ctx.fillRect(px + 9, py + 19, 14, 4);
          ctx.fillStyle = '#c2bcb1';
          ctx.fillRect(px + 12, py + 8, 8, 12);                  // busto
          ctx.beginPath(); ctx.arc(px + 16, py + 6, 4, 0, 6.284); ctx.fill();
          ctx.fillRect(px + 8, py + 10, 4, 7);                    // braccio
          ctx.fillStyle = '#a49e94'; ctx.fillRect(px + 19, py + 4, 3, 14);   // lancia
          break;
        }
        case T.LAUNDRY: {
          ctx.fillStyle = grassShade(tx, ty, h); ctx.fillRect(px, py, TS, TS);
          ctx.fillStyle = '#6b4a34';
          ctx.fillRect(px + 2, py + 6, 2, 20); ctx.fillRect(px + 28, py + 6, 2, 20);
          ctx.strokeStyle = '#c9bda6'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(px + 3, py + 8); ctx.lineTo(px + 29, py + 8); ctx.stroke();
          const shirts = ['#d8e0ea', '#e6c7c0', '#cfd9c0', '#e2d9b8'];
          for (let i = 0; i < 3; i++) {
            const sw = Math.sin(t * 1.7 + i + tx) * 1.6;
            ctx.fillStyle = shirts[(i + (h * 4 | 0)) % 4];
            ctx.fillRect(px + 4 + i * 9 + sw, py + 8, 7, 10 + (i % 2) * 3);
          }
          break;
        }
        case T.FLOWERS: {
          ctx.fillStyle = grassShade(tx, ty, h); ctx.fillRect(px, py, TS, TS);
          ctx.fillStyle = '#3f7a3a';
          ctx.fillRect(px + 4, py + 18, 24, 8);
          const cols = ['#e8697f', '#f0d05a', '#c68ce0', '#eaeaea'];
          for (let i = 0; i < 6; i++) {
            const fx = px + 5 + ((hash01(tx, ty + i, 11) * 22) | 0);
            const fy = py + 8 + ((hash01(tx + i, ty, 12) * 14) | 0);
            ctx.fillStyle = '#4d8f46'; ctx.fillRect(fx + 1, fy + 2, 1, 6);
            ctx.fillStyle = cols[(i + (h * 4 | 0)) % 4];
            ctx.beginPath(); ctx.arc(fx + 1.5, fy + 1.5, 2.2, 0, 6.284); ctx.fill();
          }
          break;
        }
        case T.FENCE: {
          ctx.fillStyle = grassShade(tx, ty, h); ctx.fillRect(px, py, TS, TS);
          ctx.fillStyle = '#8a6a42';
          ctx.fillRect(px + 3, py + 10, 3, 16); ctx.fillRect(px + 15, py + 10, 3, 16);
          ctx.fillRect(px + 26, py + 10, 3, 16);
          ctx.fillStyle = '#a07f52';
          ctx.fillRect(px, py + 13, TS, 3); ctx.fillRect(px, py + 20, TS, 3);
          break;
        }
        case T.CRATE: {
          ctx.fillStyle = grassShade(tx, ty, h); ctx.fillRect(px, py, TS, TS);
          ctx.fillStyle = 'rgba(0,0,0,.2)';
          ctx.beginPath(); ctx.ellipse(px + 16, py + 27, 10, 4, 0, 0, 6.284); ctx.fill();
          ctx.fillStyle = '#9c7645'; ctx.fillRect(px + 6, py + 9, 20, 18);
          ctx.fillStyle = '#7d5a33';
          ctx.fillRect(px + 6, py + 16, 20, 2);
          ctx.fillRect(px + 15, py + 9, 2, 18);
          ctx.fillStyle = 'rgba(255,255,255,.10)'; ctx.fillRect(px + 6, py + 9, 20, 2);
          break;
        }
        case T.HAY: {
          ctx.fillStyle = grassShade(tx, ty, h); ctx.fillRect(px, py, TS, TS);
          ctx.fillStyle = 'rgba(0,0,0,.20)';
          ctx.beginPath(); ctx.ellipse(px + 16, py + 27, 12, 4, 0, 0, 6.284); ctx.fill();
          ctx.fillStyle = '#d9b64e';
          ctx.beginPath(); ctx.moveTo(px + 3, py + 27); ctx.lineTo(px + 16, py + 4);
          ctx.lineTo(px + 29, py + 27); ctx.closePath(); ctx.fill();
          ctx.fillStyle = 'rgba(140,100,30,.35)';
          for (let i = 0; i < 3; i++) ctx.fillRect(px + 7 + i, py + 12 + i * 5, 18 - i * 2, 1.5);

        }
        case T.STALL: {
          ctx.fillStyle = shade('#8e8880', -3); ctx.fillRect(px, py, TS, TS);
          ctx.fillStyle = '#6b4a34';
          ctx.fillRect(px + 3, py + 12, 2, 15); ctx.fillRect(px + 27, py + 12, 2, 15);
          ctx.fillStyle = '#a87d4e'; ctx.fillRect(px + 2, py + 15, 28, 4);
          for (let i = 0; i < 5; i++) {                                   // tendone a righe
            ctx.fillStyle = i % 2 ? '#e0e0d6' : '#c34a3c';
            ctx.fillRect(px + 1 + i * 6, py + 5, 6, 8);
          }
          ctx.fillStyle = '#8a4a3a'; ctx.fillRect(px, py + 3, TS, 3);
          ctx.fillStyle = '#7ba05b';                                       // merce
          ctx.beginPath(); ctx.arc(px + 9, py + 21, 3, 0, 6.284); ctx.fill();
          ctx.fillStyle = '#d98452';
          ctx.beginPath(); ctx.arc(px + 17, py + 21, 3, 0, 6.284); ctx.fill();
          ctx.fillStyle = '#c8a53c';
          ctx.beginPath(); ctx.arc(px + 24, py + 21, 3, 0, 6.284); ctx.fill();
          break;
        }
        case T.SIGN: {
          ctx.fillStyle = grassShade(tx, ty, h); ctx.fillRect(px, py, TS, TS);
          ctx.fillStyle = 'rgba(0,0,0,.18)';
          ctx.beginPath(); ctx.ellipse(px + 16, py + 27, 7, 3, 0, 0, 6.284); ctx.fill();
          ctx.fillStyle = '#6b4a34'; ctx.fillRect(px + 14, py + 12, 4, 15);
          ctx.fillStyle = '#a07f52'; ctx.fillRect(px + 3, py + 6, 26, 11);
          ctx.fillStyle = '#6b4a34'; ctx.fillRect(px + 3, py + 6, 26, 2);
          ctx.fillStyle = 'rgba(60,40,20,.55)';
          ctx.fillRect(px + 6, py + 10, 15, 1.6); ctx.fillRect(px + 6, py + 13, 11, 1.6);
          break;
        }
        case T.LAMP: {
          ctx.fillStyle = shade('#8e8880', -3); ctx.fillRect(px, py, TS, TS);
          ctx.fillStyle = 'rgba(0,0,0,.18)';
          ctx.beginPath(); ctx.ellipse(px + 16, py + 28, 6, 3, 0, 0, 6.284); ctx.fill();
          ctx.fillStyle = '#4a4a52'; ctx.fillRect(px + 14, py + 8, 4, 20);
          ctx.fillStyle = '#3a3a42'; ctx.fillRect(px + 11, py + 26, 10, 3);
          const gl = 0.55 + Math.sin(t * 4 + tx) * 0.18;
          ctx.fillStyle = 'rgba(255,200,90,' + (gl * 0.35) + ')';
          ctx.beginPath(); ctx.arc(px + 16, py + 6, 11, 0, 6.284); ctx.fill();
          ctx.fillStyle = '#5a5a64'; ctx.fillRect(px + 10, py + 1, 12, 3);
          ctx.fillStyle = 'rgba(255,214,120,' + gl + ')';
          ctx.fillRect(px + 12, py + 4, 8, 8);

        case T.BENCH: {
          ctx.fillStyle = shade('#8e8880', -3); ctx.fillRect(px, py, TS, TS);
          ctx.fillStyle = 'rgba(0,0,0,.18)';
          ctx.fillRect(px + 4, py + 24, 24, 3);
          ctx.fillStyle = '#7a5530';
          ctx.fillRect(px + 4, py + 6, 3, 18); ctx.fillRect(px + 25, py + 6, 3, 18);
          ctx.fillStyle = '#a07f52';
          ctx.fillRect(px + 2, py + 15, 28, 5);
          ctx.fillRect(px + 2, py + 7, 28, 4);
          break;
        }
        case T.FIELD: {
          ctx.fillStyle = shade('#8a7440', ((h * 12) | 0) - 6);

          for (let i = 0; i < 4; i++) ctx.fillRect(px, py + 3 + i * 8, TS, 2);
          ctx.fillStyle = '#a8bf55';
          for (let i = 0; i < 4; i++)

        }
        case T.VINE: {
          ctx.fillStyle = grassShade(tx, ty, h); ctx.fillRect(px, py, TS, TS);
          ctx.fillStyle = '#6b4a34';
          ctx.fillRect(px + 5, py + 8, 2, 18); ctx.fillRect(px + 25, py + 8, 2, 18);
          ctx.fillStyle = '#8a6a42'; ctx.fillRect(px + 5, py + 11, 22, 2);
          ctx.fillStyle = '#3f7a3a';
          ctx.beginPath(); ctx.arc(px + 11, py + 15, 6, 0, 6.284); ctx.fill();
          ctx.beginPath(); ctx.arc(px + 21, py + 17, 6.5, 0, 6.284); ctx.fill();
          ctx.fillStyle = '#6b3a72';
          ctx.beginPath(); ctx.arc(px + 14, py + 21, 2.4, 0, 6.284); ctx.fill();
          ctx.beginPath(); ctx.arc(px + 23, py + 23, 2.4, 0, 6.284); ctx.fill();
          break;
        }
        case T.ORE: {
          ctx.fillStyle = shade('#7d6a4c', -6); ctx.fillRect(px, py, TS, TS);
          ctx.fillStyle = 'rgba(0,0,0,.2)';

          ctx.fillStyle = '#6c6f78';
          ctx.beginPath(); ctx.moveTo(px + 3, py + 26); ctx.lineTo(px + 11, py + 10);
          ctx.lineTo(px + 22, py + 8); ctx.lineTo(px + 29, py + 26); ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#878b95';
          ctx.beginPath(); ctx.moveTo(px + 9, py + 26); ctx.lineTo(px + 15, py + 14);
          ctx.lineTo(px + 21, py + 26); ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#d8c45a';
          ctx.fillRect(px + 12, py + 17, 3, 3); ctx.fillRect(px + 19, py + 21, 2.5, 2.5);

        }
        case T.NET: {
          ctx.fillStyle = grassShade(tx, ty, h); ctx.fillRect(px, py, TS, TS);

          ctx.fillRect(px + 2, py + 4, 28, 24);
          ctx.strokeStyle = '#d6c9a8'; ctx.lineWidth = 1;
          ctx.beginPath();
          for (let i = 0; i <= 5; i++) {
            ctx.moveTo(px + 2 + i * 5.6, py + 4); ctx.lineTo(px + 2 + i * 5.6, py + 28);
            ctx.moveTo(px + 2, py + 4 + i * 4.8); ctx.lineTo(px + 30, py + 4 + i * 4.8);

        case T.CART: {
          ctx.fillStyle = grassShade(tx, ty, h); ctx.fillRect(px, py, TS, TS);

          ctx.beginPath(); ctx.ellipse(px + 16, py + 27, 13, 4, 0, 0, 6.284); ctx.fill();
          ctx.fillStyle = '#8a6a42'; ctx.fillRect(px + 3, py + 9, 26, 12);
          ctx.fillStyle = '#a07f52'; ctx.fillRect(px + 3, py + 9, 26, 3);
          ctx.fillStyle = '#5a3f28';
          ctx.beginPath(); ctx.arc(px + 9, py + 23, 5, 0, 6.284); ctx.fill();
          ctx.beginPath(); ctx.arc(px + 23, py + 23, 5, 0, 6.284); ctx.fill();
          ctx.fillStyle = '#8a6a42';
          ctx.beginPath(); ctx.arc(px + 9, py + 23, 1.8, 0, 6.284); ctx.fill();
          ctx.beginPath(); ctx.arc(px + 23, py + 23, 1.8, 0, 6.284); ctx.fill();

        }
        case T.SCARECROW: {
          ctx.fillStyle = shade('#8a7440', -4); ctx.fillRect(px, py, TS, TS);
          ctx.fillStyle = '#6b4a34';
          ctx.fillRect(px + 14, py + 10, 3, 18);
          ctx.fillRect(px + 5, py + 13, 22, 3);
          ctx.fillStyle = '#b5763c';
          ctx.fillRect(px + 9, py + 13, 14, 11);
          ctx.fillStyle = '#d9b64e';
          ctx.beginPath(); ctx.arc(px + 16, py + 8, 5.5, 0, 6.284); ctx.fill();
          ctx.fillStyle = '#8a5a2a';
          ctx.beginPath(); ctx.moveTo(px + 9, py + 5); ctx.lineTo(px + 23, py + 5);
          ctx.lineTo(px + 16, py + 1); ctx.closePath(); ctx.fill();

        }
        case T.BANNER: {
          ctx.fillStyle = grassShade(tx, ty, h); ctx.fillRect(px, py, TS, TS);
          ctx.fillStyle = 'rgba(0,0,0,.18)';
          ctx.beginPath(); ctx.ellipse(px + 12, py + 28, 6, 3, 0, 0, 6.284); ctx.fill();
          ctx.fillStyle = '#5a4a3a'; ctx.fillRect(px + 11, py + 2, 3, 26);
          const wav = Math.sin(t * 2.4 + tx) * 2;
          ctx.fillStyle = '#8c3a3a';
          ctx.beginPath();
          ctx.moveTo(px + 14, py + 4); ctx.lineTo(px + 28 + wav, py + 6);
          ctx.lineTo(px + 24 + wav, py + 12); ctx.lineTo(px + 28 + wav, py + 18);
          ctx.lineTo(px + 14, py + 17); ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#e3c15a';

        case T.FLOOR: {
          ctx.fillStyle = shade('#a37b52', ((h * 12) | 0) - 6);
          ctx.fillRect(px, py, TS, TS);
          ctx.fillStyle = 'rgba(0,0,0,.13)';
          ctx.fillRect(px, py + (h > 0.5 ? 10 : 20), TS, 2);
          break;
        }
        case T.WALL: {
          // muro a graticcio: intonaco chiaro, travi a vista, qualche finestra accesa
          ctx.fillStyle = shade('#c9b394', ((h * 10) | 0) - 5);
          ctx.fillRect(px, py, TS, TS);
          ctx.fillStyle = '#6b4a34';
          ctx.fillRect(px, py, TS, 4); ctx.fillRect(px, py + TS - 4, TS, 4);
          ctx.fillRect(px, py, 3, TS); ctx.fillRect(px + TS - 3, py, 3, TS);
          ctx.fillStyle = 'rgba(107,74,52,.55)';
          ctx.fillRect(px + 14, py + 4, 4, TS - 8);
          const isRf = v => v === T.ROOF || v === T.CHIMNEY;
          const corner = !(isRf(tileAt(area, tx, ty - 1)) || isRf(tileAt(area, tx, ty + 1)) ||
                           isRf(tileAt(area, tx - 1, ty)) || isRf(tileAt(area, tx + 1, ty)));
          if (!corner && !isRf(tileAt(area, tx, ty + 1)) && h > 0.64) {   // una finestra ogni tanto
            ctx.fillStyle = '#4a3527'; ctx.fillRect(px + 7, py + 8, 18, 15);
            const warm = 0.72 + Math.sin(t * 2.3 + tx * 1.7) * 0.10;
            ctx.fillStyle = 'rgba(255,206,120,' + warm + ')';
            ctx.fillRect(px + 9, py + 10, 14, 11);
            ctx.fillStyle = '#4a3527';
            ctx.fillRect(px + 15, py + 10, 2, 11); ctx.fillRect(px + 9, py + 14, 14, 2);

        case T.IWALL: {

          ctx.fillStyle = 'rgba(255,255,255,.09)';
          ctx.fillRect(px, py, TS, 3);

        case T.IDOOR: {

          ctx.fillStyle = '#5a3f28';

          ctx.fillStyle = 'rgba(255,220,180,.20)';

          ctx.fillRect(px + 4, py + TS - 6, TS - 8, 2);

        case T.BED: {
          ctx.fillStyle = shade('#a37b52', -4); ctx.fillRect(px, py, TS, TS);
          const above = tileAt(area, tx, ty - 1) === T.BED;
          const below = tileAt(area, tx, ty + 1) === T.BED;
          ctx.fillStyle = '#6b4a34'; ctx.fillRect(px + 2, py, TS - 4, TS);      // struttura
          if (!above) {                                                          // testiera + cuscino
            ctx.fillStyle = '#7d5636'; ctx.fillRect(px + 2, py, TS - 4, 5);
            ctx.fillStyle = '#f4efe4'; ctx.fillRect(px + 5, py + 6, TS - 10, 9);
            ctx.fillStyle = 'rgba(0,0,0,.10)'; ctx.fillRect(px + 5, py + 13, TS - 10, 2);
            ctx.fillStyle = '#4a6fa5'; ctx.fillRect(px + 4, py + 16, TS - 8, TS - 16);
          } else {
            ctx.fillStyle = '#4a6fa5'; ctx.fillRect(px + 4, py, TS - 8, below ? TS : TS - 5);
            ctx.fillStyle = 'rgba(255,255,255,.10)'; ctx.fillRect(px + 4, py + 6, TS - 8, 2);

          ctx.fillStyle = '#8a6134'; ctx.fillRect(px + 3, py + 8, TS - 6, 10);
          ctx.fillStyle = 'rgba(255,255,255,.10)'; ctx.fillRect(px + 3, py + 8, TS - 6, 2);
          ctx.fillStyle = '#d8cbb0'; ctx.fillRect(px + 8, py + 5, 7, 4);   // pane

        case T.CHAIR: {
          ctx.fillStyle = shade('#a37b52', -4); ctx.fillRect(px, py, TS, TS);

        case T.SHELF: {

          ctx.fillStyle = '#523825'; ctx.fillRect(px + 1, py + 15, TS - 2, 2);
          const books = ['#b5453f', '#3f7bb5', '#c8a53c', '#5aa05e'];
          for (let i = 0; i < 4; i++) {
            ctx.fillStyle = books[(i + (h * 4 | 0)) % 4];

        case T.HEARTH: {
          ctx.fillStyle = '#4a4a52'; ctx.fillRect(px, py, TS, TS);

        case T.POT: {

        case T.SAND: {

          ctx.fillStyle = shade('#7d6a4c', ((h * 16) | 0) - 8);

        }
        case T.DFLOOR: {
          // nei labirinti la pietra è più chiara: i corridoi stretti restano leggibili

        }
        case T.EXIT: {
          ctx.fillStyle = '#4a4460'; ctx.fillRect(px, py, TS, TS);
          ctx.fillStyle = '#cbbde8';
          for (let i = 0; i < 4; i++) ctx.fillRect(px + 4, py + 5 + i * 6, TS - 8 - i * 2, 4);
          break;
        }
        default:
          ctx.fillStyle = '#000';
          ctx.fillRect(px, py, TS, TS);
      }
    }
  }
}

function drawShadow(x, y, rx) {
  ctx.fillStyle = 'rgba(0,0,0,.26)';
  ctx.beginPath(); ctx.ellipse(x, y, rx, rx * 0.45, 0, 0, 6.284); ctx.fill();
}

function drawPlayer(p) {
  const bob = p.moving ? Math.sin(p.walk) * 1.6 : 0;
  drawShadow(p.x, p.y + 10, 10);
  if (p.invul > 0 && ((p.invul * 18) | 0) % 2 === 0) ctx.globalAlpha = 0.45;

  ctx.fillStyle = '#2f6fb5';
  ctx.beginPath(); ctx.roundRect(p.x - 9, p.y - 8 + bob, 18, 18, 5); ctx.fill();
  ctx.fillStyle = '#f0c39a';
  ctx.beginPath(); ctx.arc(p.x, p.y - 12 + bob, 8, 0, 6.284); ctx.fill();
  ctx.fillStyle = '#4a3527';
  ctx.beginPath(); ctx.arc(p.x, p.y - 14 + bob, 8, Math.PI, 6.284); ctx.fill();
  if (p.dir !== 'up') {
    ctx.fillStyle = '#20242c';
    const ex = p.dir === 'left' ? -3 : p.dir === 'right' ? 3 : 0;
    ctx.fillRect(p.x - 3 + ex, p.y - 12 + bob, 2, 3);
    ctx.fillRect(p.x + 2 + ex, p.y - 12 + bob, 2, 3);
  }
  ctx.globalAlpha = 1;

  if (p.atk) {
    const prog = Math.min(1, p.atk.t / p.atk.dur);
    const base = dirAngle(p.atk.dir);
    const a = base + (-1.15 + 2.3 * prog);
    ctx.save();
    ctx.translate(p.x, p.y - 2 + bob);
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.5 * (1 - prog) + 0.16) + ')';
    ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, 0, 32, base - 1.15, a); ctx.stroke();
    ctx.rotate(a);
    ctx.fillStyle = '#4a3527'; ctx.fillRect(8, -2, 8, 4);
    ctx.fillStyle = '#d9dee8'; ctx.fillRect(16, -2.5, 24, 5);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(16, -2.5, 24, 2);
    ctx.restore();
  } else {
    const a = dirAngle(p.dir) + 2.2;
    ctx.save();
    ctx.translate(p.x, p.y + 2 + bob);
    ctx.rotate(a);
    ctx.fillStyle = '#8e94a3'; ctx.fillRect(4, -1.5, 17, 3);
    ctx.fillStyle = '#4a3527'; ctx.fillRect(1, -2, 5, 4);
    ctx.restore();
  }
}

function drawNpc(n) {
  const bob = n.moving ? Math.sin(n.walk) * 1.5 : 0;
  drawShadow(n.x, n.y + 9, 9);
  ctx.fillStyle = n.body;
  ctx.beginPath(); ctx.roundRect(n.x - 8, n.y - 7 + bob, 16, 16, 5); ctx.fill();
  ctx.fillStyle = '#eec49c';
  ctx.beginPath(); ctx.arc(n.x, n.y - 11 + bob, 7, 0, 6.284); ctx.fill();
  ctx.fillStyle = n.hat;
  ctx.beginPath(); ctx.arc(n.x, n.y - 13 + bob, 7.5, Math.PI, 6.284); ctx.fill();
  ctx.fillRect(n.x - 9, n.y - 14 + bob, 18, 2);
  if (n.dir !== 'up') {
    ctx.fillStyle = '#20242c';
    const ex = n.dir === 'left' ? -2 : n.dir === 'right' ? 2 : 0;
    ctx.fillRect(n.x - 3 + ex, n.y - 11 + bob, 2, 2);
    ctx.fillRect(n.x + 2 + ex, n.y - 11 + bob, 2, 2);
  }
  const p = game.player;
  if (!n.talking && Math.hypot(p.x - n.x, p.y - n.y) < 58) {
    ctx.fillStyle = 'rgba(255,255,255,' + (0.55 + Math.sin(game.time * 5) * 0.25) + ')';
    ctx.font = 'bold 13px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('S', n.x, n.y - 24 + bob);
  }
}

function drawAnimal(a) {
  const step = a.moving ? Math.sin(a.walk) : 0;
  const bob = a.moving ? Math.abs(step) * 1.4 : Math.sin(a.bob) * 0.5;
  const flip = a.dir === 'left' ? -1 : 1;
  drawShadow(a.x, a.y + a.r * 0.75, a.r * 0.8);
  const y = a.y - bob;

  ctx.save();
  ctx.translate(a.x, y);
  ctx.scale(flip, 1);

  switch (a.type) {
    case 'gallina':
      ctx.fillStyle = a.color2;                                    // zampe
      ctx.fillRect(-2, 3, 1.5, 4 - step); ctx.fillRect(1.5, 3, 1.5, 4 + step);
      ctx.fillStyle = a.color;
      ctx.beginPath(); ctx.ellipse(0, 0, 6, 5, 0, 0, 6.284); ctx.fill();
      ctx.beginPath(); ctx.arc(4.5, -4, 3, 0, 6.284); ctx.fill();   // testa
      ctx.fillStyle = a.color2;
      ctx.beginPath(); ctx.arc(4.5, -7, 1.6, 0, 6.284); ctx.fill(); // cresta
      ctx.fillStyle = '#e8a53c'; ctx.fillRect(7, -4, 3, 1.6);       // becco
      ctx.fillStyle = '#2a2622'; ctx.fillRect(5, -5, 1.4, 1.4);
      break;
    case 'oca':
      ctx.fillStyle = a.color2;
      ctx.fillRect(-2, 4, 1.5, 3 - step); ctx.fillRect(1.5, 4, 1.5, 3 + step);
      ctx.fillStyle = a.color;
      ctx.beginPath(); ctx.ellipse(-1, 1, 7, 5, 0, 0, 6.284); ctx.fill();
      ctx.fillRect(3, -8, 3, 8);                                    // collo
      ctx.beginPath(); ctx.arc(5, -9, 3, 0, 6.284); ctx.fill();
      ctx.fillStyle = '#e8a53c'; ctx.fillRect(7.5, -9, 3.5, 1.8);
      ctx.fillStyle = '#2a2622'; ctx.fillRect(5.5, -10, 1.3, 1.3);
      break;
    case 'maiale':
      ctx.fillStyle = a.color2;
      ctx.fillRect(-4, 5, 2, 3 - step); ctx.fillRect(2, 5, 2, 3 + step);
      ctx.fillStyle = a.color;
      ctx.beginPath(); ctx.ellipse(0, 0, 9, 6.5, 0, 0, 6.284); ctx.fill();
      ctx.beginPath(); ctx.arc(7, -1, 4.5, 0, 6.284); ctx.fill();
      ctx.fillStyle = a.color2;
      ctx.beginPath(); ctx.ellipse(10.5, -1, 2.2, 2, 0, 0, 6.284); ctx.fill(); // grugno
      ctx.beginPath(); ctx.moveTo(5, -5); ctx.lineTo(8, -7); ctx.lineTo(8, -3.5); ctx.fill();
      ctx.fillStyle = '#2a2622'; ctx.fillRect(7.5, -3, 1.3, 1.3);
      break;
    case 'pecora':
      ctx.fillStyle = a.color2;
      ctx.fillRect(-4, 5, 2, 4 - step); ctx.fillRect(2, 5, 2, 4 + step);
      ctx.fillStyle = a.color;
      ctx.beginPath();
      ctx.arc(-4, 0, 5, 0, 6.284); ctx.arc(0, -2, 5.5, 0, 6.284);
      ctx.arc(4, 0, 5, 0, 6.284); ctx.arc(1, 2, 5, 0, 6.284); ctx.fill();
      ctx.fillStyle = a.color2;
      ctx.beginPath(); ctx.ellipse(8, -1, 3.4, 3, 0, 0, 6.284); ctx.fill();
      ctx.fillStyle = '#f2efe8'; ctx.fillRect(9.4, -2, 1.2, 1.2);
      break;
    case 'capra':
      ctx.fillStyle = a.color2;
      ctx.fillRect(-4, 4, 1.8, 4 - step); ctx.fillRect(2.2, 4, 1.8, 4 + step);
      ctx.fillStyle = a.color;
      ctx.beginPath(); ctx.ellipse(-1, 0, 8, 5, 0, 0, 6.284); ctx.fill();
      ctx.beginPath(); ctx.ellipse(6.5, -3, 4, 3.2, -0.3, 0, 6.284); ctx.fill();
      ctx.fillStyle = a.color2;
      ctx.fillRect(5, -7, 1.4, 3.5); ctx.fillRect(7.5, -7.5, 1.4, 3.5);   // corna
      ctx.fillRect(-9, -3, 3, 1.4);                                        // coda
      ctx.fillStyle = '#2a2622'; ctx.fillRect(8, -3.5, 1.3, 1.3);
      break;
    case 'cane':
      ctx.fillStyle = a.color2;
      ctx.fillRect(-4, 4, 1.8, 4 - step); ctx.fillRect(2.2, 4, 1.8, 4 + step);
      ctx.fillStyle = a.color;
      ctx.beginPath(); ctx.ellipse(-1, 0, 7.5, 4.6, 0, 0, 6.284); ctx.fill();
      ctx.beginPath(); ctx.arc(6, -3, 4, 0, 6.284); ctx.fill();
      ctx.fillStyle = a.color2;
      ctx.beginPath(); ctx.moveTo(4, -6); ctx.lineTo(4, -10); ctx.lineTo(7.5, -6); ctx.fill();
      ctx.save();                                                          // coda scodinzolante
      ctx.translate(-8, -2); ctx.rotate(Math.sin(game.time * 9) * 0.5);
      ctx.fillRect(-4, -1, 5, 2); ctx.restore();
      ctx.fillStyle = '#2a2622'; ctx.fillRect(8, -4, 1.4, 1.4);
      ctx.fillRect(9, -1.6, 2, 1.6);
      break;
    default: /* gatto */
      ctx.fillStyle = a.color;
      ctx.beginPath(); ctx.ellipse(-1, 1, 6, 3.6, 0, 0, 6.284); ctx.fill();
      ctx.beginPath(); ctx.arc(5, -2, 3.2, 0, 6.284); ctx.fill();
      ctx.beginPath(); ctx.moveTo(3, -4.5); ctx.lineTo(3.6, -7.5); ctx.lineTo(5.6, -5); ctx.fill();
      ctx.beginPath(); ctx.moveTo(5.6, -5); ctx.lineTo(7.6, -7.5); ctx.lineTo(7.8, -4.5); ctx.fill();
      ctx.save();
      ctx.translate(-6.5, 0); ctx.rotate(-0.7 + Math.sin(game.time * 3 + a.bob) * 0.3);
      ctx.fillRect(-6, -1, 7, 1.8); ctx.restore();
      ctx.fillStyle = '#c8d84a'; ctx.fillRect(6, -3, 1.2, 1.2);
      ctx.fillStyle = a.color2;
      ctx.fillRect(-4, 3.5, 1.5, 2 - step); ctx.fillRect(1, 3.5, 1.5, 2 + step);
      break;
  }
  ctx.restore();
}

function drawMonster(m) {
  const bob = Math.sin(m.bob) * 2;
  drawShadow(m.x, m.y + m.r * 0.8, m.r * 0.85);
  const body = m.flash > 0 ? '#ffffff' : m.color;

  ctx.fillStyle = body;
  if (m.type === 'slime') {
    ctx.beginPath();
    ctx.ellipse(m.x, m.y + 2 + bob * 0.4, m.r, m.r * 0.85 - bob * 0.2, 0, 0, 6.284);
    ctx.fill();
  } else if (m.type === 'wisp' || m.type === 'wraith') {
    ctx.globalAlpha = 0.9;
    ctx.beginPath(); ctx.arc(m.x, m.y + bob, m.r, 0, 6.284); ctx.fill();
    ctx.globalAlpha = 0.35;
    ctx.beginPath(); ctx.arc(m.x, m.y + bob, m.r + 5, 0, 6.284); ctx.fill();
    ctx.globalAlpha = 1;
  } else if (m.type === 'skeleton') {
    ctx.beginPath(); ctx.roundRect(m.x - m.r * 0.6, m.y - 4 + bob, m.r * 1.2, m.r, 3); ctx.fill();
    ctx.beginPath(); ctx.arc(m.x, m.y - 9 + bob, m.r * 0.62, 0, 6.284); ctx.fill();
    ctx.fillStyle = m.flash > 0 ? '#ffffff' : m.dark;
    ctx.fillRect(m.x - m.r * 0.6, m.y - 2 + bob, m.r * 1.2, 1.5);
  } else {
    ctx.beginPath(); ctx.roundRect(m.x - m.r, m.y - m.r + 2 + bob, m.r * 2, m.r * 1.9, 6); ctx.fill();
  }
  ctx.fillStyle = m.flash > 0 ? '#c04040' : (m.type === 'skeleton' ? '#c9412f' : '#1c1b26');
  const ey = m.y - (m.type === 'skeleton' ? 10 : 2) + bob;
  ctx.fillRect(m.x - 5, ey, 3, 3);
  ctx.fillRect(m.x + 2, ey, 3, 3);

  if (m.hp < m.maxHp) {
    const w = m.r * 2;
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.fillRect(m.x - w / 2, m.y - m.r - 11, w, 4);
    ctx.fillStyle = '#e0574f';
    ctx.fillRect(m.x - w / 2, m.y - m.r - 11, w * Math.max(0, m.hp / m.maxHp), 4);
  }
}

function drawItem(it) {
  const y = it.y - 4 + Math.sin(it.bob) * 3;
  const fade = it.life < 4 ? (Math.sin(it.life * 12) * 0.4 + 0.6) : 1;
  ctx.globalAlpha = fade;
  if (it.type === 'heart') {
    ctx.fillStyle = '#e8465a';
    ctx.beginPath();
    ctx.arc(it.x - 3.4, y - 2, 3.8, 0, 6.284);
    ctx.arc(it.x + 3.4, y - 2, 3.8, 0, 6.284);
    ctx.moveTo(it.x - 7, y - 0.5); ctx.lineTo(it.x, y + 7.5); ctx.lineTo(it.x + 7, y - 0.5);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.fillRect(it.x - 4, y - 4, 2, 2);
  } else {
    ctx.fillStyle = '#ffd766';
    ctx.beginPath(); ctx.ellipse(it.x, y, 5.5, 6.5, 0, 0, 6.284); ctx.fill();
    ctx.fillStyle = '#c99a1e';
    ctx.beginPath(); ctx.ellipse(it.x, y, 2.6, 3.6, 0, 0, 6.284); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawEffects() {
  for (const q of game.particles) {
    ctx.globalAlpha = Math.max(0, q.life / q.max);
    ctx.fillStyle = q.color;
    ctx.fillRect(q.x - q.r, q.y - q.r, q.r * 2, q.r * 2);
  }
  ctx.globalAlpha = 1;
  ctx.font = 'bold 13px ui-monospace, monospace';
  ctx.textAlign = 'center';
  for (const f of game.floats) {
    ctx.globalAlpha = Math.max(0, f.life / f.max);
    ctx.fillStyle = 'rgba(0,0,0,.6)';
    ctx.fillText(f.text, f.x + 1, f.y + 1);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function renderWorld() {
  const p = game.player;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = game.area.kind === 'dungeon' ? '#0a0910'
                : game.area.kind === 'house' ? '#120e0c' : '#1d3f5e';
  ctx.fillRect(0, 0, VW, VH);

  const camX = Math.round(game.cam.x), camY = Math.round(game.cam.y);
  ctx.save();
  ctx.translate(Math.round(VW / 2 - camX), Math.round(VH / 2 - camY));

  drawTiles(game.area, camX, camY);
  for (const it of game.area.items) drawItem(it);

  const actors = [];
  const onScreen = e => Math.abs(e.x - camX) < VW / 2 + 60 && Math.abs(e.y - camY) < VH / 2 + 60;
  for (const n of game.area.npcs) if (onScreen(n)) actors.push(n);
  for (const a of game.area.animals) if (onScreen(a)) actors.push(a);
  for (const m of game.area.monsters) if (onScreen(m)) actors.push(m);
  actors.push(p);
  actors.sort((a, b) => a.y - b.y);
  for (const a of actors) {
    if (a.kind === 'player') drawPlayer(a);
    else if (a.kind === 'npc') drawNpc(a);
    else if (a.kind === 'animal') drawAnimal(a);
    else drawMonster(a);
  }

  drawEffects();
  ctx.restore();

  if (game.area.dark) {
    const cx = VW / 2 + (p.x - camX), cy = VH / 2 + (p.y - camY);
    const g = ctx.createRadialGradient(cx, cy, 30, cx, cy, 260);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.55, 'rgba(0,0,0,.45)');
    g.addColorStop(1, 'rgba(0,0,0,.93)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, VW, VH);
  }
  // calore del camino, contenuto dentro le mura della stanza
  if (game.area.kind === 'house' && game.area.hearth) {
    const hx = VW / 2 + ((game.area.hearth.x + 0.5) * TS - camX);
    const hy = VH / 2 + ((game.area.hearth.y + 0.5) * TS - camY);
    const rx = VW / 2 + (TS - camX), ry = VH / 2 + (TS - camY);
    const flick = 90 + Math.sin(game.time * 7) * 12;
    const g = ctx.createRadialGradient(hx, hy, 8, hx, hy, flick + 60);
    g.addColorStop(0, 'rgba(255,170,70,.22)');
    g.addColorStop(1, 'rgba(255,170,70,0)');
    ctx.save();
    ctx.beginPath();
    ctx.rect(rx, ry, (game.area.w - 2) * TS, (game.area.h - 2) * TS);
    ctx.clip();
    ctx.fillStyle = g;
    ctx.fillRect(rx, ry, (game.area.w - 2) * TS, (game.area.h - 2) * TS);
    ctx.restore();
  }
}

/* ---------------- mappa del mondo con fog of war ---------------- */
function renderMap() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = 'rgba(6,8,12,.94)';
  ctx.fillRect(0, 0, VW, VH);

  const padX = 44, padTop = 62, padBot = 46;
  const scale = Math.min((VW - padX * 2) / WORLD_W, (VH - padTop - padBot) / WORLD_H);
  const dw = WORLD_W * scale, dh = WORLD_H * scale;
  const ox = (VW - dw) / 2, oy = padTop + ((VH - padTop - padBot) - dh) / 2;

  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(game.mapCanvas, ox, oy, dw, dh);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(game.fogCanvas, ox, oy, dw, dh);

  ctx.strokeStyle = '#414c66'; ctx.lineWidth = 2;
  ctx.strokeRect(ox - 1, oy - 1, dw + 2, dh + 2);

  const seen = (tx, ty) => game.explored[ty * WORLD_W + tx] === 1;
  const mx = tx => ox + tx * scale, my = ty => oy + ty * scale;

  // insediamenti già visti
  ctx.textAlign = 'center';
  ctx.font = 'bold 11px ui-monospace, monospace';
  for (const s of game.settlements) {
    if (!seen(s.x, s.y)) continue;
    const x = mx(s.x), y = my(s.y);
    const r = s.kind === 'city' ? 4 : 3;
    ctx.fillStyle = '#1a1206';
    ctx.fillRect(x - r - 1, y - r - 1, r * 2 + 2, r * 2 + 2);
    ctx.fillStyle = s.kind === 'city' ? '#ffd766' : '#e4b05a';
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
    ctx.fillStyle = 'rgba(0,0,0,.75)';
    ctx.fillText(s.name, x + 1, y - r - 4 + 1);
    ctx.fillStyle = '#ffe9a8';
    ctx.fillText(s.name, x, y - r - 4);
  }
  // ingressi dei sotterranei già visti — colore diverso per cripte e labirinti
  ctx.font = 'bold 10px ui-monospace, monospace';
  for (const pt of game.portals) {
    if (!seen(pt.tx, pt.ty)) continue;
    const x = mx(pt.tx), y = my(pt.ty);
    ctx.fillStyle = '#0d0716';
    ctx.beginPath(); ctx.arc(x, y, 5.5, 0, 6.284); ctx.fill();
    ctx.fillStyle = pt.type === 'maze' ? '#ff9a5c' : '#c9a6ff';
    ctx.beginPath();
    ctx.moveTo(x, y - 4); ctx.lineTo(x + 4, y); ctx.lineTo(x, y + 4); ctx.lineTo(x - 4, y);
    ctx.closePath(); ctx.fill();
    const lab = pt.type === 'maze' ? 'labirinto' : 'cripta';
    ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillText(lab, x + 1, y + 16);
    ctx.fillStyle = pt.type === 'maze' ? '#ffc9a4' : '#ddc9ff';
    ctx.fillText(lab, x, y + 15);
  }
  ctx.font = 'bold 11px ui-monospace, monospace';
  // posizione del giocatore
  const px = mx(game.player.x / TS), py = my(game.player.y / TS);
  const pulse = 6 + Math.sin(game.time * 5) * 2.5;
  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(px, py, pulse, 0, 6.284); ctx.stroke();
  ctx.fillStyle = '#ff5a5a';
  ctx.beginPath(); ctx.arc(px, py, 3.2, 0, 6.284); ctx.fill();

  // intestazione e legenda
  ctx.textAlign = 'center';
  ctx.font = 'bold 20px ui-monospace, monospace';
  ctx.fillStyle = '#ffd766';
  ctx.fillText('MAPPA DEL MONDO', VW / 2, 34);
  ctx.font = '12px ui-monospace, monospace';
  ctx.fillStyle = '#8f9ab2';
  const explored = countExplored();
  const here = game.area.kind === 'overworld'
    ? nearSettlement(Math.floor(game.player.x / TS), Math.floor(game.player.y / TS), 4) : null;
  const sub = game.area.kind === 'overworld'
    ? 'Ti trovi a: ' + game.placeName + (here ? ' (' + THEMES[here.theme].label + ')' : '')
    : (game.area.kind === 'house' ? 'Sei al chiuso — la mappa mostra la tua ultima posizione all’aperto'
                                  : 'Sei sottoterra — la mappa mostra la tua ultima posizione all’aperto');
  ctx.fillText(sub + '  ·  esplorato ' + explored + '%', VW / 2, 52);
  ctx.fillStyle = '#6f7a90';
  ctx.fillText('W o Esc per chiudere  ·  le zone mai raggiunte restano nere', VW / 2, VH - 20);
}
let exploredCache = { n: -1, pct: '0' };
function countExplored() {
  if (game.fogDirty || exploredCache.n < 0) {
    let n = 0;
    const ex = game.explored;
    for (let i = 0; i < ex.length; i += 13) if (ex[i]) n++;
    const raw = n / (ex.length / 13) * 100;
    // sotto il 10% una cifra decimale, altrimenti «0%» per mezz'ora di gioco
    exploredCache = { n, pct: (raw < 10 ? raw.toFixed(1) : Math.round(raw).toString()).replace('.', ',') };
  }
  return exploredCache.pct;
}

/* ============================================================
   CICLO PRINCIPALE
   ============================================================ */
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  game.time += dt;

  if (game.state === 'play') {
    updatePlayer(dt);
    updateAttack(dt);
    updateNpcs(dt);
    updateAnimals(dt);
    updateMonsters(dt);
    spawnWildMonsters(dt);
    updateEffects(dt);

    const p = game.player;
    const k = 1 - Math.exp(-7 * dt);
    game.cam.x += (p.x - game.cam.x) * k;
    game.cam.y += (p.y - game.cam.y) * k;
    clampCamera();
  }

  renderWorld();
  if (game.state === 'map') renderMap();

  requestAnimationFrame(frame);
}

document.getElementById('restartBtn').addEventListener('click', () => startGame(WORLD_SEED));

startGame(WORLD_SEED);
requestAnimationFrame(frame);
</script>
