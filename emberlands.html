<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emberlands</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #10131a; color: #eee;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
  }
  #game { display: block; width: 100vw; height: 100vh; }

  .overlay { position: fixed; pointer-events: none; user-select: none; }

  /* ---- barra vita / stato ---- */
  #hud { left: 14px; top: 12px; width: 280px; }
  #hpFrame {
    width: 100%; height: 20px; border: 2px solid #0c0e13;
    background: #2a1416; border-radius: 4px; overflow: hidden;
    box-shadow: 0 2px 0 rgba(0,0,0,.5);
  }
  #hpFill {
    height: 100%; width: 100%;
    background: linear-gradient(#f4685f, #b32d33);
    transition: width .12s linear;
  }
  #hudRow {
    display: flex; gap: 14px; align-items: center;
    margin-top: 6px; font-size: 12px; letter-spacing: .5px;
    text-shadow: 0 1px 2px #000;
  }
  #hudRow > span { white-space: nowrap; }
  #hudRow b { color: #ffd766; font-weight: 700; }
  #place { color: #cfd6e6; }

  /* ---- comandi ---- */
  #hint {
    left: 14px; bottom: 12px; font-size: 12px; line-height: 1.6;
    color: #b9c2d4; text-shadow: 0 1px 2px #000;
    background: rgba(10,12,18,.55); border: 1px solid rgba(255,255,255,.08);
    border-radius: 6px; padding: 8px 11px;
  }
  #hint span { color: #ffd766; }

  /* ---- dialogo ---- */
  #dialog {
    left: 50%; transform: translateX(-50%); bottom: 26px;
    width: min(620px, calc(100vw - 60px));
    background: rgba(14,17,25,.94);
    border: 2px solid #414c66; border-radius: 8px;
    padding: 14px 16px; display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,.55);
  }
  #dialog.on { display: block; }
  #dlgName { color: #7fd6a2; font-size: 13px; margin-bottom: 6px; }
  #dlgText { font-size: 14px; line-height: 1.5; color: #eef1f7; }
  #dlgTip { font-size: 11px; color: #7d879b; margin-top: 9px; }

  /* ---- pannelli a schermo intero ---- */
  #death, #pause {
    inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column;
  }
  #death.on, #pause.on { display: flex; pointer-events: auto; }
  #death { background: rgba(8,4,6,.78); }
  #pause { background: rgba(6,8,13,.72); }

  #death h1 {
    margin: 0 0 6px; font-size: 54px; letter-spacing: 8px; color: #e2494c;
    text-shadow: 0 0 26px rgba(226,73,76,.5);
  }
  #death p { margin: 4px 0 20px; color: #b9c2d4; font-size: 14px; }

  .panel {
    background: rgba(16,19,28,.97); border: 2px solid #414c66; border-radius: 10px;
    padding: 22px 24px; min-width: 320px; box-shadow: 0 14px 40px rgba(0,0,0,.6);
  }
  .panel h2 {
    margin: 0 0 16px; font-size: 20px; letter-spacing: 6px; color: #ffd766;
    text-align: center; font-weight: 700;
  }
  .panel button {
    display: block; width: 100%; font: inherit; font-size: 14px; cursor: pointer;
    padding: 11px 16px; margin-bottom: 8px; text-align: left;
    color: #eef1f7; background: #232a3a;
    border: 1px solid #3a4560; border-radius: 6px;
  }
  .panel button:hover:not(:disabled) { background: #2f3950; border-color: #5b6a90; }
  .panel button:disabled { opacity: .38; cursor: default; }
  .panel button b { color: #ffd766; }
  #pauseInfo {
    font-size: 11px; color: #7d879b; margin-top: 12px; line-height: 1.6;
    border-top: 1px solid #2a3145; padding-top: 10px;
  }
  #death button {
    width: auto; text-align: center; font-size: 15px; padding: 11px 26px;
    color: #10131a; background: #ffd766; border: 0; border-radius: 6px; letter-spacing: 1px;
  }
  #death button:hover { background: #ffe49a; }

  #toast {
    left: 50%; transform: translateX(-50%); top: 22px;
    background: rgba(16,19,28,.95); border: 1px solid #4a5a80; border-radius: 6px;
    padding: 9px 16px; font-size: 13px; color: #ffd766; display: none;
  }
  #toast.on { display: block; }

  /* l'HUD sparisce quando è aperta la mappa o la pausa */
  #hud.hidden, #hint.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="overlay">
  <div id="hpFrame"><div id="hpFill"></div></div>
  <div id="hudRow"><span>VITA <b id="hpText">100/100</b></span><span>ORO <b id="goldText">0</b></span><span id="place">Terre Selvagge</span></div>
</div>

<div id="hint" class="overlay"></div>

<div id="dialog" class="overlay">
  <div id="dlgName">Abitante</div>
  <div id="dlgText">...</div>
  <div id="dlgTip">Spazio / S / Esc per chiudere</div>
</div>

<div id="toast" class="overlay"></div>

<div id="pause" class="overlay">
  <div class="panel">
    <h2>PAUSA</h2>
    <button data-act="resume">Riprendi</button>
    <button data-act="save">Salva partita</button>
    <button data-act="load">Carica partita</button>
    <button data-act="new">Nuova partita</button>
    <div id="pauseInfo"></div>
  </div>
</div>

<div id="death" class="overlay">
  <h1>SEI MORTO</h1>
  <p>Le Emberlands non perdonano.</p>
  <button id="restartBtn">RICOMINCIA &nbsp;(R)</button>
</div>

<script>
'use strict';

/* ============================================================
   Emberlands — piccolo RPG 2D in un solo file
   ============================================================ */

const TS = 32;                       // lato di un tile in pixel
const WORLD_W = 512, WORLD_H = 512;  // mondo esterno in tile (16384 x 16384 px)
const SAVE_KEY = 'emberlands.save.v3';

/* Il mondo è FISSO: un solo seme per sempre. Terreno, coste, boschi, paesi, temi,
   case, arredi, sotterranei, posizioni di NPC e animali e battute di ognuno
   discendono tutti da qui, quindi ogni partita ritrova le Emberlands identiche. */
const WORLD_SEED = 20260905;

/* ---------------- tile ---------------- */
const T = {
  GRASS: 0, DIRT: 1, SAND: 2, WATER: 3, TREE: 4, ROCK: 5, BUSH: 6,
  PATH: 7, BRIDGE: 8, FLOOR: 9, WALL: 10, DOOR: 11,
  DFLOOR: 12, DWALL: 13, ENTRANCE: 14, EXIT: 15,
  ROOF: 16, IWALL: 17, IDOOR: 18, RUG: 19,
  BED: 20, TABLE: 21, CHAIR: 22, SHELF: 23, HEARTH: 24, BARREL: 25, POT: 26, CHEST: 27,
  /* arredo urbano e decori di paese */
  COBBLE: 28, FOUNTAIN: 29, WELL: 30, STATUE: 31, LAUNDRY: 32, FLOWERS: 33,
  FENCE: 34, CRATE: 35, HAY: 36, STALL: 37, SIGN: 38, LAMP: 39, BENCH: 40,
  FIELD: 41, VINE: 42, ORE: 43, NET: 44, CART: 45, SCARECROW: 46, BANNER: 47,
  CHIMNEY: 48
};
const SOLID = new Uint8Array(64);
[T.WATER, T.TREE, T.ROCK, T.WALL, T.DWALL, T.ROOF, T.IWALL,
 T.BED, T.TABLE, T.CHAIR, T.SHELF, T.HEARTH, T.BARREL, T.POT, T.CHEST,
 T.FOUNTAIN, T.WELL, T.STATUE, T.LAUNDRY, T.FENCE, T.CRATE, T.HAY, T.STALL,
 T.SIGN, T.LAMP, T.BENCH, T.VINE, T.ORE, T.CART, T.SCARECROW, T.BANNER, T.CHIMNEY
].forEach(t => SOLID[t] = 1);
/* calpestabili ma decorati: COBBLE, FLOWERS, FIELD, NET */

/* ---------------- rumore deterministico ---------------- */
function hash01(x, y, s) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(s | 0, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash01(xi, yi, s), b = hash01(xi + 1, yi, s);
  const c = hash01(xi, yi + 1, s), d = hash01(xi + 1, yi + 1, s);
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}
function fbm(x, y, s, oct) {
  let amp = 1, f = 1, sum = 0, norm = 0;
  for (let i = 0; i < oct; i++) {
    sum += amp * vnoise(x * f, y * f, s + i * 977);
    norm += amp; amp *= 0.5; f *= 2;
  }
  return sum / norm;
}
function makeRng(seed) {
  let s = seed >>> 0 || 1;
  return function () {
    s ^= s << 13; s >>>= 0;
    s ^= s >> 17;
    s ^= s << 5; s >>>= 0;
    return s / 4294967296;
  };
}

/* ============================================================
   STATO DEL GIOCO — tutto vive su questo unico oggetto
   ============================================================ */
const game = {
  seed: 1337,
  time: 0,
  state: 'play',            // 'play' | 'paused' | 'map' | 'dead'
  areas: {},                // id -> area
  areaId: 'overworld',
  area: null,
  settlements: [],
  portals: [],              // ingressi dei dungeon sulla mappa esterna
  doorIndex: null,          // indice tile porta -> {si, bi}
  explored: null,           // Uint8Array: fog of war del mondo esterno
  mapCanvas: null,          // colori del mondo, 1 px per tile
  fogCanvas: null,          // maschera nera delle zone mai viste
  fogDirty: true,
  lastRevealTile: -1,
  player: null,
  lines: null,              // battuta di ogni NPC, decisa alla nascita del mondo
  cam: { x: 0, y: 0 },
  keys: Object.create(null),
  particles: [],
  floats: [],
  dialog: null,
  transitionLock: false,
  spawnTimer: 0,
  placeName: 'Terre Selvagge',
  memorySave: null          // riserva se localStorage non è disponibile
};

/* ============================================================
   AREE
   ============================================================ */
function makeArea(id, kind, w, h) {
  return {
    id, kind, w, h,
    tiles: new Uint8Array(w * h),
    npcs: [], monsters: [], items: [], animals: [],
    dark: kind === 'dungeon'
  };
}
function tileAt(area, tx, ty) {
  if (tx < 0 || ty < 0 || tx >= area.w || ty >= area.h) return T.WATER;
  return area.tiles[ty * area.w + tx];
}
function setTile(area, tx, ty, v) {
  if (tx < 0 || ty < 0 || tx >= area.w || ty >= area.h) return;
  area.tiles[ty * area.w + tx] = v;
}
function isWalkable(area, tx, ty) { return !SOLID[tileAt(area, tx, ty)]; }

/* ============================================================
   GENERAZIONE DEL MONDO ESTERNO
   ============================================================ */
function generateOverworld(seed) {
  const area = makeArea('overworld', 'overworld', WORLD_W, WORLD_H);
  const tiles = area.tiles;

  for (let y = 0; y < WORLD_H; y++) {
    const ny = (y / WORLD_H) * 2 - 1;
    for (let x = 0; x < WORLD_W; x++) {
      const nx = (x / WORLD_W) * 2 - 1;
      const d = Math.max(Math.abs(nx), Math.abs(ny));
      const fall = d < 0.74 ? 0 : Math.min(1, (d - 0.74) / 0.26) ** 1.6;

      let e = fbm(x / 78, y / 78, seed, 4) - fall * 0.85;
      const m = fbm(x / 42, y / 42, seed + 5501, 3);
      const r = hash01(x, y, seed + 91);

      let t;
      if (e < 0.36) t = T.WATER;
      else if (e < 0.385) t = T.SAND;
      else if (e > 0.70) t = (r < 0.55 ? T.ROCK : T.DIRT);
      else {
        t = T.GRASS;
        // la densità del bosco resta sotto la soglia che murerebbe il giocatore
        const forest = m * 0.72 + fbm(x / 13, y / 13, seed + 313, 2) * 0.44;
        if (forest > 0.58) {
          const dens = Math.min(0.42, (forest - 0.58) * 2.4);
          if (r < dens) t = T.TREE;
          else if (r < dens + 0.12) t = T.BUSH;
        } else if (m < 0.32 && r < 0.045) t = T.ROCK;
      }
      tiles[y * WORLD_W + x] = t;
    }
  }

  buildSettlements(area, seed);
  buildRoads(area, seed);
  repairVillagePaths(area);
  buildDungeonEntrances(area, seed);
  return area;
}

/** insieme delle caselle raggiungibili a piedi partendo da (sx, sy) */
function reachableFrom(area, sx, sy) {
  const W = area.w, H = area.h;
  const seen = new Uint8Array(W * H);
  let start = -1;
  for (let r = 0; r < 10 && start < 0; r++)
    for (let dy = -r; dy <= r && start < 0; dy++)
      for (let dx = -r; dx <= r; dx++)
        if (!SOLID[tileAt(area, sx + dx, sy + dy)]) { start = (sy + dy) * W + (sx + dx); break; }
  if (start < 0) return seen;
  const q = [start]; seen[start] = 1;
  while (q.length) {
    const i = q.pop(), x = i % W, y = (i / W) | 0;
    if (x > 0)     { const j = i - 1; if (!seen[j] && !SOLID[area.tiles[j]]) { seen[j] = 1; q.push(j); } }
    if (x < W - 1) { const j = i + 1; if (!seen[j] && !SOLID[area.tiles[j]]) { seen[j] = 1; q.push(j); } }
    if (y > 0)     { const j = i - W; if (!seen[j] && !SOLID[area.tiles[j]]) { seen[j] = 1; q.push(j); } }
    if (y < H - 1) { const j = i + W; if (!seen[j] && !SOLID[area.tiles[j]]) { seen[j] = 1; q.push(j); } }
  }
  return seen;
}

/** scava il viottolo più corto da (sx,sy) fino alla rete già raggiungibile, aggirando gli edifici */
function connectToNetwork(area, sx, sy, seen) {
  const W = area.w, H = area.h;
  const blocked = t => t === T.WALL || t === T.ROOF || t === T.CHIMNEY || t === T.DOOR;
  const prev = new Int32Array(W * H).fill(-1);
  const start = sy * W + sx;
  if (blocked(area.tiles[start])) return false;
  const visited = new Uint8Array(W * H);
  visited[start] = 1;
  let queue = [start], next = [], goal = -1;
  while (queue.length && goal < 0) {
    for (const i of queue) {
      if (seen[i]) { goal = i; break; }
      const x = i % W, y = (i / W) | 0;
      const push = j => {
        if (visited[j] || blocked(area.tiles[j])) return;
        visited[j] = 1; prev[j] = i; next.push(j);
      };
      if (x > 0) push(i - 1);
      if (x < W - 1) push(i + 1);
      if (y > 0) push(i - W);
      if (y < H - 1) push(i + W);
    }
    if (goal >= 0) break;
    queue = next; next = [];
  }
  if (goal < 0) return false;
  for (let i = goal; i !== -1 && i !== start; i = prev[i]) {
    if (area.tiles[i] === T.COBBLE) continue;
    area.tiles[i] = area.tiles[i] === T.WATER ? T.BRIDGE : T.PATH;
  }
  return true;
}

/** nessuna porta deve restare tappata: se capita, si riapre il passaggio verso il paese */
function repairVillagePaths(area) {
  const s0 = game.settlements[0];
  if (!s0) return;
  let seen = reachableFrom(area, s0.x, s0.y);
  for (const st of game.settlements) {
    for (const b of st.buildings) {
      if (seen[(b.doorY + 1) * area.w + b.doorX]) continue;
      if (connectToNetwork(area, b.doorX, b.doorY + 1, seen)) seen = reachableFrom(area, s0.x, s0.y);
    }
  }
  area.mainland = seen;
}

function landScore(area, cx, cy, rad) {
  let good = 0, total = 0;
  for (let y = cy - rad; y <= cy + rad; y += 2) {
    for (let x = cx - rad; x <= cx + rad; x += 2) {
      total++;
      const t = tileAt(area, x, y);
      if (t !== T.WATER && t !== T.SAND) good++;
    }
  }
  return total ? good / total : 0;
}

function buildSettlements(area, seed) {
  const rng = makeRng(seed ^ 0x9e37);
  const spots = [];
  const SPACING = 96;
  for (let gy = SPACING; gy < WORLD_H - SPACING; gy += SPACING) {
    for (let gx = SPACING; gx < WORLD_W - SPACING; gx += SPACING) {
      const cx = gx + ((rng() * 40) | 0) - 20;
      const cy = gy + ((rng() * 40) | 0) - 20;
      if (landScore(area, cx, cy, 16) > 0.94) spots.push({ x: cx, y: cy });
    }
  }
  const mid = WORLD_W / 2;
  spots.sort((a, b) =>
    (Math.abs(a.x - mid) + Math.abs(a.y - mid)) - (Math.abs(b.x - mid) + Math.abs(b.y - mid)));

  const NOMI = ['Braceforte', 'Valcenere', 'Brumaldo', 'Spinalta', 'Grigiofonte', 'Allodola',
                'Rioconca', 'Pietralunga', 'Ventimoro', 'Felceto', 'Nerimulino', 'Corvara'];
  const chosen = spots.slice(0, Math.min(11, spots.length));

  // ogni insediamento riceve un tema diverso dal vicino
  const themeOrder = THEME_KEYS.slice();
  const trng = makeRng(seed ^ 0x7ea);
  for (let i = themeOrder.length - 1; i > 0; i--) {
    const j = (trng() * (i + 1)) | 0;
    const t = themeOrder[i]; themeOrder[i] = themeOrder[j]; themeOrder[j] = t;
  }

  chosen.forEach((s, i) => {
    const isCity = i === 0 || (i % 4 === 1);
    const theme = themeOrder[i % themeOrder.length];
    const st = {
      x: s.x, y: s.y, index: i,
      r: isCity ? 20 : 13,
      name: NOMI[i % NOMI.length],
      kind: isCity ? 'city' : 'village',
      theme, roof: THEMES[theme].roof,
      buildings: []
    };
    carveSettlement(area, st, makeRng(seed + i * 7919));
    game.settlements.push(st);
  });
}

function carveSettlement(area, st, rng) {
  const { x: cx, y: cy, r } = st;
  for (let y = cy - r; y <= cy + r; y++) {
    for (let x = cx - r; x <= cx + r; x++) {
      const dx = x - cx, dy = y - cy;
      if (dx * dx + dy * dy > r * r) continue;
      const t = tileAt(area, x, y);
      if (t === T.TREE || t === T.ROCK || t === T.BUSH || t === T.DIRT) setTile(area, x, y, T.GRASS);
    }
  }
  // piazza acciottolata
  const pr = st.kind === 'city' ? 5 : 4;
  for (let y = cy - pr; y <= cy + pr; y++)
    for (let x = cx - pr; x <= cx + pr; x++)
      if ((x - cx) ** 2 + (y - cy) ** 2 <= pr * pr && tileAt(area, x, y) !== T.WATER)
        setTile(area, x, y, T.COBBLE);

  const want = st.kind === 'city' ? 9 : 4;
  let tries = 0;
  while (st.buildings.length < want && tries++ < 260) {
    const bw = 6 + ((rng() * 4) | 0);
    const bh = 5 + ((rng() * 3) | 0);
    const ang = rng() * Math.PI * 2;
    const dist = pr + 3 + rng() * (r - pr - 5);
    const bx = Math.round(cx + Math.cos(ang) * dist) - (bw >> 1);
    const by = Math.round(cy + Math.sin(ang) * dist) - (bh >> 1);
    if (canPlaceBuilding(area, bx, by, bw, bh)) {
      st.buildings.push(carveBuilding(area, bx, by, bw, bh, rng));
    }
  }
  // viottoli dalla soglia di ogni casa alla piazza
  for (const b of st.buildings) carveRoad(area, b.doorX, b.doorY + 2, cx, cy, 1);
  decorateSettlement(area, st, rng);
}

/* ---- ciò che rende un paese un paese e non un mucchio di case ---- */
function decorateSettlement(area, st, rng) {
  const { x: cx, y: cy, r } = st;
  const theme = THEMES[st.theme];
  const isCity = st.kind === 'city';
  const free = (x, y) => { const t = tileAt(area, x, y); return t === T.GRASS || t === T.COBBLE; };
  const plain = (x, y) => tileAt(area, x, y) === T.GRASS;
  const blocksDoor = (x, y) => {
    for (const b of st.buildings)
      if (x === b.doorX && y >= b.doorY && y <= b.doorY + 3) return true;
    return false;
  };
  const place = (x, y, t) => {
    if (!plain(x, y) || blocksDoor(x, y)) return false;
    setTile(area, x, y, t); return true;
  };

  /* 1. il monumento della piazza */
  const centerTile = isCity ? (theme.center === T.WELL ? T.FOUNTAIN : theme.center) : theme.center;
  setTile(area, cx, cy, centerTile);
  st.monument = { x: cx, y: cy, tile: centerTile };

  /* 2. la piazza: panchine, lampioni e le insegne del mestiere del paese */
  const spots = isCity ? 10 : 6;
  const ring = isCity ? 4 : 3;
  for (let k = 0; k < spots; k++) {
    const a = (k / spots) * Math.PI * 2 + rng() * 0.4;
    const d = ring + (rng() < 0.45 ? 1 : 0);
    const bx = Math.round(cx + Math.cos(a) * d), by = Math.round(cy + Math.sin(a) * d);
    if (!free(bx, by) || blocksDoor(bx, by)) continue;
    const t = rng() < 0.4 ? (rng() < 0.5 ? T.BENCH : T.LAMP)
                          : theme.plaza[(rng() * theme.plaza.length) | 0];
    setTile(area, bx, by, t);
  }

  /* 3. cartelli agli imbocchi del paese */
  for (let s = 0; s < (isCity ? 3 : 2); s++) {
    for (let k = 0; k < 40; k++) {
      const a = rng() * Math.PI * 2, d = r - 2 - rng() * 2;
      const sx = Math.round(cx + Math.cos(a) * d), sy = Math.round(cy + Math.sin(a) * d);
      if (place(sx, sy, T.SIGN)) break;
    }
  }

  /* 4. la vita attorno alle case: panni stesi, aiuole, ceste sull'uscio */
  for (const b of st.buildings) {
    if (rng() < 0.7) {
      const lx = b.x + ((rng() * b.w) | 0), ly = b.y - 2;
      place(lx, ly, T.LAUNDRY);
    }
    if (rng() < 0.75) place(b.doorX + (rng() < 0.5 ? -1 : 1), b.doorY + 1, T.FLOWERS);
    if (rng() < 0.5) place(b.x - 1, b.y + ((rng() * b.h) | 0), rng() < 0.5 ? T.CRATE : T.BARREL);
    if (rng() < 0.35) place(b.x + b.w, b.y + ((rng() * b.h) | 0), T.FLOWERS);
  }

  /* 5. recinti veri: un rettangolo di staccionata con un varco, riempito a tema */
  const pens = isCity ? 2 : 1;
  for (let s = 0; s < pens; s++) {
    for (let k = 0; k < 60; k++) {
      const pw = 5 + ((rng() * 4) | 0), ph = 4 + ((rng() * 3) | 0);
      const a = rng() * Math.PI * 2, d = 8 + rng() * (r - 10);
      const ox = Math.round(cx + Math.cos(a) * d) - (pw >> 1);
      const oy = Math.round(cy + Math.sin(a) * d) - (ph >> 1);
      let ok = true;
      for (let y = oy; y <= oy + ph && ok; y++)
        for (let x = ox; x <= ox + pw; x++)
          if (!plain(x, y) || blocksDoor(x, y)) { ok = false; break; }
      if (!ok) continue;
      const gap = ox + 1 + ((rng() * (pw - 1)) | 0);
      for (let x = ox; x <= ox + pw; x++) {
        setTile(area, x, oy, T.FENCE);
        if (x !== gap) setTile(area, x, oy + ph, T.FENCE);
      }
      for (let y = oy; y <= oy + ph; y++) { setTile(area, ox, y, T.FENCE); setTile(area, ox + pw, y, T.FENCE); }
      // dentro il recinto ci sta il mestiere del paese
      const inner = theme.deco.filter(t => t !== T.FENCE && t !== T.LAUNDRY);
      const fill = inner[(rng() * inner.length) | 0];
      for (let j = 0; j < 3; j++) {
        const fx = ox + 1 + ((rng() * (pw - 1)) | 0), fy = oy + 1 + ((rng() * (ph - 1)) | 0);
        if (plain(fx, fy)) setTile(area, fx, fy, fill);
      }
      st.pen = st.pen || { x: ox + pw / 2, y: oy + ph / 2 };
      break;
    }
  }

  /* 6. la campagna intorno: campi, filari, reti, minerale — a chiazze, non a puntini */
  const patches = isCity ? 10 : 7;
  for (let s = 0; s < patches; s++) {
    // ciclico, non casuale: così il mestiere del paese si vede davvero
    const t = theme.deco[s % theme.deco.length];
    const a = rng() * Math.PI * 2, d = (isCity ? 8 : 6) + rng() * (r - 7);
    const bx = Math.round(cx + Math.cos(a) * d), by = Math.round(cy + Math.sin(a) * d);
    const wide = (t === T.FIELD || t === T.VINE || t === T.NET);
    const n = wide ? 10 + ((rng() * 10) | 0) : 2 + ((rng() * 3) | 0);
    for (let j = 0; j < n; j++) {
      const ex = bx + ((rng() * (wide ? 6 : 4)) | 0) - (wide ? 3 : 2);
      const ey = by + ((rng() * (wide ? 5 : 3)) | 0) - (wide ? 2 : 1);
      place(ex, ey, t);
    }
  }

  /* 7. aiuole sparse per rompere il verde */
  for (let k = 0; k < 12; k++) {
    const a = rng() * Math.PI * 2, d = 6 + rng() * (r - 7);
    place(Math.round(cx + Math.cos(a) * d), Math.round(cy + Math.sin(a) * d), T.FLOWERS);
  }
}

function canPlaceBuilding(area, x0, y0, w, h) {
  for (let y = y0 - 2; y < y0 + h + 3; y++) {
    for (let x = x0 - 2; x < x0 + w + 2; x++) {
      if (x < 1 || y < 1 || x >= area.w - 1 || y >= area.h - 1) return false;
      const t = tileAt(area, x, y);
      if (t === T.WATER || t === T.WALL || t === T.ROOF || t === T.DOOR ||
          t === T.PATH || t === T.COBBLE) return false;
    }
  }
  return true;
}

function carveBuilding(area, x0, y0, w, h, rng) {
  // visto da fuori la casa è chiusa: muri e tetto. Si entra solo dalla porta.
  for (let y = y0; y < y0 + h; y++) {
    for (let x = x0; x < x0 + w; x++) {
      const edge = (x === x0 || y === y0 || x === x0 + w - 1 || y === y0 + h - 1);
      setTile(area, x, y, edge ? T.WALL : T.ROOF);
    }
  }
  // un comignolo su una falda interna
  if (w > 3 && h > 3) setTile(area, x0 + 1 + ((rng() * (w - 2)) | 0), y0 + 1, T.CHIMNEY);
  const doorX = x0 + 1 + ((rng() * (w - 2)) | 0);
  const doorY = y0 + h - 1;
  setTile(area, doorX, doorY, T.DOOR);
  setTile(area, doorX, doorY + 1, T.PATH);
  setTile(area, doorX, doorY + 2, T.PATH);
  return { x: x0, y: y0, w, h, doorX, doorY };
}

function carveRoad(area, ax, ay, bx, by, width, force) {
  const wdt = (width || 2) - 1;
  const stamp = (x, y) => {
    for (let dy = 0; dy <= wdt; dy++) {
      for (let dx = 0; dx <= wdt; dx++) {
        const t = tileAt(area, x + dx, y + dy);
        if (t === T.WALL || t === T.ROOF || t === T.CHIMNEY || t === T.DOOR || t === T.COBBLE) continue;
        // le strade abbattono alberi e rocce, ma girano attorno a fontane, pozzi e recinti
        if (!force && SOLID[t] && t !== T.TREE && t !== T.ROCK && t !== T.WATER) continue;
        setTile(area, x + dx, y + dy, t === T.WATER ? T.BRIDGE : T.PATH);
      }
    }
  };
  let x = ax, y = ay;
  while (x !== bx) { stamp(x, y); x += Math.sign(bx - x); }
  while (y !== by) { stamp(x, y); y += Math.sign(by - y); }
  stamp(bx, by);
}

function buildRoads(area) {
  const left = game.settlements.slice();
  if (!left.length) return;
  let cur = left.shift();
  while (left.length) {
    let bi = 0, bd = Infinity;
    for (let i = 0; i < left.length; i++) {
      const d = (left[i].x - cur.x) ** 2 + (left[i].y - cur.y) ** 2;
      if (d < bd) { bd = d; bi = i; }
    }
    const next = left.splice(bi, 1)[0];
    carveRoad(area, cur.x, cur.y, next.x, next.y);
    cur = next;
  }
}

function buildDungeonEntrances(area, seed) {
  const rng = makeRng(seed ^ 0x5eed);
  let guard = 0;
  while (game.portals.length < 6 && guard++ < 6000) {
    const x = 30 + ((rng() * (WORLD_W - 60)) | 0);
    const y = 30 + ((rng() * (WORLD_H - 60)) | 0);
    if (landScore(area, x, y, 5) < 1) continue;
    if (!isWalkable(area, x, y + 1)) continue;
    // il corridoio d'accesso da sud deve sbucare su terra battuta dal resto del mondo,
    // altrimenti un albero o una roccia murano l'ingresso
    if (area.mainland && !area.mainland[(y + 4) * area.w + x]) continue;
    let tooClose = false;
    for (const s of game.settlements)
      if ((s.x - x) ** 2 + (s.y - y) ** 2 < 60 * 60) { tooClose = true; break; }
    for (const p of game.portals)
      if ((p.tx - x) ** 2 + (p.ty - y) ** 2 < 70 * 70) { tooClose = true; break; }
    if (tooClose) continue;

    for (let dy = -2; dy <= 2; dy++)
      for (let dx = -2; dx <= 2; dx++) {
        if (dx === 0 && dy >= 0) continue;
        if (Math.abs(dx) === 2 || Math.abs(dy) === 2) setTile(area, x + dx, y + dy, T.ROCK);
        else setTile(area, x + dx, y + dy, T.DIRT);
      }
    setTile(area, x, y, T.ENTRANCE);
    for (let k = 1; k <= 4; k++) setTile(area, x, y + k, T.DIRT);

    const n = game.portals.length;
    // a turno: cripte a stanze e labirinti, questi ultimi più profondi e più duri
    const type = n % 2 === 0 ? 'crypt' : 'maze';
    game.portals.push({
      tx: x, ty: y, id: 'dungeon:' + n, depth: n + 1, type,
      name: (type === 'maze' ? 'Labirinto' : 'Cripta') + ' — livello ' + (n + 1)
    });
  }
}

/* ============================================================
   DUNGEON (stanze + corridoi)
   ============================================================ */
function generateDungeon(id, seed, depth) {
  const W = 62, H = 62;
  const area = makeArea(id, 'dungeon', W, H);
  area.tiles.fill(T.DWALL);
  area.depth = depth;
  const rng = makeRng(seed);
  const rooms = [];

  for (let i = 0; i < 120 && rooms.length < 13; i++) {
    const w = 6 + ((rng() * 8) | 0), h = 5 + ((rng() * 7) | 0);
    const x = 2 + ((rng() * (W - w - 4)) | 0), y = 2 + ((rng() * (H - h - 4)) | 0);
    let ok = true;
    for (const r of rooms)
      if (x < r.x + r.w + 2 && x + w + 2 > r.x && y < r.y + r.h + 2 && y + h + 2 > r.y) { ok = false; break; }
    if (!ok) continue;
    for (let ty = y; ty < y + h; ty++)
      for (let tx = x; tx < x + w; tx++)
        area.tiles[ty * W + tx] = T.DFLOOR;
    rooms.push({ x, y, w, h, cx: (x + w / 2) | 0, cy: (y + h / 2) | 0 });
  }

  const tunnel = (x1, y1, x2, y2) => {
    let x = x1, y = y1;
    const dig = (px, py) => {
      for (let dy = 0; dy <= 1; dy++)
        for (let dx = 0; dx <= 1; dx++)
          if (px + dx > 0 && py + dy > 0 && px + dx < W - 1 && py + dy < H - 1)
            area.tiles[(py + dy) * W + (px + dx)] = T.DFLOOR;
    };
    while (x !== x2) { dig(x, y); x += Math.sign(x2 - x); }
    while (y !== y2) { dig(x, y); y += Math.sign(y2 - y); }
    dig(x2, y2);
  };
  for (let i = 1; i < rooms.length; i++) tunnel(rooms[i - 1].cx, rooms[i - 1].cy, rooms[i].cx, rooms[i].cy);
  if (rooms.length > 3) tunnel(rooms[0].cx, rooms[0].cy, rooms[rooms.length - 1].cx, rooms[rooms.length - 1].cy);

  const start = rooms[0];
  area.tiles[start.cy * W + start.cx] = T.EXIT;
  area.entry = { x: (start.cx + 1.5) * TS, y: (start.cy + 0.5) * TS };

  for (let i = 1; i < rooms.length; i++) {
    const r = rooms[i];
    const n = 2 + ((rng() * 3) | 0);
    for (let k = 0; k < n; k++) {
      const mx = (r.x + 1 + rng() * (r.w - 2) + 0.5) * TS;
      const my = (r.y + 1 + rng() * (r.h - 2) + 0.5) * TS;
      const kind = rng() < 0.55 ? 'skeleton' : (rng() < 0.6 ? 'wraith' : 'brute');
      area.monsters.push(makeMonster(kind, mx, my, depth));
    }
  }
  return area;
}

/* ============================================================
   LABIRINTI SOTTERRANEI — corridoi stretti, mostri più duri
   ============================================================ */
function generateMaze(id, seed, depth) {
  const CW = 27, CH = 27;                 // celle del labirinto
  const W = CW * 2 + 1, H = CH * 2 + 1;   // ogni cella occupa 2 tile più il muro
  const area = makeArea(id, 'dungeon', W, H);
  area.tiles.fill(T.DWALL);
  area.depth = depth;
  area.maze = true;
  const rng = makeRng(seed);

  const idx = (cx, cy) => cy * CW + cx;
  const visited = new Uint8Array(CW * CH);
  const carve = (cx, cy) => { area.tiles[(cy * 2 + 1) * W + (cx * 2 + 1)] = T.DFLOOR; };
  const wallBetween = (ax, ay, bx, by) => {
    const wx = ax + bx + 1, wy = ay + by + 1;   // (ax*2+1 + bx*2+1)/2
    area.tiles[wy * W + wx] = T.DFLOOR;
  };

  // scavo a ritroso: produce un labirinto in cui tutto è raggiungibile
  const startC = { x: (rng() * CW) | 0, y: (rng() * CH) | 0 };
  const stack = [startC];
  visited[idx(startC.x, startC.y)] = 1;
  carve(startC.x, startC.y);
  while (stack.length) {
    const c = stack[stack.length - 1];
    const opts = [];
    if (c.x > 0 && !visited[idx(c.x - 1, c.y)]) opts.push({ x: c.x - 1, y: c.y });
    if (c.x < CW - 1 && !visited[idx(c.x + 1, c.y)]) opts.push({ x: c.x + 1, y: c.y });
    if (c.y > 0 && !visited[idx(c.x, c.y - 1)]) opts.push({ x: c.x, y: c.y - 1 });
    if (c.y < CH - 1 && !visited[idx(c.x, c.y + 1)]) opts.push({ x: c.x, y: c.y + 1 });
    if (!opts.length) { stack.pop(); continue; }
    const n = opts[(rng() * opts.length) | 0];
    visited[idx(n.x, n.y)] = 1;
    carve(n.x, n.y);
    wallBetween(c.x, c.y, n.x, n.y);
    stack.push(n);
  }

  // qualche anello, così non è un vicolo cieco continuo
  for (let k = 0; k < CW * CH * 0.12; k++) {
    const cx = 1 + ((rng() * (CW - 2)) | 0), cy = 1 + ((rng() * (CH - 2)) | 0);
    const horiz = rng() < 0.5;
    const wx = cx * 2 + 1 + (horiz ? 1 : 0), wy = cy * 2 + 1 + (horiz ? 0 : 1);
    if (wx < W - 1 && wy < H - 1) area.tiles[wy * W + wx] = T.DFLOOR;
  }
  // e un pugno di camere più larghe per respirare
  for (let k = 0; k < 5; k++) {
    const cx = 2 + ((rng() * (CW - 5)) | 0), cy = 2 + ((rng() * (CH - 5)) | 0);
    const w = 3 + ((rng() * 3) | 0), h = 3 + ((rng() * 3) | 0);
    for (let y = cy * 2 + 1; y < Math.min(H - 1, cy * 2 + 1 + h * 2); y++)
      for (let x = cx * 2 + 1; x < Math.min(W - 1, cx * 2 + 1 + w * 2); x++)
        area.tiles[y * W + x] = T.DFLOOR;
  }

  // la scala di risalita: lontano dai bordi, così non si esce incastrati in un angolo
  const ecx = 4 + ((rng() * (CW - 8)) | 0), ecy = 4 + ((rng() * (CH - 8)) | 0);
  const ex = ecx * 2 + 1, ey = ecy * 2 + 1;
  area.tiles[ey * W + ex] = T.EXIT;
  if (SOLID[area.tiles[ey * W + ex + 1]]) area.tiles[ey * W + ex + 1] = T.DFLOOR;
  area.entry = { x: (ex + 1.5) * TS, y: (ey + 0.5) * TS };

  // popolamento: più fitto e più cattivo di una cripta a stanze
  const floors = [];
  for (let y = 1; y < H - 1; y++)
    for (let x = 1; x < W - 1; x++)
      if (area.tiles[y * W + x] === T.DFLOOR && (Math.abs(x - ex) > 6 || Math.abs(y - ey) > 6))
        floors.push(y * W + x);
  const count = 42;
  for (let k = 0; k < count && floors.length; k++) {
    const pick = (rng() * floors.length) | 0;
    const i = floors.splice(pick, 1)[0];
    const roll = rng();
    const kind = roll < 0.42 ? 'skeleton' : roll < 0.78 ? 'wraith' : 'brute';
    area.monsters.push(makeMonster(kind, ((i % W) + 0.5) * TS, (((i / W) | 0) + 0.5) * TS, depth + 2));
  }
  return area;
}

/* ============================================================
   INTERNI DELLE CASE — una stanza arredata per ogni porta
   ============================================================ */
function generateHouse(id, si, bi) {
  const st = game.settlements[si];
  const b = st.buildings[bi];
  const rng = makeRng(game.seed + si * 7717 + bi * 131 + 17);
  const W = 10 + ((rng() * 5) | 0), H = 8 + ((rng() * 4) | 0);
  const area = makeArea(id, 'house', W, H);
  area.houseOf = { si, bi };

  for (let y = 0; y < H; y++)
    for (let x = 0; x < W; x++)
      area.tiles[y * W + x] = (x === 0 || y === 0 || x === W - 1 || y === H - 1) ? T.IWALL : T.FLOOR;

  const doorX = W >> 1, doorY = H - 1;
  area.tiles[doorY * W + doorX] = T.IDOOR;
  area.entry = { x: (doorX + 0.5) * TS, y: (doorY - 0.7) * TS };
  area.returnTo = { x: (b.doorX + 0.5) * TS, y: (b.doorY + 1.5) * TS };

  const put = (x, y, t) => {
    if (x < 1 || y < 1 || x >= W - 1 || y >= H - 1) return;
    if (x === doorX && y >= doorY - 3) return;        // lascia libera la soglia
    area.tiles[y * W + x] = t;
  };

  // camino su un muro laterale
  const hearthLeft = rng() < 0.5;
  const hx = hearthLeft ? 1 : W - 2;
  put(hx, 2, T.HEARTH);
  area.hearth = { x: hx, y: 2 };

  // letto in un angolo in alto
  const bedRight = rng() < 0.5;
  const bx = bedRight ? W - 3 : 2;
  put(bx, 1, T.BED); put(bx, 2, T.BED);

  // mensole lungo il muro in alto
  for (let x = 3; x < W - 3; x++) if (rng() < 0.45) put(x, 1, T.SHELF);

  // tavolo con sedie e tappeto al centro, tenuti fuori dalla colonna della porta
  let cx = (W >> 1) + (rng() < 0.5 ? -1 : 1);
  if (cx === doorX || cx - 1 === doorX || cx + 1 === doorX) cx = doorX >= (W >> 1) ? 2 : W - 3;
  cx = Math.max(2, Math.min(W - 3, cx));
  const cy = (H >> 1);
  for (let y = cy; y <= cy + 1; y++)
    for (let x = cx - 1; x <= cx + 1; x++)
      if (x > 0 && y > 0 && x < W - 1 && y < H - 1 && area.tiles[y * W + x] === T.FLOOR) put(x, y, T.RUG);
  put(cx, cy, T.TABLE);
  put(cx - 1, cy, T.CHAIR);
  if (rng() < 0.7) put(cx + 1, cy, T.CHAIR);

  // botti, vasi, bauli negli angoli bassi
  put(1, H - 2, rng() < 0.5 ? T.BARREL : T.POT);
  put(W - 2, H - 2, rng() < 0.5 ? T.CHEST : T.BARREL);
  if (rng() < 0.5) put(W - 2, H - 3, T.POT);

  // la soglia resta sgombra
  for (let y = doorY - 1; y >= doorY - 3; y--) {
    if (y >= 1 && SOLID[area.tiles[y * W + doorX]]) area.tiles[y * W + doorX] = T.FLOOR;
  }

  // ogni angolo di pavimento isolato dietro un mobile viene riempito, così non restano buchi
  const start = (doorY - 1) * W + doorX;
  const seen = new Uint8Array(W * H);
  const q = [start]; seen[start] = 1;
  while (q.length) {
    const i = q.pop(), x = i % W, y = (i / W) | 0;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      const j = ny * W + nx;
      if (seen[j] || SOLID[area.tiles[j]]) continue;
      seen[j] = 1; q.push(j);
    }
  }
  for (let i = 0; i < area.tiles.length; i++) {
    if (!seen[i] && !SOLID[area.tiles[i]] && area.tiles[i] !== T.IDOOR) area.tiles[i] = T.BARREL;
  }

  // un abitante in casa, ogni tanto
  if (rng() < 0.7) {
    const npc = makeNpc((doorX + 0.5) * TS, (doorY - 1.5) * TS, st, rng, true, 'h:' + si + ':' + bi);
    npc.spots = [];
    for (let k = 0; k < 3; k++) {
      let px = 1 + ((rng() * (W - 2)) | 0), py = 1 + ((rng() * (H - 2)) | 0);
      if (!isWalkable(area, px, py)) { px = doorX; py = doorY - 1; }
      npc.spots.push({ x: (px + 0.5) * TS, y: (py + 0.5) * TS });
    }
    area.npcs.push(npc);
  }
  return area;
}

function makePlayer(x, y) {
  return {
    kind: 'player', x, y, hw: 9, hh: 8, r: 11,
    dir: 'down', speed: 168,
    hp: 100, maxHp: 100, gold: 0,
    atk: null, atkCd: 0, hurtCd: 0, invul: 0,
    kx: 0, ky: 0, walk: 0, moving: false
  };
}

const MONSTER_TYPES = {
  slime:    { hp: 26,  dmg: 7,  speed: 44,  color: '#5fbf6d', dark: '#2e6d38', size: 11, aggro: 190, gold: 2 },
  wisp:     { hp: 18,  dmg: 6,  speed: 92,  color: '#8fd6ff', dark: '#2f6f95', size: 9,  aggro: 260, gold: 3 },
  brute:    { hp: 58,  dmg: 14, speed: 56,  color: '#d98452', dark: '#7c4423', size: 14, aggro: 230, gold: 6 },
  skeleton: { hp: 44,  dmg: 12, speed: 74,  color: '#e6e2d3', dark: '#8b8672', size: 12, aggro: 300, gold: 8 },
  wraith:   { hp: 36,  dmg: 16, speed: 104, color: '#b48cf0', dark: '#5b3d94', size: 12, aggro: 340, gold: 11 }
};

function makeMonster(kind, x, y, depth) {
  const t = MONSTER_TYPES[kind];
  const scale = 1 + (depth || 0) * 0.18;
  const hp = Math.round(t.hp * scale);
  return {
    kind: 'monster', type: kind, x, y,
    hw: t.size - 2, hh: t.size - 3, r: t.size,
    hp, maxHp: hp, dmg: Math.round(t.dmg * scale), speed: t.speed,
    aggro: t.aggro, gold: t.gold, color: t.color, dark: t.dark,
    dir: 'down', kx: 0, ky: 0, flash: 0, hitCd: 0,
    wanderT: Math.random() * 2, wx: 0, wy: 0, bob: Math.random() * 6.28
  };
}

/* ============================================================

/* Distributore di battute: ogni frase esce una volta sola.
   Le battute vengono assegnate tutte in blocco alla nascita del mondo, in un ordine
   fisso (paese per paese), così il fabbro dice sempre la stessa cosa anche se entri
   nelle case in un ordine diverso da quello dell'altra volta. */
function makeLineBook(seed) {
  const rng = makeRng(seed ^ 0x1ced);
  const shuffle = arr => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = (rng() * (i + 1)) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  };
  const pools = { common: shuffle(LINES_COMMON), home: shuffle(LINES_HOME) };
  for (const k of THEME_KEYS) pools['t_' + k] = shuffle(THEMES[k].lines);
  const cur = {};
  for (const k in pools) cur[k] = 0;
  let spare = 0;
  return {
    take(order) {
      for (const name of order) {
        const p = pools[name];
        if (p && cur[name] < p.length) return p[cur[name]++];
      }
      return 'Non ho molto da raccontare oggi, viandante. (' + (++spare) + ')';
    }
  };
}

/** una battuta per ogni posto da NPC del mondo, decisa una volta e per sempre */
function assignLines(seed) {
  const book = makeLineBook(seed);
  const lines = new Map();
  // prima chi sta per strada, poi chi sta in casa: ordine fisso, niente sorprese
  game.settlements.forEach((st, si) => {
    const count = st.kind === 'city' ? 9 : 5;
    for (let k = 0; k < count; k++)
      lines.set('o:' + si + ':' + k, book.take(['t_' + st.theme, 'common', 'home']));
  });
  game.settlements.forEach((st, si) => {
    st.buildings.forEach((b, bi) =>
      lines.set('h:' + si + ':' + bi, book.take(['home', 't_' + st.theme, 'common'])));
  });
  game.lines = lines;
}

function makeNpc(x, y, home, rng, indoors, lineKey) {
  const spots = [];
  for (let i = 0; i < 3; i++) spots.push({ x: x + (rng() * 200 - 100), y: y + (rng() * 200 - 100) });
  return {
    kind: 'npc', x, y, hw: 8, hh: 7, r: 10,
    home, spots, target: 0, pause: rng() * 2, talking: false,
    speed: indoors ? 22 : 34, dir: 'down', kx: 0, ky: 0, walk: 0, moving: false,
    name: NPC_NAMES[(rng() * NPC_NAMES.length) | 0],
    line: (game.lines && game.lines.get(lineKey)) || 'Buon viaggio, straniero.',
    hat: ['#c8563c', '#3c74c8', '#59a35b', '#b8973c', '#8d5bb0'][(rng() * 5) | 0],
    body: ['#dcd6c8', '#c4b7a4', '#a8bcc9', '#cbb9c9'][(rng() * 4) | 0]
  };
}

function populateSettlements(area) {
  game.settlements.forEach((st, i) => {
    const rng = makeRng(game.seed + i * 104729 + 3);
    const count = st.kind === 'city' ? 9 : 5;
    for (let k = 0; k < count; k++) {
      const b = st.buildings[k % Math.max(1, st.buildings.length)];
      let px, py;
      if (b) { px = (b.doorX + 0.5) * TS; py = (b.doorY + 2.5) * TS; }
      else { px = (st.x + 0.5) * TS; py = (st.y + 0.5) * TS; }
      const npc = makeNpc(px, py, st, rng, false, 'o:' + i + ':' + k);
      npc.spots = npc.spots.map(s => {
        const tx = Math.max(1, Math.min(area.w - 2, Math.round(s.x / TS)));
        const ty = Math.max(1, Math.min(area.h - 2, Math.round(s.y / TS)));
        if (isWalkable(area, tx, ty)) return { x: (tx + 0.5) * TS, y: (ty + 0.5) * TS };
        return { x: (st.x + 0.5) * TS, y: (st.y + 0.5) * TS };
      });
      area.npcs.push(npc);
    }
    // bestiame e animali da cortile del paese
    const theme = THEMES[st.theme];
    const herd = st.kind === 'city' ? 7 : 5;
    for (let k = 0; k < herd; k++) {
      const type = theme.animals[k % theme.animals.length];
      for (let tryn = 0; tryn < 24; tryn++) {
        const a = rng() * Math.PI * 2, d = 4 + rng() * (st.r - 4);
        const tx = Math.round(st.x + Math.cos(a) * d), ty = Math.round(st.y + Math.sin(a) * d);
        if (!isWalkable(area, tx, ty)) continue;
        area.animals.push(makeAnimal(type, (tx + 0.5) * TS, (ty + 0.5) * TS));
        break;
      }
    }
  });
}

function buildDoorIndex(area) {
  const idx = new Map();
  game.settlements.forEach((st, si) => {
    st.buildings.forEach((b, bi) => idx.set(b.doorY * area.w + b.doorX, { si, bi }));
  });
  game.doorIndex = idx;
}

/* ============================================================
   COLLISIONI CONDIVISE
   ============================================================ */
function boxBlocked(area, x, y, hw, hh) {
  const x0 = Math.floor((x - hw) / TS), x1 = Math.floor((x + hw) / TS);
  const y0 = Math.floor((y - hh) / TS), y1 = Math.floor((y + hh) / TS);
  for (let ty = y0; ty <= y1; ty++)
    for (let tx = x0; tx <= x1; tx++)
      if (SOLID[tileAt(area, tx, ty)]) return true;
  return false;
}
/** giocatore, NPC e mostri passano tutti da qui */
function moveEntity(area, e, dx, dy) {
  let moved = false;
  if (dx) {
    const nx = e.x + dx;
    if (!boxBlocked(area, nx, e.y, e.hw, e.hh)) { e.x = nx; moved = true; }
  }
  if (dy) {
    const ny = e.y + dy;
    if (!boxBlocked(area, e.x, ny, e.hw, e.hh)) { e.y = ny; moved = true; }
  }
  return moved;
}
function separate(area, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const min = a.r + b.r;
  const d2 = dx * dx + dy * dy;
  if (d2 <= 0.0001 || d2 >= min * min) return;
  const d = Math.sqrt(d2);
  const push = (min - d) * 0.5;
  const ux = dx / d, uy = dy / d;
  moveEntity(area, a, -ux * push, -uy * push);
  moveEntity(area, b, ux * push, uy * push);
}

/* ============================================================
   EFFETTI
   ============================================================ */
function burst(x, y, color, n, spread) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * (spread || 130);
    game.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.42, max: 0.42, color, r: 1.5 + Math.random() * 2.2 });
  }
}
function floatText(x, y, text, color) {
  game.floats.push({ x, y, text, color, life: 0.85, max: 0.85 });
}

/* ============================================================
   FOG OF WAR
   ============================================================ */
function buildMapCanvas(area) {
  const c = document.createElement('canvas');
  c.width = WORLD_W; c.height = WORLD_H;
  const g = c.getContext('2d');
  const img = g.createImageData(WORLD_W, WORLD_H);
  const d = img.data;
  const COL = {
    [T.WATER]: [43, 93, 143], [T.SAND]: [214, 196, 141], [T.GRASS]: [78, 139, 69],
    [T.TREE]: [47, 107, 49], [T.BUSH]: [67, 128, 62], [T.ROCK]: [123, 125, 132],
    [T.DIRT]: [125, 106, 76], [T.PATH]: [160, 140, 98], [T.BRIDGE]: [138, 106, 66],
    [T.WALL]: [107, 74, 52], [T.ROOF]: [140, 74, 58], [T.DOOR]: [201, 162, 39],
    [T.ENTRANCE]: [176, 92, 255],
    [T.COBBLE]: [142, 136, 128], [T.FOUNTAIN]: [90, 150, 200], [T.WELL]: [138, 128, 121],
    [T.STATUE]: [194, 188, 177], [T.LAUNDRY]: [200, 195, 180], [T.FLOWERS]: [110, 160, 90],
    [T.FENCE]: [138, 106, 66], [T.CRATE]: [156, 118, 69], [T.HAY]: [217, 182, 78],
    [T.STALL]: [195, 74, 60], [T.SIGN]: [160, 127, 82], [T.LAMP]: [110, 106, 100],
    [T.BENCH]: [160, 127, 82], [T.FIELD]: [138, 116, 64], [T.VINE]: [63, 122, 58],
    [T.ORE]: [108, 111, 120], [T.NET]: [190, 178, 150], [T.CART]: [138, 106, 66],
    [T.SCARECROW]: [166, 140, 70], [T.BANNER]: [140, 58, 58]
  };
  for (let i = 0; i < area.tiles.length; i++) {
    const c3 = COL[area.tiles[i]] || [78, 139, 69];
    const o = i * 4;
    d[o] = c3[0]; d[o + 1] = c3[1]; d[o + 2] = c3[2]; d[o + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  return c;
}
function rebuildFogCanvas() {
  const c = game.fogCanvas || (game.fogCanvas = document.createElement('canvas'));
  c.width = WORLD_W; c.height = WORLD_H;
  const g = c.getContext('2d', { willReadFrequently: true });
  const img = g.createImageData(WORLD_W, WORLD_H);
  const d = img.data, ex = game.explored;
  for (let i = 0; i < ex.length; i++) {
    const o = i * 4;
    d[o] = 6; d[o + 1] = 8; d[o + 2] = 12;
    d[o + 3] = ex[i] ? 0 : 255;
  }
  g.putImageData(img, 0, 0);
  game.fogDirty = false;
}
function revealAround(tx, ty, rad) {
  const ex = game.explored;
  const r2 = rad * rad;
  for (let y = Math.max(0, ty - rad); y <= Math.min(WORLD_H - 1, ty + rad); y++) {
    const dy = y - ty;
    for (let x = Math.max(0, tx - rad); x <= Math.min(WORLD_W - 1, tx + rad); x++) {
      const dx = x - tx;
      if (dx * dx + dy * dy <= r2) ex[y * WORLD_W + x] = 1;
    }
  }
  game.fogDirty = true;
}

/* ============================================================
   AVVIO / RESET
   ============================================================ */
function startGame(seed, save) {
  game.seed = seed;
  game.settlements = [];
  game.portals = [];
  game.areas = {};
  game.particles = [];
  game.floats = [];
  game.dialog = null;
  game.state = 'play';
  game.lastRevealTile = -1;
  const over = generateOverworld(seed);
  assignLines(seed);
  populateSettlements(over);
  buildDoorIndex(over);
  game.areas.overworld = over;
  game.areaId = 'overworld';
  game.area = over;
  game.explored = new Uint8Array(WORLD_W * WORLD_H);
  game.mapCanvas = buildMapCanvas(over);
  game.fogDirty = true;

  const home = game.settlements[0] || { x: WORLD_W >> 1, y: WORLD_H >> 1, name: 'Terre Selvagge' };
  game.player = makePlayer((home.x + 0.5) * TS, (home.y + 2.5) * TS);
  if (boxBlocked(over, game.player.x, game.player.y, 9, 8)) {
    outer:
    for (let r = 1; r < 14; r++)
      for (let dy = -r; dy <= r; dy++)
        for (let dx = -r; dx <= r; dx++)
          if (isWalkable(over, home.x + dx, home.y + dy)) {
            game.player.x = (home.x + dx + 0.5) * TS;
            game.player.y = (home.y + dy + 0.5) * TS;
            break outer;
          }
  }
  game.placeName = home.name || 'Terre Selvagge';

  if (save) applySave(save);

  revealAround(Math.floor(game.player.x / TS), Math.floor(game.player.y / TS), 16);
  game.cam.x = game.player.x; game.cam.y = game.player.y;
  clampCamera();
  game.transitionLock = true;
  hideDialog();
  document.getElementById('death').classList.remove('on');
  document.getElementById('pause').classList.remove('on');
  setHudVisible(true);
  syncHud();
  updateHint();
}

/* ============================================================
   AREE SU RICHIESTA — tutto è ricostruibile dal seed
   ============================================================ */
function ensureArea(id) {
  if (game.areas[id]) return game.areas[id];
  if (id.startsWith('dungeon:')) {
    const n = +id.slice(8);
    const portal = game.portals[n];
    if (!portal) return game.areas.overworld;
    const gen = portal.type === 'maze' ? generateMaze : generateDungeon;
    const a = gen(id, game.seed + portal.depth * 7717, portal.depth);
    a.returnTo = { x: (portal.tx + 0.5) * TS, y: (portal.ty + 1.6) * TS };
    game.areas[id] = a;
    return a;
  }
  if (id.startsWith('house:')) {
    const p = id.split(':');
    const si = +p[1], bi = +p[2];
    if (!game.settlements[si] || !game.settlements[si].buildings[bi]) return game.areas.overworld;
    const a = generateHouse(id, si, bi);
    game.areas[id] = a;
    return a;
  }
  return game.areas.overworld;
}

function gotoArea(id, pos, label) {
  const area = ensureArea(id);
  game.areaId = area.id;
  game.area = area;
  game.player.x = pos.x; game.player.y = pos.y;
  game.player.kx = game.player.ky = 0;
  game.cam.x = game.player.x; game.cam.y = game.player.y;
  clampCamera();
  game.transitionLock = true;
  if (label) { game.placeName = label; floatText(game.player.x, game.player.y - 26, label.toUpperCase(), '#ffe9a8'); }
  syncHud();
}

function checkTransition() {
  const p = game.player;
  const tx = Math.floor(p.x / TS), ty = Math.floor(p.y / TS);
  const t = tileAt(game.area, tx, ty);
  const isPortalTile = (t === T.ENTRANCE || t === T.EXIT || t === T.DOOR || t === T.IDOOR);
  if (!isPortalTile) { game.transitionLock = false; return; }
  if (game.transitionLock) return;

  if (t === T.ENTRANCE) {
    const portal = game.portals.find(pt => pt.tx === tx && pt.ty === ty);
    if (portal) gotoArea(portal.id, ensureArea(portal.id).entry, portal.name);
  } else if (t === T.EXIT) {
    gotoArea('overworld', game.area.returnTo, null);
    game.placeName = placeNameAt();
    syncHud();
  } else if (t === T.DOOR) {
    const d = game.doorIndex && game.doorIndex.get(ty * game.area.w + tx);
    if (d) {
      const id = 'house:' + d.si + ':' + d.bi;
      const st = game.settlements[d.si];
      gotoArea(id, ensureArea(id).entry, 'Casa a ' + st.name);
    }
  } else if (t === T.IDOOR) {
    gotoArea('overworld', game.area.returnTo, null);
    game.placeName = placeNameAt();
    syncHud();
  }
}

/* ============================================================
   INPUT
   ============================================================ */
const keys = game.keys;
/* Le frecce muovono. Le lettere sono comandi: W mappa, S parla, P pausa, Spazio spada. */
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  const first = !keys[e.code];
  keys[e.code] = true;
  if (!first) return;

  if (game.state === 'dead') {
    if (e.code === 'KeyR') startGame(WORLD_SEED);
    return;
  }
  if (e.code === 'KeyP') { togglePause(); return; }
  if (e.code === 'KeyW') { toggleMap(); return; }
  if (e.code === 'Escape') {
    if (game.dialog) hideDialog();
    else if (game.state === 'map') toggleMap();
    else if (game.state === 'paused') togglePause();
    return;
  }
  if (game.state !== 'play') return;

  if (e.code === 'Space') {
    if (game.dialog) hideDialog(); else attack();
  } else if (e.code === 'KeyS') {
    if (game.dialog) hideDialog(); else tryTalk();
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

const DIRV = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
function dirAngle(d) { return d === 'right' ? 0 : d === 'down' ? Math.PI / 2 : d === 'left' ? Math.PI : -Math.PI / 2; }

/* ---- spada ---- */
function attack() {
  const p = game.player;
  if (p.atkCd > 0) return;
  p.atkCd = 0.36;
  p.atk = { t: 0, dur: 0.24, dir: p.dir, hit: new Set() };
}
function updateAttack(dt) {
  const p = game.player;
  if (p.atkCd > 0) p.atkCd -= dt;
  if (!p.atk) return;
  p.atk.t += dt;

  const base = dirAngle(p.atk.dir);
  const REACH = 46;
  for (const m of game.area.monsters) {
    if (m.hp <= 0 || p.atk.hit.has(m)) continue;
    const dx = m.x - p.x, dy = m.y - p.y;
    const dist = Math.hypot(dx, dy);
    if (dist > REACH + m.r) continue;
    let da = Math.atan2(dy, dx) - base;
    while (da > Math.PI) da -= Math.PI * 2;
    while (da < -Math.PI) da += Math.PI * 2;
    if (Math.abs(da) > 1.15) continue;
    p.atk.hit.add(m);
    damageMonster(m, 16 + ((Math.random() * 7) | 0), dx / (dist || 1), dy / (dist || 1));
  }
  if (p.atk.t >= p.atk.dur) p.atk = null;
}
function damageMonster(m, amount, ux, uy) {
  m.hp -= amount;
  m.flash = 0.18;
  m.kx += ux * 300; m.ky += uy * 300;
  burst(m.x, m.y, m.color, 8, 150);
  floatText(m.x, m.y - m.r - 4, String(amount), '#fff2c4');
  if (m.hp <= 0) killMonster(m);
}
function killMonster(m) {
  burst(m.x, m.y, m.dark, 16, 190);
  const roll = Math.random();
  if (roll < 0.34) game.area.items.push({ type: 'heart', x: m.x, y: m.y, bob: 0, life: 26 });
  else if (roll < 0.82) game.area.items.push({ type: 'coin', x: m.x, y: m.y, bob: 0, life: 26, value: m.gold });
  const i = game.area.monsters.indexOf(m);
  if (i >= 0) game.area.monsters.splice(i, 1);
}

/* ---- dialogo ---- */
function tryTalk() {
  const p = game.player;
  const [fx, fy] = DIRV[p.dir];
  let best = null, bestD = 1e9;
  for (const n of game.area.npcs) {
    const dx = n.x - p.x, dy = n.y - p.y;
    const d = Math.hypot(dx, dy);
    if (d > 58) continue;
    if ((dx * fx + dy * fy) / (d || 1) < 0.35) continue;   // dev'essere davanti
    if (d < bestD) { bestD = d; best = n; }
  }
  if (best) {
    best.talking = true;                                    // resta fermo per tutto il dialogo
    best.moving = false;
    best.dir = p.dir === 'up' ? 'down' : p.dir === 'down' ? 'up' : p.dir === 'left' ? 'right' : 'left';
    showDialog(best);
  }
}
const dlgEl = document.getElementById('dialog');
function showDialog(npc) {
  game.dialog = { npc };
  document.getElementById('dlgName').textContent = npc.name;
  document.getElementById('dlgText').textContent = npc.line;
  dlgEl.classList.add('on');
}
function hideDialog() {
  if (game.dialog && game.dialog.npc) {
    game.dialog.npc.talking = false;
    game.dialog.npc.pause = 0.8;                            // riprende con calma
  }
  game.dialog = null;
  dlgEl.classList.remove('on');
}

/* ============================================================
   PAUSA, MAPPA, SALVATAGGIO
   ============================================================ */
const pauseEl = document.getElementById('pause');
const hudEl = document.getElementById('hud');
function setHudVisible(on) {
  hudEl.classList.toggle('hidden', !on);
  hintEl.classList.toggle('hidden', !on);
}
function togglePause() {
  if (game.state === 'paused') { game.state = 'play'; pauseEl.classList.remove('on'); setHudVisible(true); return; }
  if (game.state === 'map') toggleMap();
  if (game.state !== 'play') return;
  hideDialog();
  game.state = 'paused';
  refreshPauseMenu();
  pauseEl.classList.add('on');
  setHudVisible(false);
}
function toggleMap() {
  if (game.state === 'map') { game.state = 'play'; setHudVisible(true); return; }
  if (game.state === 'paused') togglePause();
  if (game.state !== 'play') return;
  hideDialog();
  if (game.fogDirty) rebuildFogCanvas();
  game.state = 'map';
  setHudVisible(false);
}

function readSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (err) { /* storage non disponibile */ }
  return game.memorySave;
}
function writeSave(obj) {
  game.memorySave = obj;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(obj)); return true; }
  catch (err) { return false; }
}
function packBits(arr) {
  const out = new Uint8Array((arr.length + 7) >> 3);
  for (let i = 0; i < arr.length; i++) if (arr[i]) out[i >> 3] |= 1 << (i & 7);
  let s = '';
  const CH = 0x8000;
  for (let i = 0; i < out.length; i += CH) s += String.fromCharCode.apply(null, out.subarray(i, i + CH));
  return btoa(s);
}
function unpackBits(b64, len) {
  const arr = new Uint8Array(len);
  const s = atob(b64);
  for (let i = 0; i < len; i++) if (s.charCodeAt(i >> 3) & (1 << (i & 7))) arr[i] = 1;
  return arr;
}
function makeSaveObject() {
  const p = game.player;
  return {
    v: 2, at: Date.now(), seed: game.seed,
    areaId: game.areaId, place: game.placeName,
    player: { x: p.x, y: p.y, hp: p.hp, maxHp: p.maxHp, gold: p.gold, dir: p.dir },
    explored: packBits(game.explored)
  };
}
function applySave(save) {
  const p = game.player;
  // salvataggio di un mondo diverso (versioni vecchie a mondo casuale): tengo solo
  // vita e oro, la posizione e la mappa esplorata non avrebbero senso qui
  if (save.seed !== undefined && save.seed !== WORLD_SEED) {
    p.hp = save.player.hp; p.maxHp = save.player.maxHp || 100;
    p.gold = save.player.gold || 0;
    toast('Salvataggio di un vecchio mondo: riparti dalla capitale');
    return;
  }
  p.x = save.player.x; p.y = save.player.y;
  p.hp = save.player.hp; p.maxHp = save.player.maxHp || 100;
  p.gold = save.player.gold || 0; p.dir = save.player.dir || 'down';
  if (save.explored) {
    try { game.explored = unpackBits(save.explored, WORLD_W * WORLD_H); } catch (err) { /* fog nuova */ }
  }
  game.fogDirty = true;
  if (save.areaId && save.areaId !== 'overworld') {
    const area = ensureArea(save.areaId);
    game.areaId = area.id; game.area = area;
  }
  game.placeName = save.place || placeNameAt();
  unstick();
}
/** se il punto salvato è finito dentro un ostacolo, cerca la casella libera più vicina */
function unstick() {
  const p = game.player;
  if (!boxBlocked(game.area, p.x, p.y, p.hw, p.hh)) return;
  const tx = Math.floor(p.x / TS), ty = Math.floor(p.y / TS);
  for (let r = 1; r < 20; r++)
    for (let dy = -r; dy <= r; dy++)
      for (let dx = -r; dx <= r; dx++) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
        if (!isWalkable(game.area, tx + dx, ty + dy)) continue;
        p.x = (tx + dx + 0.5) * TS; p.y = (ty + dy + 0.5) * TS;
        return;
      }
}
function doSave() {
  const obj = makeSaveObject();
  const persisted = writeSave(obj);
  toast(persisted ? 'Partita salvata' : 'Salvata solo per questa sessione');
  refreshPauseMenu();
}
function doLoad() {
  const save = readSave();
  if (!save) { toast('Nessun salvataggio trovato'); return; }
  startGame(WORLD_SEED, save);
  game.state = 'play';
  pauseEl.classList.remove('on');
  toast('Partita caricata');
}

function refreshPauseMenu() {
  const save = readSave();
  const loadBtn = pauseEl.querySelector('[data-act="load"]');
  loadBtn.disabled = !save;
  const info = document.getElementById('pauseInfo');
  const when = save ? new Date(save.at).toLocaleString('it-IT') : null;
  info.innerHTML =
    (when ? 'Ultimo salvataggio: ' + when + '<br>' : 'Nessun salvataggio.<br>') +
    'Il salvataggio conserva posizione, vita, oro e mappa esplorata.<br>' +
    'Le Emberlands sono sempre le stesse: «Nuova partita» azzera te, non il mondo.<br>' +
    'P o Esc per tornare al gioco.';
}
pauseEl.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const act = btn.dataset.act;
  if (act === 'resume') togglePause();
  else if (act === 'save') doSave();
  else if (act === 'load') doLoad();
  else if (act === 'new') { startGame(WORLD_SEED); }
});

const toastEl = document.getElementById('toast');
let toastTimer = 0;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('on'), 1800);
}

/* ============================================================
   AGGIORNAMENTO
   ============================================================ */
function updatePlayer(dt) {
  const p = game.player;
  let dx = 0, dy = 0;
  if (!game.dialog) {
    if (keys.ArrowLeft)  dx -= 1;
    if (keys.ArrowRight) dx += 1;
    if (keys.ArrowUp)    dy -= 1;
    if (keys.ArrowDown)  dy += 1;
  }
  if (dx && dy) { dx *= 0.7071; dy *= 0.7071; }
  p.moving = !!(dx || dy);
  if (p.moving) {
    p.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    p.walk += dt * 9;
  } else p.walk = 0;

  moveEntity(game.area, p, dx * p.speed * dt, dy * p.speed * dt);
  if (p.kx || p.ky) {
    moveEntity(game.area, p, p.kx * dt, p.ky * dt);
    const damp = Math.exp(-9 * dt);
    p.kx *= damp; p.ky *= damp;
    if (Math.abs(p.kx) < 3) p.kx = 0;
    if (Math.abs(p.ky) < 3) p.ky = 0;
  }
  if (p.invul > 0) p.invul -= dt;
  if (p.hurtCd > 0) p.hurtCd -= dt;

  const items = game.area.items;
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.bob += dt * 4;
    it.life -= dt;
    if (it.life <= 0) { items.splice(i, 1); continue; }
    if (Math.hypot(it.x - p.x, it.y - p.y) < 22) {
      if (it.type === 'heart') {
        p.hp = Math.min(p.maxHp, p.hp + 18);
        floatText(p.x, p.y - 24, '+18', '#8ef2a0');
        burst(it.x, it.y, '#ff7f8e', 8, 90);
      } else {
        p.gold += it.value || 1;
        floatText(p.x, p.y - 24, '+' + (it.value || 1) + ' oro', '#ffd766');
        burst(it.x, it.y, '#ffd766', 6, 80);
      }
      items.splice(i, 1);
      syncHud();
    }
  }

  // fog of war: si scopre solo camminando all'aperto
  if (game.area.kind === 'overworld') {
    const tx = Math.floor(p.x / TS), ty = Math.floor(p.y / TS);
    const key = ty * WORLD_W + tx;
    if (key !== game.lastRevealTile) { game.lastRevealTile = key; revealAround(tx, ty, 16); }
  }

  checkTransition();
  updatePlaceName();
}

function hurtPlayer(amount, ux, uy) {
  const p = game.player;
  if (p.invul > 0) return;
  p.hp -= amount;
  p.invul = 0.7;
  p.kx += ux * 260; p.ky += uy * 260;
  floatText(p.x, p.y - 26, '-' + amount, '#ff8b8b');
  burst(p.x, p.y, '#ff6b6b', 10, 130);
  syncHud();
  if (p.hp <= 0) {
    p.hp = 0;
    game.state = 'dead';
    hideDialog();
    pauseEl.classList.remove('on');
    document.getElementById('death').classList.add('on');
  }
}

function updateNpcs(dt) {
  const p = game.player;
  for (const n of game.area.npcs) {
    if (n.talking) { n.moving = false; n.walk = 0; continue; }   // fermo mentre parla
    if (Math.abs(n.x - p.x) > 1400 || Math.abs(n.y - p.y) > 1400) continue;
    if (n.pause > 0) { n.pause -= dt; n.moving = false; n.walk = 0; continue; }
    const t = n.spots[n.target];
    const dx = t.x - n.x, dy = t.y - n.y;
    const d = Math.hypot(dx, dy);
    if (d < 6) {
      n.target = (n.target + 1) % n.spots.length;
      n.pause = 1 + Math.random() * 2.6;
      n.moving = false;
      continue;
    }
    n.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    const ok = moveEntity(game.area, n, (dx / d) * n.speed * dt, (dy / d) * n.speed * dt);
    n.moving = true;
    n.walk += dt * 7;
    if (!ok) { n.target = (n.target + 1) % n.spots.length; n.pause = 0.4; }
  }
}

function updateAnimals(dt) {
  const p = game.player;
  for (const a of game.area.animals) {
    if (Math.abs(a.x - p.x) > 1200 || Math.abs(a.y - p.y) > 1200) continue;
    a.bob += dt * 7;
    const near = Math.hypot(p.x - a.x, p.y - a.y);

    // cani e gatti si avvicinano al viandante; gli altri lo evitano
    if (a.curious && near < 150 && near > 34) {
      a.tx = p.x; a.ty = p.y; a.pause = 0;
    } else if (!a.curious && near < 70) {
      a.tx = a.x + (a.x - p.x); a.ty = a.y + (a.y - p.y); a.pause = 0;
    }

    if (a.pause > 0) { a.pause -= dt; a.moving = false; a.walk = 0; continue; }
    const dx = a.tx - a.x, dy = a.ty - a.y;
    const d = Math.hypot(dx, dy);
    if (d < 5) {
      // nuova meta entro il raggio di casa
      const ang = Math.random() * Math.PI * 2, rad = Math.random() * a.roam;
      a.tx = a.homeX + Math.cos(ang) * rad;
      a.ty = a.homeY + Math.sin(ang) * rad;
      a.pause = a.pauseRange[0] + Math.random() * (a.pauseRange[1] - a.pauseRange[0]);
      a.moving = false;
      continue;
    }
    a.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    const ok = moveEntity(game.area, a, (dx / d) * a.speed * dt, (dy / d) * a.speed * dt);
    a.moving = true;
    a.walk += dt * 10;
    if (!ok) { a.tx = a.homeX; a.ty = a.homeY; a.pause = 0.3; }
  }
}

function updateMonsters(dt) {
  const p = game.player;
  const list = game.area.monsters;
  for (const m of list) {
    if (m.flash > 0) m.flash -= dt;
    if (m.hitCd > 0) m.hitCd -= dt;
    m.bob += dt * 6;

    const dx = p.x - m.x, dy = p.y - m.y;
    const d = Math.hypot(dx, dy);
    if (d < m.aggro) {
      m.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
      if (d > 4) moveEntity(game.area, m, (dx / d) * m.speed * dt, (dy / d) * m.speed * dt);
      if (d < m.r + p.r + 2 && m.hitCd <= 0) {
        m.hitCd = 0.8;
        hurtPlayer(m.dmg, dx / (d || 1), dy / (d || 1));
      }
    } else {
      m.wanderT -= dt;
      if (m.wanderT <= 0) {
        m.wanderT = 1.2 + Math.random() * 2.2;
        const a = Math.random() * Math.PI * 2;
        m.wx = Math.cos(a); m.wy = Math.sin(a);
        if (Math.random() < 0.3) { m.wx = 0; m.wy = 0; }
      }
      if (m.wx || m.wy) moveEntity(game.area, m, m.wx * m.speed * 0.45 * dt, m.wy * m.speed * 0.45 * dt);
    }
    if (m.kx || m.ky) {
      moveEntity(game.area, m, m.kx * dt, m.ky * dt);
      const damp = Math.exp(-11 * dt);
      m.kx *= damp; m.ky *= damp;
      if (Math.abs(m.kx) < 3) m.kx = 0;
      if (Math.abs(m.ky) < 3) m.ky = 0;
    }
  }
  for (let i = 0; i < list.length; i++) {
    for (let j = i + 1; j < list.length; j++) {
      const a = list[i], b = list[j];
      if (Math.abs(a.x - b.x) < 40 && Math.abs(a.y - b.y) < 40) separate(game.area, a, b);
    }
    if (Math.abs(list[i].x - p.x) < 60 && Math.abs(list[i].y - p.y) < 60) separate(game.area, list[i], p);
  }
  for (const n of game.area.npcs) {
    if (n.talking) continue;
    if (Math.abs(n.x - p.x) < 60 && Math.abs(n.y - p.y) < 60) separate(game.area, n, p);
  }
  for (const a of game.area.animals) {
    if (Math.abs(a.x - p.x) < 60 && Math.abs(a.y - p.y) < 60) separate(game.area, a, p);
  }
}

function nearSettlement(tx, ty, pad) {
  for (const s of game.settlements)
    if ((s.x - tx) ** 2 + (s.y - ty) ** 2 < (s.r + pad) ** 2) return s;
  return null;
}

function spawnWildMonsters(dt) {
  if (game.area.kind !== 'overworld') return;
  game.spawnTimer -= dt;
  const p = game.player;
  const list = game.area.monsters;

  for (let i = list.length - 1; i >= 0; i--) {
    if (Math.abs(list[i].x - p.x) > 1700 || Math.abs(list[i].y - p.y) > 1700) list.splice(i, 1);
  }
  if (game.spawnTimer > 0 || list.length >= 24) return;
  game.spawnTimer = 0.35;

  for (let attempt = 0; attempt < 12; attempt++) {
    const a = Math.random() * Math.PI * 2;
    const dist = 620 + Math.random() * 340;
    const x = p.x + Math.cos(a) * dist, y = p.y + Math.sin(a) * dist;
    const tx = Math.floor(x / TS), ty = Math.floor(y / TS);
    if (!isWalkable(game.area, tx, ty)) continue;
    if (nearSettlement(tx, ty, 12)) continue;
    const roll = Math.random();
    const kind = roll < 0.55 ? 'slime' : roll < 0.85 ? 'wisp' : 'brute';
    list.push(makeMonster(kind, x, y, 0));
    return;
  }
}

function updateEffects(dt) {
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const q = game.particles[i];
    q.life -= dt;
    if (q.life <= 0) { game.particles.splice(i, 1); continue; }
    q.x += q.vx * dt; q.y += q.vy * dt;
    q.vx *= 0.92; q.vy *= 0.92;
  }
  for (let i = game.floats.length - 1; i >= 0; i--) {
    const f = game.floats[i];
    f.life -= dt;
    if (f.life <= 0) { game.floats.splice(i, 1); continue; }
    f.y -= 26 * dt;
  }
}

function placeNameAt() {
  const tx = Math.floor(game.player.x / TS), ty = Math.floor(game.player.y / TS);
  const s = nearSettlement(tx, ty, 4);
  return s ? s.name : 'Terre Selvagge';
}
function updatePlaceName() {
  if (game.area.kind !== 'overworld') return;
  const name = placeNameAt();
  if (name !== game.placeName) { game.placeName = name; syncHud(); }
}
