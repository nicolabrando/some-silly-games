function mvSoundFor(e){
  if(e.type==='kickoff') { sndWhistle(1); crowdSet(0.35,1); }
  // il suono del gol non parte qui: arriva insieme al pallone in rete (mvGoalCelebration)
  else if(e.type==='yellow'||e.type==='red'||e.type==='red2') sndCard();
  else if(e.type==='half') sndWhistle(2);
  else if(e.type==='end') sndWhistle(3);
}
function mvDraw(ts){
  const x = MV.ctx;
  x.clearRect(0,0,PW,PH);
  x.drawImage(MV.pitch,0,0);
  // pallone: interpola lungo la traiettoria della scena (con calma: si deve vedere)
  if(MV.ballPath.length>1){
    // la traiettoria si completa dentro il minuto: niente azioni troncate a metà
    MV.pathT = Math.min(1, MV.pathT + 1.15*(MV.pathSpeed||1)/(MV.minuteMs/16.7));
    const cum = MV.pathCum;
    let i = 0, lt = 0;
    if(cum && cum.length>1){
      while(i < cum.length-2 && MV.pathT > cum[i+1]) i++;
      lt = clamp((MV.pathT - cum[i]) / Math.max(1e-6, cum[i+1]-cum[i]), 0, 1);
    } else {
      const seg = MV.ballPath.length-1;
      const ft = MV.pathT*seg;
      i = Math.min(seg-1, Math.floor(ft)); lt = ft - i;
    }
    const px = MV.ball.x, py = MV.ball.y;
    MV.ball.x = MV.ballPath[i].x + (MV.ballPath[i+1].x-MV.ballPath[i].x)*lt;
    MV.ball.y = MV.ballPath[i].y + (MV.ballPath[i+1].y-MV.ballPath[i].y)*lt;
    // scia: tiene traccia del movimento, così il tiro si legge
    const d = Math.abs(MV.ball.x-px)+Math.abs(MV.ball.y-py);
    if(!MV.trail) MV.trail = [];
    if(d>0.6){ MV.trail.push({x:px, y:py}); if(MV.trail.length>9) MV.trail.shift(); }
    else if(MV.trail.length) MV.trail.shift();
  }
  // ---- giocatori: prima si aggiornano le posizioni, poi si disegna ----
  const frame = Math.floor(ts/140)%2;
  MV.carrier = null;
  const daDisegnare = [];
  for(const k of ['H','A']){
    const anc = anchors(k);
    const s = MV.sim.side(k);
    let nearest=null, nd=1e9;
    for(const p of s.xi){
      if(s.rc.has(p.id)) continue;
      const a = anc[p.id]; if(!a) continue;
      const d = Math.abs(a.x-MV.ball.x)+Math.abs(a.y-MV.ball.y);
      if(d<nd){ nd=d; nearest=p.id; }
    }
    for(const p of s.xi){
      if(s.rc.has(p.id)) continue;
      const a = anc[p.id]; if(!a) continue;
      let cur = MV.ppos[p.id];
      if(!cur){ cur = MV.ppos[p.id] = {x:a.x, y:a.y, jx:rnd()*6.28, jy:rnd()*6.28}; }
      let tx = a.x, ty = a.y;
      if(p.id===nearest){ tx = tx*0.4 + MV.ball.x*0.6; ty = ty*0.4 + MV.ball.y*0.6; }
      if(p.id===nearest && MV.scene && MV.scene.poss===k) MV.carrier = cur; // portatore di palla
      tx += Math.sin(ts/900 + cur.jx)*4;
      ty += Math.cos(ts/800 + cur.jy)*4;
      cur.x += (tx-cur.x)*0.07;
      cur.y += (ty-cur.y)*0.07;
      daDisegnare.push({p, cur, s, k});
    }
  }
  // cerchio dorato SOTTO chi ha il pallone (disegnato prima dei giocatori)
  if(MV.carrier){
    const cx = MV.carrier.x, cy = MV.carrier.y + 7;
    const puls = 8 + Math.sin(ts/220)*1.2;
    x.save();
    x.beginPath(); x.ellipse(cx, cy, puls, puls*0.5, 0, 0, Math.PI*2);
    x.fillStyle = 'rgba(255,210,63,.28)'; x.fill();
    x.lineWidth = 2; x.strokeStyle = '#000';
    x.beginPath(); x.ellipse(cx, cy, puls+1, puls*0.5+1, 0, 0, Math.PI*2); x.stroke();
    x.lineWidth = 2; x.strokeStyle = '#ffd23f';
    x.beginPath(); x.ellipse(cx, cy, puls, puls*0.5, 0, 0, Math.PI*2); x.stroke();
    x.restore();
  }
  // ora i giocatori, sopra il cerchio
  for(const {p, cur, s, k} of daDisegnare){
    drawGuy(x, cur.x, cur.y, s.team.c1, s.team.c2, (frame+p.id)%2, s.lineOf[p.id]==='POR');
    // cognome sotto i giocatori della squadra del Mister
    if(k===MV.userK){
      const nm = p.nm.split(' ').pop().toUpperCase();
      x.font = 'bold 7px monospace';
      x.textAlign = 'center';
      const tx = Math.round(clamp(cur.x, 18, PW-18));
      const ty = Math.round(cur.y) + 19;   // sotto il cerchio del possesso
      x.fillStyle = 'rgba(0,0,0,.8)';
      x.fillText(nm, tx+1, ty+1);
      x.fillStyle = '#f4f0dc';
      x.fillText(nm, tx, ty);
    }
  }
  // rete che vibra e lampeggia sul gol appena segnato
  if(MV.goalMark && MV.goalMark.t>0){
    const gm = MV.goalMark;
    gm.t -= 16.7;
    const k = Math.max(0, gm.t)/gm.dur;
    const sh = Math.round(Math.sin(ts/40)*2*k);         // vibrazione della rete
    x.fillStyle = gm.col;
    x.globalAlpha = 0.30 + 0.45*k;
    x.fillRect(gm.gx+sh, PH/2-GH, GW, GH*2);
    x.globalAlpha = 1;
    x.strokeStyle = gm.col; x.lineWidth = 2;
    x.strokeRect(gm.gx+sh, PH/2-GH, GW, GH*2);
    // onde d'urto dalla porta
    x.globalAlpha = 0.75*k;
    for(let r=0;r<3;r++){
      const rad = (1-k)*44 + r*11;
      x.beginPath(); x.arc(gm.gx+GW/2, PH/2, rad, 0, 7); x.stroke();
    }
    x.globalAlpha = 1;
  }
  // scia del pallone
  if(MV.trail && MV.trail.length){
    for(let i=0;i<MV.trail.length;i++){
      const a = 0.10 + 0.42*(i/MV.trail.length);
      const sz = i > MV.trail.length-4 ? 3 : 2;
      x.fillStyle = 'rgba(255,255,255,'+a.toFixed(2)+')';
      x.fillRect(Math.round(MV.trail[i].x)-1, Math.round(MV.trail[i].y)-1, sz, sz);
    }
  }
  // pallone: nucleo bianco con bordo nero, leggibile su erba e dentro la rete
  const bx = Math.round(MV.ball.x), by = Math.round(MV.ball.y);
  if(MV.goalMark && MV.goalMark.t>0){
    // dopo il gol il pallone in rete viene cerchiato, non lo si può mancare
    const pulse = 2 + Math.round(Math.abs(Math.sin(ts/110))*2);
    x.strokeStyle = '#ffd23f'; x.lineWidth = 2;
    x.strokeRect(bx-2-pulse, by-2-pulse, 6+pulse*2, 6+pulse*2);
  }
  x.fillStyle='#000'; x.fillRect(bx-2, by-2, 6, 6);
  x.fillStyle='#fff'; x.fillRect(bx-1, by-1, 4, 4);
  x.fillStyle='#c8ccd8'; x.fillRect(bx, by, 2, 2);
  // lampo (leggero: non deve coprire l'azione)
  if(MV.flashT>0){
    MV.flashT -= 16.7;
    x.fillStyle = 'rgba(255,255,255,'+(0.20*Math.max(0,MV.flashT)/260).toFixed(3)+')';
    x.fillRect(0,0,PW,PH);
  }
  // banner
  const bEl = document.getElementById('mbanner');
  if(bEl) bEl.style.opacity = (MV.bannerT>0 && (MV.bannerT-=16.7)>0) ? 1 : 0;
}
function mvBanner(txt, sub, cls){
  const b = document.getElementById('mbanner');
  if(!b) return;
  b.className = 'band' + (cls ? ' '+cls : '');
  b.innerHTML = `<span class="big">${txt}</span>` + (sub ? `<span class="sub">${esc(sub)}</span>` : '');
  MV.bannerT = sub ? 2400 : 1400;
}
function mvPlayerName(pid){
  for(const k of ['H','A']){
    const s = MV.sim.side(k);
    const p = s.team.players.find(x=>x.id===pid) || s.bench.find(x=>x.id===pid) || s.xi.find(x=>x.id===pid);
    if(p) return p.nm;
  }
  return '';
}
/* esultanza: la partita si ferma un attimo, lampo sul campo, marcatore e punteggio in risalto */
function mvGoalCelebration(sideK, goalEv, min){
  const mine = MV.userK ? sideK===MV.userK : null;
  const nm = goalEv ? mvPlayerName(goalEv.pid) : '';
  const rig = goalEv && goalEv.type==='pengoal' ? ' (rig.)' : '';
  const sub = nm ? `${nm}${rig} · ${min}'` : `${min}'`;
  // l'esultanza dura quanto serve al pallone per arrivare in rete, più un respiro
  const tempoAzione = 1.24 * MV.minuteMs;              // durata reale della traiettoria del gol
  MV.pauseMs = clamp(tempoAzione + 900, 1000, 4200);
  const arrivo = Math.min(3000, tempoAzione * 0.86);   // quando la palla entra davvero
  const team = MV.sim.side(sideK).team;
  const col = mine===false ? '#ff5d5d' : (team.c1==='#212121'||team.c1==='#111111' ? '#ffd23f' : team.c1);
  setTimeout(()=>{
    if(!MV.sim || MV.sim.finished) return;
    // rete, lampo e striscione scattano NEL MOMENTO in cui il pallone entra
    const durata = Math.max(700, MV.pauseMs - arrivo + 500);
    MV.goalMark = { gx: sideK==='H' ? FX1 : FX0-GW, col, dur: durata, t: durata };
    MV.flashT = 260;
    mvBanner(mine===false ? 'GOL SUBITO' : 'GOL!', sub,
             mine===null ? '' : mine ? 'mine' : 'theirs');
    sndGoal(mine!==false);
    if(mine===false) sndSad();
  }, arrivo);
  const el = document.getElementById('mres');
  if(el){
    el.classList.remove('pulse');
    void el.offsetWidth;               // forza il riavvio dell'animazione
    el.classList.add('pulse');
    setTimeout(()=>{ const e2=document.getElementById('mres'); if(e2) e2.classList.remove('pulse'); }, 1600);
  }
}
function mvLog(e){
  const log = document.getElementById('mlog');

  if(e.type==='flavor' && MV.speed>=8) return;
  const p = document.createElement('p');
  let cls = '';

  const min = e.min>0? `<b>${e.min}'</b> ` : '';

  const el = document.createElement('div');
  el.id = 'matchwrap';
  el.innerHTML = `

      <button class="btn small" id="mskip">FINE &raquo;</button>

    sndClick();
    MV.speed = MV.speed===1?2: MV.speed===2?4: MV.speed===4?8:1;
    G.opts.speed = MV.speed;
    MV.minuteMs = MV.SPEEDS[MV.speed];
    document.getElementById('mspeed').textContent = 'x'+MV.speed;
  };
  document.getElementById('mtactic').onclick = ()=>{ sndClick(); mvTacticPanel(); };
  document.getElementById('mskip').onclick = ()=>{
    sndClick();
    MV.waitHalf = false; MV.pauseMs = 0;

function mvFullTime(){
  MV.running = false;
  cancelAnimationFrame(MV.raf);
  crowdStop();
  const s = MV.sim;
  const r = s.result();
  const scorers = [];
  for(const k of ['H','A']){
    const side = s.side(k);
    for(const g of side.goals){
      const fp = side.team.players.find(p=>p.id===g.pid) || side.bench.find(p=>p.id===g.pid);
      scorers.push(`${g.min}' ${fp?fp.nm:'?'} (${side.team.short})`);
    }
  }
  let best=null, bestV=0;
  for(const k of ['H','A']){
    const side=s.side(k);
    for(const pid in side.votes) if(side.votes[pid]>bestV){
      bestV=side.votes[pid];
      const fp = side.team.players.find(p=>p.id==pid);
      if(fp) best = fp.nm+' ('+side.team.short+') '+side.votes[pid].toFixed(1);
    }
  }
  const pens = s.pens ? `<p class="center accT">Rigori: ${s.pens.h} - ${s.pens.a}</p>` : '';
  let pagella = '';
  if(MV.userK){
    const u = s.side(MV.userK);
    const giocatori = u.xi.concat(u.bench.filter(p=>u.stats[p.id] && u.stats[p.id].mins>0));
    const cols = [
      {k:'ruolo', label:'', val:p=>ORD_RUOLO[u.lineOf[p.id]||p.role],
        cell:p=>`${pillRuolo(p.role)}`},
      {k:'nome', label:'Nome', val:p=>p.nm.split(' ').pop(), cell:p=>esc(p.nm)},
      {k:'min', label:"Min", cls:'c', val:p=>-statLive(u,p).mins, cell:p=>statLive(u,p).mins+"'"},
      {k:'gol', label:'G', cls:'c', val:p=>-statLive(u,p).gl,
        cell:p=>{const g=statLive(u,p).gl; return g?`<b class="okT">${g}</b>`:'<span class="faint">·</span>';}},
      {k:'ass', label:'A', cls:'c', val:p=>-statLive(u,p).as,
        cell:p=>{const a=statLive(u,p).as; return a?`<b class="infoT">${a}</b>`:'<span class="faint">·</span>';}},
      {k:'tiri', label:'Tiri', full:'Tiri nello specchio della porta / tiri totali', cls:'c', val:p=>-statLive(u,p).sh,
        cell:p=>{const st=statLive(u,p); return st.sh?`${st.sot}/${st.sh}`:'<span class="faint">·</span>';}},
      {k:'dif', label:'Int', full:'Interventi difensivi riusciti e parate', cls:'c', val:p=>-(statLive(u,p).def+statLive(u,p).sv),
        cell:p=>{const st=statLive(u,p); const n=st.def+st.sv; return n||'<span class="faint">·</span>';}},
      {k:'voto', label:'Voto', full:'Voto in pagella, calcolato su quello che il giocatore ha fatto in campo', cls:'r', val:p=>-(u.votes[p.id]||0),
        cell:p=>{const v=u.votes[p.id]; return v===undefined?'<span class="faint">—</span>'
          : `<b class="${v>=6.8?'okT':v<5.6?'badT':'accT'}" style="font-size:14px">${v.toFixed(1)}</b>`;}}
    ];
    pagella = `<div class="sm accT mt mb">PAGELLA <span class="faint">· G gol · A assist · Tiri nello specchio/totali · Int interventi e parate</span></div>`
      + sortableTable('pagella', cols, giocatori, {defK:'voto', redraw:'mvFullTime()'});
  }
  openModal(`
    <h2>FINALE: ${esc(s.H.team.short)} ${s.gh} - ${s.ga} ${esc(s.A.team.short)}</h2>
    ${pens}
    <p class="sm dim center">${scorers.length? 'Marcatori: '+esc(scorers.join(', ')) : 'Nessun gol.'}</p>
    <table class="mt"><tr><td>Possesso</td><td class="r">${r.stats.possH}%</td><td class="r">${100-r.stats.possH}%</td></tr>
    <tr><td>Tiri</td><td class="r">${r.stats.shH}</td><td class="r">${r.stats.shA}</td></tr>
    <tr><td>Nello specchio</td><td class="r">${r.stats.sotH}</td><td class="r">${r.stats.sotA}</td></tr></table>
    <p class="sm mt">Migliore in campo: <b>${best?esc(best):'—'}</b></p>
    ${pagella}
    <button class="btn acc wide mt" onclick="closeModal();mvClose()">CONTINUA</button>`, true);

/* ================== SALVATAGGIO E ARCHIVIO DUREVOLE ==================
   Tre livelli, dal più veloce al più resistente:
   1. localStorage — copia immediata, sincrona, a ogni azione
   2. IndexedDB    — copia durevole con quota molto più ampia, più i backup
   3. file .json   — esportazione manuale, l'unica che sopravvive a tutto     */
const SAVE_KEY = 'mister_save_v1';
const DB_NOME = 'mister_db', DB_STORE = 'salvataggi', N_BACKUP = 4;
let ARCHIVIO = { permanente:null, usoKB:0, quotaKB:0, erroreLS:false, ultimoFile:null };

function idbApri(){
  return new Promise((ok, no)=>{
    if(!window.indexedDB) return no('IndexedDB non disponibile');
    const rq = indexedDB.open(DB_NOME, 1);
    rq.onupgradeneeded = ()=>{ if(!rq.result.objectStoreNames.contains(DB_STORE)) rq.result.createObjectStore(DB_STORE); };
    rq.onsuccess = ()=> ok(rq.result);
    rq.onerror = ()=> no(rq.error);
  });
}
function idbScrivi(chiave, valore){
  return idbApri().then(db=> new Promise((ok,no)=>{
    const tx = db.transaction(DB_STORE,'readwrite');
    tx.objectStore(DB_STORE).put(valore, chiave);
    tx.oncomplete = ()=>{ db.close(); ok(true); };
    tx.onerror = ()=>{ db.close(); no(tx.error); };
  }));
}
function idbLeggi(chiave){
  return idbApri().then(db=> new Promise((ok,no)=>{
    const rq = db.transaction(DB_STORE,'readonly').objectStore(DB_STORE).get(chiave);
    rq.onsuccess = ()=>{ db.close(); ok(rq.result||null); };
    rq.onerror = ()=>{ db.close(); no(rq.error); };
  }));
}
function idbChiavi(){
  return idbApri().then(db=> new Promise((ok,no)=>{
    const rq = db.transaction(DB_STORE,'readonly').objectStore(DB_STORE).getAllKeys();
    rq.onsuccess = ()=>{ db.close(); ok(rq.result||[]); };
    rq.onerror = ()=>{ db.close(); no(rq.error); };
  }));
}
function idbCancella(chiave){
  return idbApri().then(db=> new Promise((ok)=>{
    const tx = db.transaction(DB_STORE,'readwrite');
    tx.objectStore(DB_STORE).delete(chiave);
    tx.oncomplete = ()=>{ db.close(); ok(true); };
    tx.onerror = ()=>{ db.close(); ok(false); };
  }));
}
/* chiede al browser di NON cancellare i dati per far spazio */
function chiediMemoriaPermanente(){
  if(!navigator.storage || !navigator.storage.persist) return Promise.resolve(null);
  return navigator.storage.persisted().then(g => g ? true : navigator.storage.persist())
    .then(v=>{ ARCHIVIO.permanente = v; return v; })
    .catch(()=>null);
}
function leggiSpazio(){
  if(!navigator.storage || !navigator.storage.estimate) return Promise.resolve(null);
  return navigator.storage.estimate().then(s=>{
    ARCHIVIO.usoKB = Math.round((s.usage||0)/1024);
    ARCHIVIO.quotaKB = Math.round((s.quota||0)/1024);
    return s;
  }).catch(()=>null);
}
function schedaSalvataggio(json){
  const t = playerTeam();
  return { json, ts: Date.now(), season:G.season, week:G.week, squadra:t.name, div:t.div };
}
function saveGame(){
  let testo = null;
  try{
    G.nextPid = _pid;                       // il contatore degli id va salvato con la partita
    testo = JSON.stringify(G);
    localStorage.setItem(SAVE_KEY, testo);
    ARCHIVIO.erroreLS = false;
  }catch(e){
    if(!ARCHIVIO.erroreLS){
      ARCHIVIO.erroreLS = true;
      setTimeout(()=>openModal(`<h2>MEMORIA PIENA</h2>
        <p class="sm">Il browser non ha accettato il salvataggio rapido. La partita continua a essere
        archiviata nel deposito durevole, ma <b>esporta la carriera su file</b> (CLUB → OPZIONI) per sicurezza.</p>
        <button class="btn acc wide mt" onclick="closeModal()">HO CAPITO</button>`), 60);
    }
  }
  if(testo) idbScrivi('corrente', schedaSalvataggio(testo)).catch(()=>{});

/* backup automatico: una fotografia per settimana di gioco, ne restano N_BACKUP */
function backupAutomatico(){
  let testo;
  try{ G.nextPid = _pid; testo = JSON.stringify(G); }catch(e){ return; }
  const chiave = 'bk_' + String(Date.now());
  idbScrivi(chiave, schedaSalvataggio(testo))
    .then(idbChiavi)
    .then(chiavi=>{
      const bk = chiavi.filter(k=>String(k).startsWith('bk_')).sort();
      const daButtare = bk.slice(0, Math.max(0, bk.length - N_BACKUP));
      return Promise.all(daButtare.map(idbCancella));
    }).catch(()=>{});
}

/* controlla che il file sia davvero una carriera di MISTER */
function carrieraValida(d){
  if(!d || typeof d!=='object') return 'Il file non contiene dati leggibili.';
  if(!Array.isArray(d.teams) || d.teams.length < 32) return 'Non sembra una carriera di MISTER.';
  if(typeof d.teamId!=='number' || !d.teams[d.teamId]) return 'La squadra allenata non risulta nel file.';
  if(typeof d.season!=='number' || typeof d.week!=='number') return 'Il file è incompleto o rovinato.';
  if(!Array.isArray(d.calendar) || !d.calendar.length) return 'Il calendario della stagione è assente.';
  for(const t of d.teams) if(!Array.isArray(t.players)) return 'Le rose delle squadre sono assenti.';
  return null;
}
function importaCarriera(daTitolo){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,application/json';
  inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.onchange = ()=>{
    const f = inp.files && inp.files[0];
    inp.remove();
    if(!f) return;
    const fr = new FileReader();
    fr.onload = ()=>{
      let dati = null, errore = null;
      try{ dati = JSON.parse(fr.result); }catch(e){ errore = 'Il file non è leggibile: forse non è quello giusto.'; }
      if(!errore) errore = carrieraValida(dati);
      if(errore){
        openModal(`<h2>FILE NON VALIDO</h2><p class="sm">${esc(errore)}</p>
          <button class="btn wide mt" onclick="closeModal()">OK</button>`);
        return;
      }
      const t = dati.teams[dati.teamId];
      const conferma = `<h2>CARICARE QUESTA CARRIERA?</h2>
        <p class="sm"><b>${esc(t.name)}</b> · stagione ${dati.season}, ${fmtDate(dati.week)} · Serie ${t.div}</p>
        ${daTitolo && !localStorage.getItem(SAVE_KEY) ? ''
          : '<p class="sm badT">La carriera attualmente in corso verrà sostituita.</p>'}
        <div class="row mt">
          <button class="btn acc grow" id="btnConfImp">CARICA</button>
          <button class="btn grow" onclick="closeModal()">ANNULLA</button>
        </div>`;
      openModal(conferma);
      $('btnConfImp').onclick = ()=>{ closeModal(); applicaImport(dati); };
    };
    fr.onerror = ()=>{
      openModal(`<h2>LETTURA FALLITA</h2><p class="sm">Non sono riuscito a leggere il file.</p>
        <button class="btn wide mt" onclick="closeModal()">OK</button>`);
    };
    fr.readAsText(f);
  };
  inp.click();
}

function mostraGlossario(el){
  const testo = el.getAttribute('data-full');

  app.appendChild(d);

  d.style.left = clamp(left, 8, Math.max(8, ra.width - w - 8))+'px';
  let top = (r.top - ra.top) - d.offsetHeight - 8;
  if(top < 4) top = (r.bottom - ra.top) + 8;
  d.style.top = clamp(top, 4, Math.max(4, ra.height - d.offsetHeight - 4))+'px';
  beep(1500,0.03,'square',0.04);
  LP.hide = setTimeout(chiudiGlossario, 4000);

function initLongPress(){
  document.addEventListener('pointerdown', e=>{
    chiudiGlossario();
    LP.fired = false;
    const el = e.target.closest ? e.target.closest('[data-full]') : null;
    clearTimeout(LP.timer); LP.timer = null;
    if(!el) return;
    LP.x = e.clientX; LP.y = e.clientY;
    LP.timer = setTimeout(()=>{ LP.fired = true; LP.timer = null; mostraGlossario(el); }, 450);
  }, true);
  const annulla = ()=>{ clearTimeout(LP.timer); LP.timer = null; };
  document.addEventListener('pointerup', annulla, true);
  document.addEventListener('pointercancel', annulla, true);
  document.addEventListener('pointermove', e=>{
    if(LP.timer && (Math.abs(e.clientX-LP.x)>8 || Math.abs(e.clientY-LP.y)>8)) annulla();
  }, true);
  // dopo una pressione lunga il clic NON deve ordinare o aprire schede
  document.addEventListener('click', e=>{
    if(LP.fired){ LP.fired = false; e.stopPropagation(); e.preventDefault(); }
  }, true);
  document.addEventListener('contextmenu', e=>{
    if(e.target.closest && e.target.closest('[data-full]')) e.preventDefault();
  });
}

/* ================== TABELLE ORDINABILI (generiche) ==================
   Ogni tabella del gioco passa di qui: le intestazioni sono cliccabili,
   il secondo clic inverte l'ordine, la freccia indica il verso.        */
const TSORT = {};
function tsortGet(id, defK, defDir){
  if(!TSORT[id]) TSORT[id] = {k:defK||null, dir:defDir||1, redraw:null};
  return TSORT[id];
}
function tsortClick(id, k){
  const s = tsortGet(id);
  if(s.k===k) s.dir = -s.dir; else { s.k = k; s.dir = 1; }
  sndClick();
  // si resta esattamente dove si era, sia nelle schermate sia nelle finestre
  const sc = screenEl(), box = document.querySelector('#modal .box');
  const yScreen = sc ? sc.scrollTop : 0, yBox = box ? box.scrollTop : 0;
  if(s.redraw){ try{ (new Function(s.redraw))(); }catch(e){} }
  if(sc) sc.scrollTop = yScreen;
  const box2 = document.querySelector('#modal .box');
  if(box2) box2.scrollTop = yBox;
}
/* cols: {k, label, cls, cell(r), val(r), num} — k assente = colonna non ordinabile
   opt: {defK, defDir, redraw, rowCls(r,i), rowClick(r,i), empty} */
function sortableTable(id, cols, rows, opt){
  opt = opt || {};
  const st = tsortGet(id, opt.defK, opt.defDir);
  st.redraw = opt.redraw || st.redraw;
  let data = rows.slice();
  const col = cols.find(c=>c.k===st.k);
  if(col && col.val){
    data.sort((a,b)=>{
      const va = col.val(a), vb = col.val(b);
      let r;
      if(typeof va==='string' || typeof vb==='string') r = String(va).localeCompare(String(vb));
      else r = (va-vb);
      return r * st.dir;
    });
  }
  const head = cols.map(c=>{
    const arrow = (st.k===c.k) ? (st.dir===1?' ▲':' ▼') : (c.k?'<span class="sarr">⇅</span>':'');
    const full = c.full || GLOSSARIO[(c.label||'').toUpperCase()] || '';
    const cls = (c.cls?c.cls+' ':'') + (c.k?'sortable ':'') + (full?'abbr':'');
    const oc = c.k ? ` onclick="tsortClick('${id}','${c.k}')"` : '';
    const dt = full ? ` data-abbr="${esc(c.label||'')}" data-full="${esc(full)}"` : '';
    return `<th class="${cls}"${oc}${dt}>${c.label||''}${arrow}</th>`;
  }).join('');
  if(!data.length) return `<p class="sm dim">${esc(opt.empty||'Nessun dato.')}</p>`;
  const body = data.map((r,i)=>{
    const rc = (opt.rowCls? opt.rowCls(r,i) : '') + (opt.rowClick?' click':'');
    const oc = opt.rowClick ? ` onclick="${opt.rowClick(r,i)}"` : '';
    return `<tr class="${rc}"${oc}>` +
      cols.map(c=>`<td class="${c.cls||''}">${c.cell(r,i)}</td>`).join('') + '</tr>';
  }).join('');
  // le tabelle larghe scorrono nel loro contenitore invece di uscire dallo schermo
  return `<div class="tscroll"><table><tr>${head}</tr>${body}</table></div>`;
}

/* ---------- barrette e utilità di resa ---------- */
function bar(v, max, color){
  const pc = clamp(100*v/(max||100),0,100);
  const c = color || (pc>66?'var(--ok)':pc>33?'var(--acc)':'var(--bad)');
  return `<span class="bar"><i style="width:${pc}%;background:${c}"></i></span>`;
}
function stars(tier){
  const full = clamp(6-tier, 0, 5);
  return '★'.repeat(full)+'<span class="faint">'+'★'.repeat(5-full)+'</span>';
}
function fuzzyOvr(p, mine){
  if(mine || G.club.staff.oss>0) return ovr(p);
  return '~'+(Math.round(ovr(p)/5)*5);
}
/* ---------- forma, condizione, morale: etichette parlanti ---------- */
function formaTxt(f){
  return f>=8.5?'in gran forma' : f>=7?'in forma' : f>=5.5?'nella media' : f>=4?'appannato' : 'in crisi di rendimento';
}
function condTxt(c){
  return c>=90?'fresco' : c>=70?'in buone gambe' : c>=50?'affaticato' : c>=30?'molto stanco' : 'a pezzi';
}
function moraleTxt(m){
  return m>=8.5?'entusiasta' : m>=7?'sereno' : m>=5?'tranquillo' : m>=3.5?'giù di morale' : 'demoralizzato';
}
/* scheda con tutte le statistiche di un giocatore (usata nei cambi) */
function statLine(p, condLive){
  const c = Math.round(condLive!==undefined ? condLive : p.cond);
  const R = Math.round;
  const attrs = p.role==='POR'
    ? [['PAR',R(p.par)],['DIF',R(p.dif)],['TEC',R(p.tec)],['VEL',R(p.vel)],['RES',R(p.res)]]
    : [['ATT',R(p.att)],['DIF',R(p.dif)],['TEC',R(p.tec)],['VEL',R(p.vel)],['RES',R(p.res)]];
  const sg = (t,cls)=>`<span class="abbr ${cls||''}" data-abbr="${t}" data-full="${esc(GLOSSARIO[t]||'')}">${t}</span>`;
  return `
    <div class="tiny dim">${p.age} anni · ${sg('COND','okT')} <span class="okT">${c}%</span>
      · ${sg('FORMA','infoT')} <span class="infoT">${p.frm.toFixed(1)}</span>
      · ${sg('MORALE')} ${p.mor.toFixed(1)}</div>
    <div class="tiny faint">${attrs.map(([k,v])=>`${sg(k)} <span class="ink">${v}</span>`).join(' · ')}</div>`;
}

function xiFromPids(){
  const t = playerTeam();
  let xi = (G.xiPids||[]).map(pid=>t.players.find(p=>p.id===pid)).filter(p=>p && p.inj<=0 && p.squal<=0);
  if(xi.length!==11){
    xi = bestXI(t);
    G.xiPids = xi.map(p=>p.id);
  }
  return xi;
}
function startPlayerMatch(pm, instant){
  const t = playerTeam();
  const home = pm.m.h===t.id;
  const xi = xiFromPids();
  const opts = { extra: pm.comp!=='L', userSide: home?'H':'A' };
  if(home){ opts.xiH = xi; opts.formH = t.formation; }
  else { opts.xiA = xi; opts.formA = t.formation; opts.aiHome = true; }
  const sim = new MatchSim(T(pm.m.h), T(pm.m.a), opts);
  if(instant){
    while(!sim.finished) sim.step();
    MV.sim = sim; MV.pm = pm; MV.userK = home?'H':'A'; MV.onEnd = finishPlayerMatch;
    MV.running = false; MV.logIdx = sim.events.length;
    mvFullTime();
  } else {
    showMatch(pm, sim, finishPlayerMatch);
  }
}
function finishPlayerMatch(sim){
  const r = advanceWeek(sim);
  afterWeek(r);
}

function pickForSlot(slotIdx){
  const t = playerTeam();

    const ko = p.inj>0||p.squal>0;
    const v = ovr(p), d = v-cOvr;

      : `<span class="${d>0?'okT':'badT'}">${d>0?'+':''}${d}</span>`;

      onclick="${ko?'':'setSlot('+slotIdx+','+p.id+')'}">
      <div class="row">
        ${pillRuolo(p.role)}
        <div class="grow"><b>${esc(p.nm)}</b> ${statoPill(p)}</div>
        <div class="center"><div class="tiny faint">VAL</div><div class="big">${v}</div></div>
        <div class="center" style="min-width:46px"><div class="tiny faint">±</div><div>${dTxt}</div></div>
      </div>
      ${statLine(p)}
    </div>`;
  }).join('');
  openModal(`<h2>SOSTITUZIONE</h2>
    ${cur?`<div class="swapbox">
      <div class="row">
        ${pillRuolo(cur.role)}
        <div class="grow"><span class="badT tiny">ESCE</span><br><b>${esc(cur.nm)}</b></div>
        <div class="center"><div class="tiny faint">VAL</div><div class="big">${cOvr}</div></div>
      </div>
      ${statLine(cur)}

function uiArchivio(){
  openModal(`<h2>DATI E BACKUP</h2><p class="sm dim">Controllo in corso…</p>`);
  Promise.all([
    chiediMemoriaPermanente(),
    leggiSpazio(),
    idbChiavi().then(ch=>{
      const bk = ch.filter(k=>String(k).startsWith('bk_')).sort().reverse();
      return Promise.all(bk.map(k=>idbLeggi(k).then(r=>({k, r}))));
    }).catch(()=>[])
  ]).then(([perm, spazio, backup])=>{
    const stato = perm===true
      ? '<span class="okT">PROTETTI</span> — il browser si è impegnato a non cancellarli per fare spazio.'
      : perm===false
        ? '<span class="badT">NON PROTETTI</span> — il browser può cancellarli se lo spazio scarseggia o se non apri il gioco per molto tempo.'
        : '<span class="faint">non determinabile su questo browser</span>.';
    const spazioTxt = ARCHIVIO.quotaKB
      ? `${(ARCHIVIO.usoKB/1024).toFixed(1)} MB usati su ${(ARCHIVIO.quotaKB/1024).toFixed(0)} MB disponibili`
      : 'non disponibile';
    const righe = backup.filter(b=>b.r).map(b=>{
      const d = new Date(b.r.ts);
      const quando = d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'}) + ' ' +
                     d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
      return `<div class="teampick" onclick="uiRipristina('${b.k}')">
        <div class="nm">${esc(b.r.squadra||'—')} · stagione ${b.r.season}, ${fmtDate(b.r.week)}
          <small>salvato il ${quando} · Serie ${b.r.div||'?'}</small></div>
        <span class="accT">↺</span></div>`;
    }).join('');
    openModal(`
      <h2>DATI E BACKUP</h2>
      <table class="wrapcells">
        <tr><td>Stato dei dati</td><td class="r">${stato}</td></tr>
        <tr><td>Spazio</td><td class="r">${spazioTxt}</td></tr>
        <tr><td>Copie automatiche</td><td class="r">${backup.length} (una per settimana giocata)</td></tr>
      </table>
      ${perm===false?`<button class="btn acc wide mt" onclick="uiChiediPermanenza()">CHIEDI LA PROTEZIONE</button>`:''}
      <p class="tiny faint mt">Il modo sicuro al 100% resta <b>Esporta carriera</b>: un file sul telefono o sul computer
      non dipende dal browser. Aggiungere il gioco alla schermata home aiuta molto: i browser proteggono
      le app installate più delle semplici pagine.</p>
      <div class="sm accT mt mb">RIPRISTINA UNA COPIA</div>
      ${righe || '<p class="sm dim">Nessuna copia automatica ancora: se ne crea una a ogni settimana giocata.</p>'}
      <button class="btn wide mt" onclick="closeModal()">CHIUDI</button>`);
  }).catch(()=>{
    openModal(`<h2>DATI E BACKUP</h2><p class="sm">Questo browser non espone le informazioni sull'archivio.</p>
      <button class="btn wide mt" onclick="closeModal()">OK</button>`);
  });
}

/* ================== SCHERMATA: LEGA ================== */
let legaTab = 'A';
function renderLega(s){
  const t = playerTeam();
  const tabs = [['A','SERIE A'],['B','SERIE B'],['C','SERIE C'],['D','SERIE D'],['cal','CALENDARIO'],['coppa','COPPA'],['marc','BOMBER']];
  if(G.ecup) tabs.push(['euro','CHAMPIONS']);
  let body='';
  if(DIVS.includes(legaTab)){
    const st = standings(legaTab).map((r,i)=>Object.assign({pos:i+1, nome:T(r.id).name, dr:r.gf-r.gs}, r));
    const cols = [
      {k:'pos', label:'#', full:"Posizione in classifica", val:r=>r.pos, cell:r=>r.pos},
      {k:'nome', label:'Squadra', val:r=>r.nome, cell:r=>esc(r.nome)},
      {k:'pt', label:'Pt', full:'Punti in classifica', cls:'c', val:r=>-r.pt, cell:r=>`<span class="accT">${r.pt}</span>`},
      {k:'g', label:'G', full:"Partite giocate", cls:'c', val:r=>-r.g, cell:r=>r.g},
      {k:'v', label:'V', full:"Partite vinte", cls:'c', val:r=>-r.v, cell:r=>r.v},
      {k:'n', label:'N', full:"Partite pareggiate (nulle)", cls:'c', val:r=>-r.n, cell:r=>r.n},
      {k:'s', label:'P', full:"Partite perse", cls:'c', val:r=>-r.s, cell:r=>r.s},
      {k:'gf', label:'GF', full:'Gol fatti', cls:'c', val:r=>-r.gf, cell:r=>r.gf},
      {k:'gs', label:'GS', full:'Gol subiti', cls:'c', val:r=>r.gs, cell:r=>r.gs},
      {k:'dr', label:'DR', full:'Differenza reti: gol fatti meno gol subiti', cls:'c', val:r=>-r.dr, cell:r=>(r.dr>0?'+':'')+r.dr}
    ];
    body = sortableTable('cls_'+legaTab, cols, st, {defK:'pos', redraw:"nav('lega')",
      rowCls:(r)=> (r.id===t.id?'me ':'') +
        (TSORT['cls_'+legaTab].k==='pos' ? ((legaTab!=='D' && r.pos===13?'zoneDown ':'') + (legaTab!=='A' && r.pos===3?'zoneUp':'')) : '')})
      + `<p class="tiny faint mt">${legaTab==='A'?'Ultime 3: retrocedono in B · prime 2: Coppa dei Campioni':
        legaTab==='D'?'Prime 3: promosse in Serie C':
        `Prime 3: promosse in Serie ${divUpper(legaTab)} · ultime 3: retrocedono in Serie ${legaTab==='B'?'C':'D'}`}</p>`;
  } else if(legaTab==='cal'){
    const fx = fxOf(t.div);
    const partite = [];
    for(let r0=0;r0<fx.length;r0++){
      const m = fx[r0].find(x=>x.h===t.id||x.a===t.id);
      if(!m) continue;
      const home = m.h===t.id;
      const opp = T(home?m.a:m.h);
      const esito = !m.p ? 0 : ((home&&m.gh>m.ga)||(!home&&m.ga>m.gh)) ? 3 : (m.gh===m.ga?1:2);
      partite.push({g:r0+1, home, opp, m, esito});
    }
    const cols = [
      {k:'g', label:'G.', full:"Giornata di campionato", val:r=>r.g, cell:r=>`<span class="faint">${r.g}</span>`},
      {k:'dove', label:'', cls:'c', val:r=>r.home?0:1, cell:r=>r.home?'<span class="okT">casa</span>':'<span class="infoT">fuori</span>'},
      {k:'opp', label:'Avversario', val:r=>r.opp.name, cell:r=>esc(r.opp.name)},
      {k:'forza', label:'Forza', full:'Forza media della rosa avversaria', cls:'c', val:r=>-teamOvr(r.opp),
        cell:r=> G.club.staff.oss>0 ? teamOvr(r.opp) : '~'+(Math.round(teamOvr(r.opp)/5)*5)},
      {k:'ris', label:'Risultato', cls:'r', val:r=>r.esito,
        cell:r=> !r.m.p ? '<span class="faint">—</span>'
          : `<b class="${r.esito===3?'okT':r.esito===1?'accT':'badT'}">${r.m.gh}-${r.m.ga}</b>`}
    ];
    body = sortableTable('calend', cols, partite, {defK:'g', redraw:"nav('lega')"});
  } else if(legaTab==='coppa'){
    body = cupBracketHtml(G.cup, 'Coppa Nazionale', cupRoundNames(G.cup).map(x=>x.toUpperCase()));
  } else if(legaTab==='euro'){
    body = cupBracketHtml(G.ecup, 'Coppa dei Campioni', ['OTTAVI','QUARTI','SEMIFINALI','FINALE']);
  } else {
    const div = t.div==='E'?'A':t.div;
    let ps = [];
    for(const id of idsOf(div))
      for(const p of T(id).players)
        if(p.sGoals>0 || (p.sAssists||0)>0) ps.push({p, team:T(id)});
    ps.sort((a,b)=> b.p.sGoals-a.p.sGoals || (b.p.sAssists||0)-(a.p.sAssists||0));
    ps = ps.slice(0,25).map((x,i)=>Object.assign({pos:i+1}, x));
    const cols = [
      {k:'pos', label:'#', full:"Posizione nella classifica marcatori", val:r=>r.pos, cell:r=>`<span class="faint">${r.pos}</span>`},
      {k:'nome', label:'Giocatore', val:r=>r.p.nm.split(' ').pop(), cell:r=>esc(r.p.nm)},
      {k:'squadra', label:'Sq.', full:'Squadra di appartenenza', val:r=>r.team.short, cell:r=>`<span class="faint">${esc(r.team.short)}</span>`},
      {k:'gol', label:'Gol', cls:'c', val:r=>-r.p.sGoals, cell:r=>`<span class="accT">${r.p.sGoals}</span>`},
      {k:'ass', label:'Ass', full:'Assist: passaggi che hanno portato direttamente a un gol', cls:'c', val:r=>-(r.p.sAssists||0), cell:r=>r.p.sAssists||0},
      {k:'media', label:'Media', full:'Media dei voti presi in stagione', cls:'r', val:r=>-mediaVoto(r.p),
        cell:r=>{ const m=mediaVoto(r.p); return m? m.toFixed(2) : '<span class="faint">—</span>'; }}
    ];
    body = sortableTable('bomber', cols, ps, {defK:'pos', redraw:"nav('lega')",
      rowCls:r=> r.team.id===t.id?'me':'', empty:'Ancora nessun gol in campionato.'});
  }
  s.innerHTML = `<div class="panel"><h2>Lega</h2>
    <div class="tabs">${tabs.map(([k,l])=>`<button class="btn ${k===legaTab?'on':''}" data-k="${k}">${l}</button>`).join('')}</div>
    ${body}</div>`;
  s.querySelectorAll('.tabs button').forEach(b=> b.onclick=()=>{ sndClick(); legaTab=b.dataset.k; nav('lega', true); });
}
function cupBracketHtml(cup, nome, roundNames){
  if(!cup) return `<p class="sm dim">Quest'anno non partecipiamo alla ${nome}.</p>`;
  let html='';
  cup.rounds.forEach((ties,i)=>{
    html += `<div class="sm accT mt mb">${roundNames[i]||('TURNO '+(i+1))}</div>`;
    html += ties.map(m=>{
      const done = m.p;
      const pen = m.pen? ` <span class="tiny faint abbr" data-abbr="dcr" data-full="${esc(GLOSSARIO.dcr)}">(${m.pen.h}-${m.pen.a} dcr)</span>`:'';
      const meIn = m.h===G.teamId||m.a===G.teamId;
      return `<div class="news ${meIn?'accT':''}">${esc(T(m.h).name)} - ${esc(T(m.a).name)}
        <span style="float:right">${done? `<b>${m.gh}-${m.ga}</b>${pen}`:'<span class="faint">da giocare</span>'}</span></div>`;
    }).join('');
  });
  if(cup.winner!==null && cup.winner!==undefined)
    html += `<p class="mt accT">🏆 Vincitrice: <b>${esc(T(cup.winner).name)}</b></p>`;
  return html;
}

      d.tier<=5 ? 'Provinciale coraggiosa: ogni punto è una conquista.' :
      d.tier===6 ? 'Calcio di provincia vera: campi spelacchiati e tanta fame.' :
      'L\'ultimo gradino della piramide: da qui si può solo salire.'}</p>

      <button class="btn acc grow" onclick="closeModal();beginCareer(${idx})">ACCETTA LA PANCHINA</button>

    </div>`);
}
function beginCareer(idx){
  const ts = $('teamsel'); if(ts) ts.remove();
  newGame(idx);
  G.xiPids = bestXI(playerTeam()).map(p=>p.id);
  saveGame();
  startUI();
}
function startUI(){
  $('topbar').classList.remove('hidden');
  $('navbar').classList.remove('hidden');
  buildNav();
  nav('home');
}

/* ================== AVVIO ================== */
function boot(){
  document.addEventListener('pointerdown', function once(){ initAudio(); document.removeEventListener('pointerdown', once); });
  initLongPress();
  chiediMemoriaPermanente();
  leggiSpazio();
  let has = loadGame();
  if(has){ showTitle(true); return; }
  // localStorage vuoto o cancellato dal browser: si tenta il deposito durevole
  idbLeggi('corrente').then(rec=>{
    if(rec && rec.json){
      try{
        const dati = JSON.parse(rec.json);
        if(!carrieraValida(dati)){
          G = dati; _pid = G.nextPid || 1;
          migrateSave(); repairIds(); saveGame();
          has = true;
          addNews('Salvataggio rapido perduto: carriera recuperata dal deposito durevole.','club');
        }
      }catch(e){}
    }
  }).catch(()=>{}).then(()=> showTitle(has));
}
window.addEventListener('load', boot);
