<title>MISTER — Manager di Calcio Retrò</title>
<style>
/* ============ MISTER — stile pixel retrò ============ */
:root{
  --bg:#0d1124; --panel:#181f3d; --panel2:#212a52; --panel3:#2b3566;
  --ink:#f2ecd8; --dim:#98a1c8; --faint:#6a7099;
  --acc:#ffd23f; --acc2:#ff9d2e;
  --ok:#5dd66a; --bad:#ff5d5d; --info:#5db9ff;
  --line:#3a4478; --black:#05070f;
  --grass1:#2f7d3a; --grass2:#2a7034;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Courier New",ui-monospace,Menlo,Consolas,monospace;
  font-weight:bold; font-size:14px; line-height:1.35;
  overflow:hidden; user-select:none; -webkit-user-select:none;
}
#app{height:100%;display:flex;flex-direction:column;max-width:860px;margin:0 auto;position:relative}
/* scanlines */
#app::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:400;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px);}
/* ---------- barre ---------- */
#topbar{flex:0 0 auto;background:var(--panel);border-bottom:3px solid var(--black);
  padding:6px 10px;display:flex;align-items:center;gap:10px;z-index:20}
#topbar .tname{color:var(--acc);font-size:15px;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .tinfo{margin-left:auto;text-align:right;font-size:11px;color:var(--dim);white-space:nowrap;line-height:1.25}
#topbar .money{color:var(--ok)} #topbar .money.neg{color:var(--bad)}
#screen{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:10px 10px 84px 10px;scrollbar-width:thin}
#navbar{position:absolute;left:0;right:0;bottom:0;background:var(--panel);
  border-top:3px solid var(--black);display:flex;z-index:300}
#navbar button{flex:1;background:none;border:none;color:var(--dim);
  font-family:inherit;font-weight:bold;font-size:10px;letter-spacing:.5px;
  padding:8px 0 10px;cursor:pointer;border-right:2px solid var(--black)}
#navbar button:last-child{border-right:none}
#navbar button .ic{display:block;font-size:17px;line-height:1.1;filter:grayscale(1) brightness(1.4)}
#navbar button.on{color:var(--acc);background:var(--panel3)}
#navbar button.on .ic{filter:none}
/* ---------- componenti ---------- */
.panel{background:var(--panel);border:3px solid var(--black);box-shadow:0 4px 0 rgba(0,0,0,.55);
  padding:10px;margin-bottom:12px}
.panel h2{font-size:13px;color:var(--acc);letter-spacing:2px;text-transform:uppercase;
  border-bottom:2px solid var(--line);padding-bottom:6px;margin-bottom:8px}
.panel h2 small{color:var(--faint);letter-spacing:0}
.btn{display:inline-block;background:var(--panel3);color:var(--ink);border:3px solid var(--black);
  box-shadow:0 3px 0 var(--black);font-family:inherit;font-weight:bold;font-size:13px;
  letter-spacing:1px;text-transform:uppercase;padding:8px 14px;cursor:pointer;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.acc{background:var(--acc);color:#221c00}
.btn.ok{background:var(--ok);color:#03260a}
.btn.bad{background:var(--bad);color:#2b0303}
.btn.small{font-size:11px;padding:5px 9px;box-shadow:0 2px 0 var(--black)}
.btn.dis,.btn:disabled{opacity:.4;pointer-events:none}
.btn.wide{display:block;width:100%}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.center{text-align:center}
.dim{color:var(--dim)} .faint{color:var(--faint)} .accT{color:var(--acc)}
.okT{color:var(--ok)} .badT{color:var(--bad)} .infoT{color:var(--info)} .ink{color:var(--ink)}
.tiny{font-size:10px} .sm{font-size:11px}
.mt{margin-top:10px}.mb{margin-bottom:10px}
/* tabelle */
table{width:100%;border-collapse:collapse;font-size:12px}
.tscroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;max-width:100%}
.tscroll table{min-width:100%;width:auto}
.tscroll::-webkit-scrollbar{height:6px}
.tscroll::-webkit-scrollbar-thumb{background:var(--line)}
th{color:var(--faint);font-size:10px;text-transform:uppercase;letter-spacing:1px;
  text-align:left;padding:3px 4px;border-bottom:2px solid var(--line)}
th.sortable{cursor:pointer;color:var(--dim)}
th.sortable:active{color:var(--acc)}
th .sarr{color:var(--line);margin-left:2px}
/* sigle spiegabili con la pressione prolungata */
.abbr{border-bottom:1px dotted var(--faint)}
th.abbr{border-bottom:2px solid var(--line)}
#glossa{position:absolute;z-index:420;background:var(--panel3);color:var(--ink);
  border:3px solid var(--black);box-shadow:0 4px 0 rgba(0,0,0,.6);
  padding:7px 9px;font-size:11px;line-height:1.45;letter-spacing:0;pointer-events:none}
td{padding:4px;border-bottom:1px solid #232a4d;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:active{background:var(--panel3)}
tr.me td{background:rgba(255,210,63,.12);color:var(--acc)}
tr.zoneUp td{border-bottom:2px solid rgba(93,214,106,.5)}
tr.zoneDown td{border-top:2px solid rgba(255,93,93,.5)}
td.r,th.r{text-align:right} td.c,th.c{text-align:center}
table.wrapcells td{white-space:normal}
/* barrette attributi */
.bar{display:inline-block;width:56px;height:8px;background:var(--black);border:1px solid var(--line);vertical-align:middle}
.bar i{display:block;height:100%}
/* pill / badge */
.pill{display:inline-block;font-size:10px;padding:1px 6px;border:2px solid var(--black);
  background:var(--panel3);color:var(--ink);letter-spacing:1px}
.pill.P{background:#c9a227;color:#221c00}.pill.D{background:#3f7fbf;color:#eef}
.pill.C{background:#3fae5a;color:#efe}.pill.A{background:#c94f4f;color:#fee}
.pill.inj{background:var(--bad);color:#fff}
.pill.sq{background:#888;color:#111}
.stars{color:var(--acc);letter-spacing:2px;font-size:11px}
/* liste notizie */
.news{font-size:12px;padding:5px 2px;border-bottom:1px dashed #2c355e;color:var(--dim)}
.news b{color:var(--ink)}
.news .w{color:var(--faint);font-size:10px;margin-right:6px}
/* schermata partita */
#matchwrap{position:absolute;inset:0;background:var(--bg);z-index:350;display:flex;flex-direction:column}
#mscore{flex:0 0 auto;background:var(--panel);border-bottom:3px solid var(--black);
  padding:6px 8px;text-align:center}
#mscore .teams{font-size:14px;letter-spacing:1px}
#mscore .res{color:var(--acc);font-size:20px;margin:0 8px}
#mscore .clock{color:var(--info);font-size:12px}
#mposs{flex:0 0 auto;background:var(--panel2);border-bottom:3px solid var(--black);
  padding:4px 8px;text-align:center;font-size:11px;letter-spacing:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mposs .lbl{color:var(--faint)}
#pitchbox{flex:0 0 auto;position:relative;background:#000;border-bottom:3px solid var(--black);line-height:0}
#pitch{width:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#mbanner{position:absolute;left:0;right:0;top:4%;text-align:center;pointer-events:none;
  opacity:0;transition:opacity .1s;z-index:5;line-height:1.15}
#mbanner.band{background:rgba(5,7,15,.74);padding:9px 0;border-top:3px solid #000;border-bottom:3px solid #000}
#mbanner .big{display:block;font-size:34px;letter-spacing:5px;color:var(--acc);
  text-shadow:3px 3px 0 #000,6px 6px 0 rgba(0,0,0,.45)}
#mbanner .sub{display:block;font-size:13px;letter-spacing:2px;color:#fff;
  text-shadow:2px 2px 0 #000;margin-top:4px}
#mbanner.mine .big{color:var(--ok)}
#mbanner.theirs .big{color:var(--bad)}
@keyframes scorepulse{0%{transform:scale(1)}35%{transform:scale(1.55)}100%{transform:scale(1)}}
#mres.pulse{display:inline-block;animation:scorepulse .45s ease-out 3}
#mlog{flex:1 1 auto;overflow-y:auto;padding:8px 10px;font-size:12px;background:var(--black)}
#mlog p{margin-bottom:5px;color:var(--dim)}
#mlog p b{color:var(--ink)}
#mlog p.gol{color:var(--acc);background:rgba(255,210,63,.10);border-left:3px solid var(--acc);
  padding:4px 7px;font-size:13px;letter-spacing:.5px}
#mlog p.noi{color:var(--ok)}
#mlog p.loro{color:var(--bad);background:rgba(255,93,93,.10);border-left:3px solid var(--bad);
  padding:4px 7px;font-size:13px;letter-spacing:.5px}
#mctrl{flex:0 0 auto;background:var(--panel);border-top:3px solid var(--black);
  padding:8px;display:flex;gap:6px;align-items:center}
#mctrl .btn{flex:1;padding:8px 4px;font-size:11px}
/* pannello tattica in partita */
.overlay{position:absolute;inset:0;background:rgba(5,7,15,.86);z-index:380;
  display:flex;align-items:center;justify-content:center;padding:12px}
.overlay .box{background:var(--panel);border:3px solid var(--black);box-shadow:0 6px 0 rgba(0,0,0,.6);
  max-height:100%;overflow-y:auto;width:100%;max-width:560px;padding:12px}
/* campo tattico */
.tacticfield{position:relative;background:linear-gradient(180deg,var(--grass1),var(--grass2));
  border:3px solid var(--black);height:340px;margin-bottom:10px}
.tacticfield .slot{position:absolute;width:64px;margin-left:-32px;margin-top:-17px;text-align:center;cursor:pointer}
.tacticfield .slot .dot{display:inline-block;width:16px;height:16px;border:2px solid var(--black);background:var(--acc)}
.tacticfield .slot .nm{display:block;font-size:9px;background:rgba(0,0,0,.55);color:#fff;
  padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tacticfield .slot .ov{font-size:9px;color:var(--acc)}
.tacticfield .slot.sel .dot{background:#fff}
/* schede del cambio: chi esce e chi entra, con tutte le statistiche */
.swapbox{background:var(--panel2);border:3px solid var(--black);padding:8px;margin-bottom:10px}
.swapbox .big,.subcard .big{font-size:20px;color:var(--acc);line-height:1.1}
.swapbox .center,.subcard .center{text-align:center;min-width:42px}
.subcard{background:var(--panel);border:2px solid var(--line);border-left:4px solid var(--acc);
  padding:6px 7px;margin-bottom:6px;cursor:pointer}
.subcard:active{background:var(--panel3)}
.subcard .tiny{line-height:1.5}
/* scelte segmentate */
.seg{display:flex;gap:0;border:3px solid var(--black);width:fit-content;max-width:100%}
.seg button{background:var(--panel2);border:none;border-right:2px solid var(--black);
  color:var(--dim);font-family:inherit;font-weight:bold;font-size:11px;padding:6px 10px;cursor:pointer;letter-spacing:.5px}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--acc);color:#221c00}
/* schede lega */
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs .btn{flex:1;min-width:70px;font-size:10px;padding:6px 4px}
.tabs .btn.on{background:var(--acc);color:#221c00}
/* selezione squadra */
.teampick{display:flex;align-items:center;gap:8px;padding:7px 6px;border-bottom:1px solid #232a4d;cursor:pointer}
.teampick:active{background:var(--panel3)}
.teampick .kit{width:22px;height:22px;border:2px solid var(--black);flex:0 0 auto}
.teampick .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.teampick .nm small{display:block;color:var(--faint);font-size:9px;letter-spacing:1px}
/* titolo gioco */
.logo{font-size:44px;letter-spacing:8px;color:var(--acc);text-align:center;
  text-shadow:4px 4px 0 #000, 8px 8px 0 rgba(255,157,46,.35);margin:26px 0 4px}
.logo small{display:block;font-size:11px;letter-spacing:4px;color:var(--dim);text-shadow:none;margin-top:6px}
/* dialoghi modali generici */
#modal{z-index:390}
/* schermo intero contenitore selezione */
.fullpage{position:absolute;inset:0;overflow-y:auto;background:var(--bg);z-index:340;padding:12px 12px 30px}
input[type=range]{width:100%}
input[type=text]{width:100%;background:var(--black);color:var(--ink);border:3px solid var(--line);
  font-family:inherit;font-weight:bold;font-size:14px;padding:7px 9px;outline:none}
input[type=text]:focus{border-color:var(--acc)}
input[type=color]{width:46px;height:34px;border:3px solid var(--black);background:var(--panel3);padding:2px;cursor:pointer}
.hidden{display:none!important}
@media (min-width:640px){
  body{font-size:15px}
  #navbar button{font-size:11px}
  .tacticfield{height:400px}
}
</style>
</head>
<body>
<div id="app">
  <div id="topbar" class="hidden">
    <span class="tname" id="tb_name">MISTER</span>
    <div class="tinfo"><span id="tb_date"></span><br><span class="money" id="tb_money"></span></div>
  </div>
  <div id="screen"></div>
  <div id="navbar" class="hidden"></div>
</div>
<script>
/* =====================================================
   MISTER — Manager di Calcio Retrò
   Gioco originale in un solo file. Codice, nomi e testi
   sono di fantasia. (c) generato per uso personale.
   -----------------------------------------------------
   01_core: utilità, generatori di nomi, giocatori, squadre
   ===================================================== */
"use strict";

/* ---------- RNG con seed (mulberry32) ---------- */
let _seed = (Date.now() ^ (Math.random()*1e9)) >>> 0;
function setSeed(s){ _seed = s >>> 0; }
function rnd(){
  _seed |= 0; _seed = (_seed + 0x6D2B79F5) | 0;
  let t = Math.imul(_seed ^ (_seed >>> 15), 1 | _seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function ri(a,b){ return a + Math.floor(rnd()*(b-a+1)); }
function rf(a,b){ return a + rnd()*(b-a); }
function chance(p){ return rnd() < p; }
function pick(arr){ return arr[Math.floor(rnd()*arr.length)]; }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function gauss(mu,sigma){ let u=0,v=0; while(u===0)u=rnd(); while(v===0)v=rnd();
  return mu + sigma*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function clamp(x,a,b){ return x<a?a:(x>b?b:x); }
function sum(arr,f){ let s=0; for(const x of arr) s += f?f(x):x; return s; }

/* ---------- formattazione ---------- */
function fmtK(k){ // k = migliaia di euro
  const neg = k<0; k=Math.abs(Math.round(k));
  let s;
  if(k>=1000) s = (k/1000).toFixed(k>=10000?0:1).replace('.',',')+' M';
  else s = k+' k';
  return (neg?'-':'')+s;
}
function fmtDate(week){ // stagione: 38 settimane, da fine agosto a maggio
  const MESI=['AGO','SET','OTT','NOV','DIC','GEN','FEB','MAR','APR','MAG','GIU'];
  const m = Math.min(10, Math.floor((week-1)/3.6));
  const g = 1 + ((week*11) % 27);
  return g+' '+MESI[m];
}

/* ---------- giocatori ---------- */
let _pid = 1;
function ovr(p){
  switch(p.role){
    case "POR": return Math.round(p.par*.75 + p.tec*.10 + p.dif*.10 + p.vel*.05);
    case "DIF": return Math.round(p.dif*.55 + p.vel*.15 + p.tec*.15 + p.res*.10 + p.att*.05);
    case "CEN": return Math.round(p.tec*.40 + p.res*.20 + p.dif*.15 + p.att*.15 + p.vel*.10);
    default:    return Math.round(p.att*.55 + p.tec*.20 + p.vel*.20 + p.dif*.05);
  }
}
function playerValue(p){
  const o = ovr(p);
  let v = Math.pow(Math.max(30,o), 3.1) / 2600;      // 60→~230k  75→~700k? tarato sotto
  v = Math.pow(Math.max(30,o),3.35)/9000;
  const ageF = p.age<=21 ? 1.5 : p.age<=25 ? 1.3 : p.age<=29 ? 1.0 : p.age<=32 ? 0.6 : 0.32;
  const potF = 1 + Math.max(0,(p.pot-o))*0.02;
  return Math.max(15, Math.round(v*ageF*potF));
}
function playerWage(p){ // settimanale in k — curva compressa in basso, così le serie minori respirano
  const v = playerValue(p);
  return Math.max(1, Math.round(Math.pow(v,0.78)/14));
}
function genPlayer(role, q, ageRange, est){ // q = qualità media attesa
  const age = ageRange ? ri(ageRange[0],ageRange[1]) : (chance(.22)?ri(17,21):chance(.6)?ri(22,28):ri(29,34));
  const base = clamp(Math.round(gauss(q, 5.5)), 30, 94);
  function attr(mu,sp){ return clamp(Math.round(gauss(mu,sp||7)),20,99); }
  const p = {
    id:_pid++,
    nm: nomeGiocatore(est),
    role, age,
    att:20,dif:20,tec:20,vel:20,res:20,par:20,
    frm: ri(4,7), mor: ri(5,8), cond: 100,
    inj:0, squal:0, yc:0,
    goals:0, apps:0, sGoals:0, sApps:0, sVoti:0, sVotiN:0, assists:0, sAssists:0,
    contract: ri(1,4), youth:false
  };
  const speedAge = age>=30 ? -Math.round((age-29)*2.2) : 0;   // intero: gli attributi non hanno decimali
  if(role==="POR"){
    p.par=attr(base+3); p.dif=attr(base-14); p.tec=attr(base-16); p.vel=clamp(attr(base-20)+speedAge,20,99); p.att=attr(25,6); p.res=attr(base-8);
  }else if(role==="DIF"){
    p.dif=attr(base+3); p.vel=clamp(attr(base-2)+speedAge,20,99); p.tec=attr(base-8); p.att=attr(base-22); p.res=attr(base); p.par=attr(22,4);
  }else if(role==="CEN"){
    p.tec=attr(base+3); p.res=attr(base+1); p.dif=attr(base-8); p.att=attr(base-8); p.vel=clamp(attr(base-4)+speedAge,20,99); p.par=attr(22,4);
  }else{
    p.att=attr(base+4); p.tec=attr(base-2); p.vel=clamp(attr(base)+speedAge,20,99); p.dif=attr(base-24); p.res=attr(base-4); p.par=attr(22,4);
  }
  const o = ovr(p);
  p.pot = age<=23 ? clamp(o + ri(2,16), o, 96) : clamp(o + ri(0,3), o, 96);
  p.val = playerValue(p);
  p.wage = playerWage(p);
  return p;
}
const TIER_Q = {1:76, 2:71, 3:66, 4:61, 5:56, 6:52, 7:48};

  const plan = [["POR",2],["DIF",7],["CEN",7],["ATT",5]];
  for(const [role,n] of plan)
    for(let i=0;i<n;i++) sq.push(genPlayer(role, q + (i<Math.ceil(n/2)?1.5:-3), null, est));
  return sq;
}

function teamOvr(t){
  const xi = bestXI(t);
  return Math.round(sum(xi, p=>ovr(p))/11);
}

/* ---------- selezione automatica migliore XI ---------- */
function bestXI(t, formation){
  const f = FORMATIONS[formation||t.formation];
  const avail = t.players.filter(p=>p.inj<=0 && p.squal<=0);
  const byRole = r => avail.filter(p=>p.role===r).sort((a,b)=> score(b)-score(a));
  // il valore pesa di più, ma condizione e morale contano davvero
  function score(p){ return ovr(p) * (0.65 + 0.35*p.cond/100) * (0.92 + 0.016*p.mor); }
  const xi = [];
  const gk = byRole("POR"); if(gk[0]) xi.push(gk[0]);
  const d = byRole("DIF"), c = byRole("CEN"), a = byRole("ATT");
  for(let i=0;i<f[0];i++){ const p = d[i] || c[f[1]+i] || a[f[2]+i]; if(p && !xi.includes(p)) xi.push(p); }
  for(let i=0;i<f[1];i++){ const p = c[i] || d[f[0]+i] || a[f[2]+i]; if(p && !xi.includes(p)) xi.push(p); }
  for(let i=0;i<f[2];i++){ const p = a[i] || c[f[1]+i] || d[f[0]+i]; if(p && !xi.includes(p)) xi.push(p); }
  // riempi eventuali buchi con chiunque
  for(const p of avail){ if(xi.length>=11) break; if(!xi.includes(p)) xi.push(p); }
  // emergenza totale: se non si arriva a 11, si aggregano anche acciaccati e squalificati
  if(xi.length<11){
    const rest = t.players.filter(p=>!xi.includes(p))
      .sort((a,b)=> (a.inj+a.squal*3) - (b.inj+b.squal*3));
    for(const p of rest){ if(xi.length>=11) break; xi.push(p); }
  }
  return xi.slice(0,11);
}

/* ---------- girone all'italiana (metodo del cerchio) ---------- */
function genFixtures(ids){
  const n = ids.length, rounds = [];
  const arr = shuffle(ids);
  const fixed = arr[0], rest = arr.slice(1);
  for(let r=0; r<n-1; r++){
    const round = [];
    const line = [fixed].concat(rest);
    for(let i=0;i<n/2;i++){
      let h = line[i], a = line[n-1-i];
      if(r%2===1) [h,a]=[a,h];
      round.push({h,a,gh:0,ga:0,p:0});
    }
    rounds.push(round);
    rest.unshift(rest.pop());
  }
  const ritorno = rounds.map(rd => rd.map(m=>({h:m.a,a:m.h,gh:0,ga:0,p:0})));
  return rounds.concat(ritorno); // 30 giornate
}

/* ---------- calendario stagionale ---------- */
function buildCalendar(hasEuro, cupRounds){
  const C=[];
  const cupAfter = (cupRounds===5)
    ? {4:1, 9:2, 15:3, 21:4, 26:5}
    : {2:1, 5:2, 9:3, 15:4, 21:5, 26:6};           // coppa a 64: sei turni
  const euroAfter = {7:1, 13:2, 19:3, 24:4};
  for(let g=1; g<=30; g++){
    C.push({t:'L', r:g});
    if(cupAfter[g]) C.push({t:'C', r:cupAfter[g]});
    if(hasEuro && euroAfter[g]) C.push({t:'E', r:euroAfter[g]});
  }
  return C;
}

/* ---------- coppa nazionale (tutte le 64 squadre) ---------- */
function initCup(){
  const ids = shuffle(G.teams.map(t=>t.id));
  const ties = [];
  for(let i=0;i<ids.length/2;i++) ties.push({h:ids[i*2], a:ids[i*2+1], gh:0, ga:0, p:0, pen:null});
  return { round:1, rounds:[ties], winner:null, size:ids.length };
}
const CUP_NAMES_ALL = ['trentaduesimi','sedicesimi','ottavi','quarti','semifinale','finale'];
function cupRoundNames(cup){
  const tot = Math.round(Math.log2(cup.size||32));
  return CUP_NAMES_ALL.slice(CUP_NAMES_ALL.length - tot);
}
function cupNextRound(cup){
  const last = cup.rounds[cup.rounds.length-1];
  const winners = last.map(m => m.win);
  if(winners.length===1){ cup.winner = winners[0]; return; }
  const sh = shuffle(winners);
  const ties=[];
  for(let i=0;i<sh.length/2;i++) ties.push({h:sh[i*2], a:sh[i*2+1], gh:0, ga:0, p:0, pen:null});
  cup.rounds.push(ties); cup.round++;
}

function initEuro(qualifiedIds){
  // 2 italiane + 14 straniere
  const pool = [];
  for(const gr of Object.keys(EST_SQUADRE))
    for(const nm of EST_SQUADRE[gr]) pool.push({nm, gr});
  const sel = shuffle(pool).slice(0,14);
  G.euroTeams = sel.map((s,i)=> genEuroTeam(s.nm, 100+i, ri(70,83), s.gr));
  const ids = shuffle(qualifiedIds.concat(G.euroTeams.map(t=>t.id)));
  const ties=[];
  for(let i=0;i<8;i++) ties.push({h:ids[i*2], a:ids[i*2+1], gh:0, ga:0, p:0, pen:null});
  return { round:1, rounds:[ties], winner:null };
}

/* ---------- classifica ---------- */
function standings(div){
  const fx = fxOf(div);
  const st = {};
  const ids = idsOf(div);
  for(const id of ids) st[id] = {id, pt:0, g:0, v:0, n:0, s:0, gf:0, gs:0};
  for(const round of fx) for(const m of round){
    if(!m.p) continue;
    const H=st[m.h], A=st[m.a];
    if(!H||!A) continue;
    H.g++; A.g++; H.gf+=m.gh; H.gs+=m.ga; A.gf+=m.ga; A.gs+=m.gh;
    if(m.gh>m.ga){ H.v++; A.s++; H.pt+=3; }
    else if(m.gh<m.ga){ A.v++; H.s++; A.pt+=3; }
    else { H.n++; A.n++; H.pt++; A.pt++; }
  }
  return Object.values(st).sort((a,b)=> b.pt-a.pt || (b.gf-b.gs)-(a.gf-a.gs) || b.gf-a.gf || a.id-b.id);
}
function leaguePos(teamId){
  const div = T(teamId).div;
  if(div==='E') return 0;
  const st = standings(div);
  return st.findIndex(r=>r.id===teamId)+1;
}

/* ---------- aspettative società ---------- */
function computeExpectations(){
  for(const div of DIVS){
    const ids = idsOf(div).slice();
    ids.sort((a,b)=> teamOvr(T(b)) - teamOvr(T(a)));
    ids.forEach((id,i)=>{
      let target = i+1;
      const t = T(id);
      t.expectRaw = target; // dove ti colloca la forza reale della rosa
      if(t.legend && t.div!=='A') target = Math.min(target, 3); // le grandi decadute vogliono salire
      t.expect = target;
    });
  }
}

    const sortable = t.players.slice().sort((a,b)=>ovr(a)-ovr(b));

function cron(key, p, p2){

/* ---------- lato squadra in partita ---------- */
function makeSide(team, xiOverride, formOverride){
  const formation = formOverride || team.formation;
  const xi = (xiOverride && xiOverride.length===11) ? xiOverride.slice() : bestXI(team, formation);
  const bench = team.players.filter(p=> p.inj<=0 && p.squal<=0 && !xi.includes(p)).slice(0,9);
  const side = {
    team, formation, mentality:team.mentality, pressing:team.pressing,
    xi, bench, subsLeft:3, out:[],
    mc:{}, // condizione live per pid
    yc:new Set(), rc:new Set(), injOut:[],
    shots:0, sot:0, goals:[], votes:{},
    lineOf:{}
  };
  side.stats = {};
  for(const p of xi){ side.mc[p.id] = p.cond; side.votes[p.id]=6; side.stats[p.id]=newStat(); }
  assignLines(side);
  return side;
}
/* statistiche individuali di partita: sono la base del voto */
function newStat(){
  return {sh:0, sot:0, wide:0, gl:0, as:0, sv:0, def:0, key:0, fl:0, yc:0, rc:0, penMiss:0, mins:0};
}
function ST(side, p){
  const id = p && p.id!==undefined ? p.id : p;
  if(!side.stats[id]) side.stats[id] = newStat();
  return side.stats[id];
}
function assignLines(side){
  // assegna ogni titolare a una linea del modulo (fuori ruolo = malus)
  const f = FORMATIONS[side.formation];
  const need = {POR:1, DIF:f[0], CEN:f[1], ATT:f[2]};
  side.lineOf = {};
  const pool = side.xi.slice();
  for(const role of ["POR","DIF","CEN","ATT"]){
    for(let i=0;i<need[role];i++){
      let idx = pool.findIndex(p=>p.role===role);
      if(idx<0) idx = pool.findIndex(p=> (role==="DIF"&&p.role==="CEN")||(role==="CEN"&&(p.role==="DIF"||p.role==="ATT"))||(role==="ATT"&&p.role==="CEN") );
      if(idx<0) idx = 0;
      if(pool.length===0) break;
      const p = pool.splice(Math.max(0,idx),1)[0];
      side.lineOf[p.id] = role;
    }
  }
  for(const p of pool) side.lineOf[p.id] = p.role; // avanzi
}
function effP(side, p){
  const cond = side.mc[p.id]!==undefined ? side.mc[p.id] : p.cond;
  let e = ovr(p) * (0.68 + 0.32*cond/100) * (0.88 + 0.024*p.frm) * (0.94 + 0.012*p.mor);
  if(side.lineOf[p.id] && side.lineOf[p.id]!==p.role) e *= 0.82;
  return e;
}
function sideRatings(side, home, neutral){
  const on = side.xi.filter(p=>!side.rc.has(p.id));
  const line = r => on.filter(p=> side.lineOf[p.id]===r);
  const avg = arr => arr.length ? sum(arr,p=>effP(side,p))/arr.length : 25;
  const gkArr = line("POR");
  const gk = gkArr.length ? effP(side, gkArr[0]) : 22;
  let mid = avg(line("CEN"));
  let att = avg(line("ATT"))*0.72 + mid*0.28;
  let def = avg(line("DIF"))*0.78 + mid*0.22;
  const m = side.mentality;
  att *= 1 + 0.10*m; def *= 1 - 0.065*m;
  mid *= 0.96 + 0.045*side.pressing;
  if(home && !neutral){ att*=1.05; mid*=1.05; def*=1.05; }
  const short = 11 - side.rc.size - side.out.filter(o=>o.noSub).length;
  if(short<11){ const f = 0.55 + 0.45*short/11; att*=f; mid*=f; def*=Math.sqrt(f); }
  return {att, mid, def, gk};
}

/* ---------- simulatore ---------- */
class MatchSim {
  constructor(home, away, opts){
    this.opts = opts||{};
    this.H = makeSide(home, this.opts.xiH, this.opts.formH);
    this.A = makeSide(away, this.opts.xiA, this.opts.formA);
    this.min = 0; this.gh=0; this.ga=0;
    this.phase = 'pre'; // pre, 1T, int, 2T, ets, pens, ft
    this.possMin = {H:0, A:0};
    this.events = [];
    this.finished = false;
    this.extraAllowed = !!this.opts.extra;
    this.pens = null;
    this.duration = 90;
  }
  side(k){ return k==='H' ? this.H : this.A; }
  other(k){ return k==='H' ? 'A' : 'H'; }
  log(min, key, side, p, p2, cls){
    const e = { min, type:key, side, pid:p?p.id:null,
                txt: cron(key, p, p2), cls: cls||null };
    this.events.push(e); return e;
  }
  /* un minuto di gioco: ritorna la scena per il renderer */
  step(){
    if(this.finished) return null;
    if(this.phase==='pre'){ this.phase='1T'; this.log(0,'kickoff'); }
    this.min++;
    const m = this.min;
    const rH = sideRatings(this.H, true, this.opts.neutral);
    const rA = sideRatings(this.A, false, false);
    // possesso conteso dal centrocampo
    let pH = Math.pow(rH.mid,1.35) / (Math.pow(rH.mid,1.35)+Math.pow(rA.mid,1.35));
    pH += 0.02*(this.H.mentality - this.A.mentality);
    pH = clamp(pH, 0.22, 0.78);
    const possK = chance(pH) ? 'H' : 'A';
    this.possMin[possK]++;
    const atkS = this.side(possK), defS = this.side(this.other(possK));
    const rAtk = possK==='H'?rH:rA, rDef = possK==='H'?rA:rH;
    const scene = { min:m, poss:possK, zone:1, ev:null };
    // ---- tentativo d'attacco ----
    const tempo = 1 + 0.10*(atkS.mentality) + 0.05*(this.H.pressing + this.A.pressing - 2);
    if(chance(0.215 * tempo) && atkS.xi.some(p=>!atkS.rc.has(p.id))){
      scene.zone = 2;
      atkS.shots++;
      const ratio = rAtk.att / Math.max(30, rDef.def);
      const gkF = clamp(1 - (rDef.gk - 66)*0.0062, 0.55, 1.30);
      // rigore?
      if(chance(0.035)){
        const taker = this.pickScorer(atkS);
        this.log(m,'pen',possK);
        ST(atkS,taker).sh++;
        if(chance(clamp(0.76 + (taker.att-70)*0.0015 - (rDef.gk-70)*0.002, 0.5, 0.92))){
          ST(atkS,taker).sot++;
          this.score(possK, taker, m, 'pengoal', true);
          scene.ev = {t:'goal', side:possK};
        } else {
          const sv = chance(0.7);
          this.log(m, sv?'pensave':'penout', possK, taker, null, 'occ');
          atkS.sot += sv?1:0;
          ST(atkS,taker).penMiss++;
          if(sv){ ST(atkS,taker).sot++; const g=this.gkOf(defS); if(g) ST(defS,g).sv++; }
          scene.ev = {t:'save', side:possK};
        }
      } else {
        const pGoal = clamp(0.094 * Math.pow(ratio,1.65) * gkF, 0.013, 0.38);
        const roll = rnd();
        const shooter = this.pickScorer(atkS);
        ST(atkS,shooter).sh++;
        if(roll < pGoal){
          atkS.sot++; ST(atkS,shooter).sot++;
          this.score(possK, shooter, m, 'goal');
          scene.ev = {t:'goal', side:possK};
        } else if(roll < pGoal + 0.30*gkF){
          atkS.sot++; ST(atkS,shooter).sot++;
          this.log(m,'save',possK,shooter);
          const gkP = this.gkOf(defS);
          if(gkP) ST(defS,gkP).sv++;
          scene.ev = {t:'save', side:possK};
        } else if(roll < pGoal + 0.30*gkF + 0.045){
          ST(atkS,shooter).sot++; ST(atkS,shooter).key++;
          this.log(m,'post',possK,shooter,null,'occ');
          scene.ev = {t:'post', side:possK};
        } else if(roll < pGoal + 0.30*gkF + 0.045 + 0.30){
          ST(atkS,shooter).wide++;
          this.log(m,'wide',possK,shooter);
          scene.ev = {t:'wide', side:possK};
        } else if(roll < pGoal + 0.30*gkF + 0.045 + 0.30 + 0.16){
          const dif = this.pickDefender(defS);
          if(dif) ST(defS,dif).def++;
          this.log(m,'blocked',possK,shooter);
          scene.ev = {t:'blocked', side:possK};
        } else {
          const dif = this.pickDefender(defS);
          if(dif) ST(defS,dif).def++;
          this.log(m,'corner',possK);
          scene.ev = {t:'corner', side:possK};
        }
      }
    }
    // ---- falli e cartellini (della squadra in non possesso) ----
    else if(chance(0.16 + 0.03*defS.pressing)){
      const fouler = this.pickFouler(defS);
      if(fouler){
        const fk = this.other(possK);
        const r = rnd();
        ST(defS,fouler).fl++;
        if(r < 0.004 && m>8){
          defS.rc.add(fouler.id);
          ST(defS,fouler).rc++;
          this.log(m,'red',fk,fouler,null,'card');
          scene.ev = {t:'red', side:fk, pid:fouler.id};
        } else if(r < 0.13){
          if(defS.yc.has(fouler.id)){
            defS.rc.add(fouler.id);
            ST(defS,fouler).rc++;
            this.log(m,'red2',fk,fouler,null,'card');
            scene.ev = {t:'red', side:fk, pid:fouler.id};
          } else {
            defS.yc.add(fouler.id);
            ST(defS,fouler).yc++;
            this.log(m,'yellow',fk,fouler,null,'card');
            scene.ev = {t:'yellow', side:fk, pid:fouler.id};
          }
        } else {
          this.log(m,'foul',fk,fouler);
          scene.ev = {t:'foul', side:fk};
        }
        scene.zone = 1;
      }
    }
    // minuto senza sussulti: qualcuno dietro ha comunque fatto il suo lavoro
    else if(chance(0.30)){
      const dif = this.pickDefender(defS);
      if(dif) ST(defS,dif).def++;
      if(chance(0.35)){
        const reg = this.pickPlaymaker(atkS);
        if(reg) ST(atkS,reg).key++;
      }
    }
    // ---- infortuni ----
    for(const k of ['H','A']){
      const s = this.side(k);
      if(chance(0.0021)){
        const cand = s.xi.filter(p=>!s.rc.has(p.id) && !s.out.find(o=>o.pid===p.id));
        const p = pick(cand);
        if(p){
          const weeks = chance(.5)?ri(1,2):ri(3,8);
          s.injOut.push({pid:p.id, weeks});
          this.log(m,'inj',k,p,null,'inj');
          this.forcedSub(k, p);
          if(!scene.ev) scene.ev = {t:'inj', side:k, pid:p.id};
        }
      }
    }
    // ---- flavor ----
    if(!scene.ev && m%9===4) this.events.push({min:m, type:'flavor', side:null, pid:null, txt:pick(CRON.flavor)});
    // ---- stanchezza e minuti giocati ----
    for(const k of ['H','A']){
      const s = this.side(k);
      for(const p of s.xi){
        if(s.rc.has(p.id)) continue;
        ST(s,p).mins++;
        const drain = 0.42 * (1.55 - p.res/99) * (1 + 0.15*s.pressing) * (1 + 0.04*s.mentality);
        s.mc[p.id] = Math.max(4, (s.mc[p.id]||p.cond) - drain);
      }
    }
    // ---- IA avversaria (o entrambe se simulata) ----
    this.aiThink('A');
    if(this.opts.aiHome) this.aiThink('H');
    // ---- fine tempi ----
    // questi stati viaggiano su campi propri: un evento al 45' non deve
    // "coprire" l'intervallo (e nemmeno supplementari o rigori)
    if(m===45){ this.phase='int'; this.log(45,'half'); scene.half = true; this.updateVotes(); }
    if(m===46 && this.phase==='int') this.phase='2T';
    if(m===this.duration){
      if(this.gh===this.ga && this.extraAllowed && this.duration===90){
        this.duration=120; this.phase='ets';
        this.log(90,'extra',null,null,null,'sys');
        scene.extra = true;
      } else if(this.gh===this.ga && this.extraAllowed && this.duration===120){
        this.shootout(); scene.pens = true;
        this.finish();
      } else this.finish();
    }
    return scene;
  }
  pickScorer(s){
    const cand = s.xi.filter(p=>!s.rc.has(p.id) && s.lineOf[p.id]!=='POR');
    const w = cand.map(p=>{
      const line = s.lineOf[p.id];
      return Math.pow(p.att,1.5) * (line==='ATT'?3.2: line==='CEN'?1.1:0.28);
    });
    const tot = sum(w); let r = rnd()*tot;
    for(let i=0;i<cand.length;i++){ r-=w[i]; if(r<=0) return cand[i]; }
    return cand[cand.length-1] || s.xi.find(p=>!s.rc.has(p.id)) || s.xi[0] ||
           {id:-1, nm:'—', att:30, tec:30};
  }
  gkOf(s){ return s.xi.find(p=>s.lineOf[p.id]==='POR' && !s.rc.has(p.id)) || null; }
  pickDefender(s){
    const cand = s.xi.filter(p=>!s.rc.has(p.id) && s.lineOf[p.id]!=='POR');
    if(!cand.length) return null;
    const w = cand.map(p=>{
      const line = s.lineOf[p.id];
      return Math.pow(p.dif,1.3) * (line==='DIF'?3 : line==='CEN'?1.6 : 0.3);
    });
    const tot = sum(w); let r = rnd()*tot;
    for(let i=0;i<cand.length;i++){ r-=w[i]; if(r<=0) return cand[i]; }
    return cand[0];
  }
  pickPlaymaker(s){
    const cand = s.xi.filter(p=>!s.rc.has(p.id) && s.lineOf[p.id]!=='POR');
    if(!cand.length) return null;
    const w = cand.map(p=>{
      const line = s.lineOf[p.id];
      return Math.pow(p.tec,1.5) * (line==='CEN'?3 : line==='ATT'?1.5 : 0.5);
    });
    const tot = sum(w); let r = rnd()*tot;
    for(let i=0;i<cand.length;i++){ r-=w[i]; if(r<=0) return cand[i]; }
    return cand[0];
  }
  pickAssist(s, scorer){
    const cand = s.xi.filter(p=>p.id!==scorer.id && !s.rc.has(p.id) && s.lineOf[p.id]!=='POR');
    if(!cand.length) return null;
    const w = cand.map(p=>{
      const line = s.lineOf[p.id];
      return Math.pow(p.tec,1.4) * (line==='CEN'?2.6 : line==='ATT'?1.9 : 0.55);
    });
    const tot = sum(w); let r = rnd()*tot;
    for(let i=0;i<cand.length;i++){ r-=w[i]; if(r<=0) return cand[i]; }
    return cand[0];
  }
  pickFouler(s){
    const cand = s.xi.filter(p=>!s.rc.has(p.id) && s.lineOf[p.id]!=='POR');
    if(!cand.length) return null;
    const w = cand.map(p=> s.lineOf[p.id]==='DIF'?2.4 : s.lineOf[p.id]==='CEN'?1.7 : 0.8);
    const tot = sum(w); let r = rnd()*tot;
    for(let i=0;i<cand.length;i++){ r-=w[i]; if(r<=0) return cand[i]; }
    return cand[0];
  }
  score(k, p, m, key, rigore){
    const s = this.side(k);
    if(k==='H') this.gh++; else this.ga++;
    ST(s,p).gl++;
    let assist = null;
    if(!rigore && chance(0.66)){
      assist = this.pickAssist(s, p);
      if(assist) ST(s,assist).as++;
    }
    s.goals.push({pid:p.id, min:m, assist: assist?assist.id:null});
    const e = this.log(m, key, k, p, null, 'gol');
    if(assist) e.txt += ` Assist di ${assist.nm}.`;
  }
  forcedSub(k, outP){
    const s = this.side(k);
    s.xi = s.xi.filter(p=>p.id!==outP.id);
    s.out.push({pid:outP.id, noSub:true});
    if(s.subsLeft>0 && s.bench.length){
      const line = s.lineOf[outP.id];
      let inn = s.bench.find(p=>p.role===line) || s.bench[0];
      s.bench = s.bench.filter(p=>p!==inn);
      s.xi.push(inn); s.mc[inn.id]=inn.cond; s.votes[inn.id]=6; ST(s,inn);
      s.subsLeft--; s.out[s.out.length-1].noSub=false;
      s.lineOf[inn.id] = line;
      this.log(this.min,'sub',k,outP,inn);
    }
    assignLines(s);
  }
  makeSub(k, outPid, inPid){
    const s = this.side(k);
    if(s.subsLeft<=0) return false;
    const outP = s.xi.find(p=>p.id===outPid);
    const inP = s.bench.find(p=>p.id===inPid);
    if(!outP || !inP) return false;
    const line = s.lineOf[outP.id];
    s.xi = s.xi.filter(p=>p!==outP);
    s.bench = s.bench.filter(p=>p!==inP);
    s.bench.push(outP);
    s.xi.push(inP); s.mc[inP.id]=inP.cond; s.votes[inP.id]=6; ST(s,inP);
    s.lineOf[inP.id]=line;
    s.subsLeft--;
    this.log(this.min||1,'sub',k,outP,inP);
    assignLines(s);
    return true;
  }
  aiThink(k){
    if(this.opts.userSide===k) return;
    const s = this.side(k), m=this.min;
    const diff = k==='H' ? this.gh-this.ga : this.ga-this.gh;
    if((m===58||m===72) && s.subsLeft>0){
      const tired = s.xi.filter(p=> s.mc[p.id]<42 && s.lineOf[p.id]!=='POR')
                        .sort((a,b)=>s.mc[a.id]-s.mc[b.id]);
      if(tired[0]){
        const line = s.lineOf[tired[0].id];
        const inn = s.bench.filter(p=>p.role===line).sort((a,b)=>ovr(b)-ovr(a))[0];
        if(inn) this.makeSub(k, tired[0].id, inn.id);
      }
    }
    if(m===68 && diff<0) s.mentality = Math.min(1, s.mentality+1);
    if(m===80 && diff>0) s.mentality = Math.max(-1, s.mentality-1);
  }
  shootout(){
    const takers = s => s.xi.filter(p=>!s.rc.has(p.id)).sort((a,b)=>(b.att+b.tec)-(a.att+a.tec)).slice(0,5);
    const gk = s => { const g=s.xi.find(p=>s.lineOf[p.id]==='POR'&&!s.rc.has(p.id)); return g?g.par:30; };
    let ph=0, pa=0;
    const tH = takers(this.H), tA = takers(this.A);
    this.log(this.min,'pens',null,null,null,'sys');
    for(let i=0;i<5;i++){
      if(chance(clamp(0.75+(tH[i%tH.length].tec-70)*0.002-(gk(this.A)-70)*0.003,.5,.92))) ph++;
      if(chance(clamp(0.75+(tA[i%tA.length].tec-70)*0.002-(gk(this.H)-70)*0.003,.5,.92))) pa++;
    }
    while(ph===pa){ if(chance(.76)) ph++; if(chance(.76)) pa++; }
    this.pens = {h:ph, a:pa};
    this.events.push({min:this.min,type:'sys',side:null,pid:null,
      txt:`Rigori: ${ph}-${pa}. La spunta ${ph>pa?this.H.team.name:this.A.team.name}!`, cls:'gol'});
  }
  /* voto costruito su quello che il giocatore ha realmente fatto in campo */
  updateVotes(){
    for(const k of ['H','A']){
      const s = this.side(k);
      const subiti = k==='H' ? this.ga : this.gh;
      const fatti  = k==='H' ? this.gh : this.ga;
      const diff = fatti - subiti;
      const finita = this.finished;
      for(const pid in s.stats){
        const st = s.stats[pid];
        if(!st.mins){ delete s.votes[pid]; continue; }
        const line = s.lineOf[pid] || 'CEN';
        const quota = Math.min(1, st.mins/85);          // chi entra tardi oscilla meno
        let v = 6.0;
        // gol: i primi due pesano tanto, poi rendimenti decrescenti (niente 10 a raffica)
        v += 1.20*Math.min(st.gl,2) + 0.70*Math.max(0,st.gl-2);
        v += st.as * 0.85;                              // assist
        v += st.sot * 0.17;                             // conclusioni nello specchio
        v += st.sh  * 0.03;                             // iniziativa
        v -= st.wide * 0.10;                            // tiri sballati
        v += st.sv  * 0.32;                             // parate
        v += st.def * 0.19;                             // interventi difensivi
        v += st.key * 0.12;                             // giocate chiave
        v -= st.fl  * 0.08;                             // falli
        v -= st.yc  * 0.45;
        v -= st.rc  * 1.70;
        v -= st.penMiss * 1.10;
        if(line==='POR'){
          v -= subiti * 0.38;
          if(subiti===0 && st.mins>=60) v += 0.60;
        } else if(line==='DIF'){
          v -= subiti * 0.21;
          if(subiti===0 && st.mins>=60) v += 0.50;
        } else if(line==='CEN'){
          v -= subiti * 0.10; v += fatti * 0.08;
          if(finita && st.mins>=70 && st.key===0 && st.as===0 && st.def<=1) v -= 0.35;
        } else {
          v += fatti * 0.07;
          if(finita && st.mins>=65 && st.sh===0) v -= 0.55;   // punta mai pericolosa
        }
        v += diff>0 ? 0.28 : diff<0 ? -0.28 : 0;
        v = 6 + (v-6) * (0.45 + 0.55*quota);
        if(st.seed===undefined) st.seed = rf(-0.2,0.2);        // stabile durante la partita
        v += st.seed;
        s.votes[pid] = clamp(Math.round(v*10)/10, 3, 10);
      }
    }
  }
  finish(){
    this.phase='ft'; this.finished=true;
    this.log(this.min,'end',null,null,null,'sys');
    this.updateVotes();
  }
  winnerId(){
    if(this.gh>this.ga) return this.H.team.id;
    if(this.ga>this.gh) return this.A.team.id;
    if(this.pens) return this.pens.h>this.pens.a ? this.H.team.id : this.A.team.id;
    return null;
  }
  result(){
    return {
      gh:this.gh, ga:this.ga, pens:this.pens,
      events:this.events,
      stats:{
        possH: Math.round(100*this.possMin.H/Math.max(1,this.possMin.H+this.possMin.A)),
        shH:this.H.shots, shA:this.A.shots, sotH:this.H.sot, sotA:this.A.sot
      },
      H:this.sideOut(this.H), A:this.sideOut(this.A)
    };
  }
  sideOut(s){
    return {
      tid: s.team.id,
      goals: s.goals,
      yc: [...s.yc], rc: [...s.rc],
      inj: s.injOut,
      votes: s.votes, stats: s.stats,
      played: s.xi.concat(s.out.map(o=>({id:o.pid}))).map(p=>p.id),
      mc: s.mc
    };
  }
}

/* simulazione istantanea (partite IA-IA) */
function quickSim(home, away, opts){
  const sim = new MatchSim(home, away, Object.assign({aiHome:true}, opts||{}));
  while(!sim.finished) sim.step();
  return sim;
}

   04_season: avanzamento settimanale, risultati, mercato,
   finanze, società, fine stagione e carriera
   ===================================================== */

const PREMI_A = [2500,1800,1400,1100,900,800,700,650,600,550,500,460,430,400,380,360];
const PREMI_B = PREMI_A.map(x=>Math.round(x*0.42));
const PREMI_C = PREMI_A.map(x=>Math.round(x*0.16));
const PREMI_D = PREMI_A.map(x=>Math.round(x*0.07));
const PREMI_DIV = {A:PREMI_A, B:PREMI_B, C:PREMI_C, D:PREMI_D};
const TV_DIV = {A:i=>1600-i*50, B:i=>550-i*15, C:i=>230-i*5, D:i=>110-i*2};
const CONTRIB_LEGA = {A:0, B:0, C:9, D:11};            // mutualità settimanale per le serie minori
const PREMI_CUP_WIN = 800;                              // alla vincitrice
const PREMI_CUP_ROUND = [15,35,80,180,380,520];         // alla eliminata al turno i (0-based, coppa a 64)
const PREMI_EURO = {win:3000, 4:1600, 3:900, 2:500, 1:300};

function isMarketOpen(){ return G.week<=6 || (G.week>=19 && G.week<=23); }

function initSeasonEconomy(){
  const base = {A:900, B:450, C:260, D:160};
  const perFan = {A:8, B:7, C:6, D:5};
  for(const t of G.teams){
    const d = t.div==='E'?'A':t.div;
    t.sponsor = Math.round(base[d] + t.fans*perFan[d]);
    t.wageBill = Math.round(sum(t.players, p=>p.wage));
  }
  G.club.sponsor = playerTeam().sponsor;
}
function gateIncome(t, comp){
  return Math.round(t.fans * (comp==='L'?7.5 : comp==='C'?5.5 : 11) * rf(0.85,1.12));
}

/* ---------- applica il risultato di una partita ---------- */
function applySimToPlayers(sim, comp){
  for(const k of ['H','A']){
    const out = sim.side(k), team = out.team;
    const res = k==='H' ? Math.sign(sim.gh-sim.ga) : Math.sign(sim.ga-sim.gh);
    for(const p of team.players){
      const played = out.votes[p.id]!==undefined;
      if(played){
        p.apps++; p.sApps++;
        const v = out.votes[p.id];
        p.sVoti += v; p.sVotiN++;
        p.frm = clamp(p.frm + (v-6)*0.55, 1, 10);
        if(out.mc[p.id]!==undefined) p.cond = Math.round(out.mc[p.id]);
        p.mor = clamp(p.mor + res, 1, 10);
      } else {
        p.frm = p.frm + (6-p.frm)*0.12;
        p.mor = clamp(p.mor + res*0.5 - 0.1, 1, 10);
      }
    }
    for(const g of out.goals){
      const p = team.players.find(x=>x.id===g.pid);
      if(p){ p.goals++; p.sGoals++; }
      if(g.assist){
        const a = team.players.find(x=>x.id===g.assist);
        if(a){ a.assists = (a.assists||0)+1; a.sAssists = (a.sAssists||0)+1; }
      }
    }
    if(comp==='L') for(const pid of out.yc){
      const p = team.players.find(x=>x.id===pid);
      if(p){ p.yc++; if(p.yc>0 && p.yc%4===0){ p.squal=Math.max(p.squal,1);
        if(team.id===G.teamId) addNews(`${p.nm} è squalificato per un turno (4 ammonizioni).`,'squadra'); } }
    }
    for(const pid of out.rc){
      const p = team.players.find(x=>x.id===pid);
      if(p){ p.squal = Math.max(p.squal, ri(1,2));
        if(team.id===G.teamId) addNews(`${p.nm} espulso: salterà ${p.squal} partita/e.`,'squadra'); }
    }
    for(const i of out.injOut){
      const p = team.players.find(x=>x.id===i.pid);
      if(p){ p.inj = Math.max(1, i.weeks - G.club.staff.med*(team.id===G.teamId?1:0)*0.5|0);
        if(team.id===G.teamId) addNews(`Infortunio per ${p.nm}: fuori circa ${p.inj} settimana/e.`,'squadra'); }
    }
  }
}

/* ---------- simula i turni della settimana ---------- */
function simLeagueRound(div, round, skipTid){
  const fx = fxOf(div)[round-1];
  for(const m of fx){
    if(m.p) continue;
    if(skipTid!==undefined && (m.h===skipTid || m.a===skipTid)) continue;
    const sim = quickSim(T(m.h), T(m.a), {});
    m.gh=sim.gh; m.ga=sim.ga; m.p=1;
    applySimToPlayers(sim,'L');
  }
}
function simCupTies(cup, comp, skipTid){
  const ties = cup.rounds[cup.rounds.length-1];
  for(const m of ties){
    if(m.p) continue;
    if(skipTid!==undefined && (m.h===skipTid || m.a===skipTid)) continue;
    const sim = quickSim(T(m.h), T(m.a), {extra:true});
    m.gh=sim.gh; m.ga=sim.ga; m.p=1; m.pen=sim.pens;
    m.win = sim.winnerId();
    applySimToPlayers(sim, comp);
  }
  if(ties.every(m=>m.p)){
    for(const m of ties) if(!m.win) m.win = m.gh>m.ga?m.h:m.a;
    cupNextRound(cup);
    if(cup.winner!==null && cup.winner!==undefined){
      const w = T(cup.winner);
      if(comp==='C'){
        w.trophies.push({s:G.season, type:'Coppa Nazionale'});
        addNews(`<b>${w.name}</b> vince la Coppa Nazionale!`, 'coppa');
        w.budget += PREMI_CUP_WIN;
      } else {
        w.trophies.push({s:G.season, type:'Coppa dei Campioni'});
        addNews(`<b>${w.name}</b> alza la Coppa dei Campioni!`, 'coppa');
        w.budget += PREMI_EURO.win;
      }
    }
  }
}

/* ---------- la partita del giocatore questa settimana ---------- */
function weekMatch(){
  if(G.week > G.calendar.length) return null;
  const wk = G.calendar[G.week-1];
  const me = G.teamId;
  if(wk.t==='L'){
    const div = playerTeam().div;
    const fx = fxOf(div)[wk.r-1];
    const m = fx.find(x=>x.h===me||x.a===me);
    return m && !m.p ? {comp:'L', m, wk} : null;
  }
  if(wk.t==='C' && G.cup && !G.cup.winner){
    const ties = G.cup.rounds[G.cup.rounds.length-1];
    if(G.cup.round!==wk.r) return null;
    const m = ties.find(x=>(x.h===me||x.a===me) && !x.p);
    return m ? {comp:'C', m, wk} : null;
  }
  if(wk.t==='E' && G.ecup && !G.ecup.winner){
    const ties = G.ecup.rounds[G.ecup.rounds.length-1];
    if(G.ecup.round!==wk.r) return null;
    const m = ties.find(x=>(x.h===me||x.a===me) && !x.p);
    return m ? {comp:'E', m, wk} : null;
  }
  return null;
}

/* ---------- fiducia della società ---------- */
function updateConfidence(sim, comp){
  const me = G.teamId;
  const isHome = sim.H.team.id===me;
  const my = isHome?sim.gh:sim.ga, their = isHome?sim.ga:sim.gh;
  const opp = isHome?sim.A.team:sim.H.team;
  const myOvr = teamOvr(playerTeam()), oppOvr = teamOvr(opp);
  const expected = 1/(1+Math.pow(10,(oppOvr-myOvr)/16)); // 0..1
  const got = my>their?1: my===their?0.45:0;
  let delta = (got - expected)*9 + 0.25; // un filo di pazienza della società
  if(comp!=='L') delta *= 0.6;
  if(comp==='C'&&got===0) delta -= 2;
  G.club.confidence = clamp(G.club.confidence + delta, 0, 100);
}
function weeklyBoardCheck(){
  const t = playerTeam();
  if(t.div!=='E'){
    const pos = leaguePos(t.id);
    if(pos>0){
      // il metro settimanale media il sogno della società con la forza reale della rosa
      const target = Math.ceil((t.expect + (t.expectRaw||t.expect))/2);
      const drift = clamp((target - pos)*0.18, -1.0, 0.8);
      G.club.confidence = clamp(G.club.confidence + drift, 0, 100);
    }
  }
  if(G.club.confidence<=20 && !G.club.warned){
    G.club.warned = true;
    addNews(`<b>La società è furiosa:</b> i risultati non sono all'altezza. Rischi l'esonero.`,'club');
  }
  if(G.club.confidence>35) G.club.warned = false;
  if(G.club.confidence<=8){
    G.gameOver = {type:'esonero', s:G.season, w:G.week};
  }
  if(playerTeam().budget < -2500){
    G.gameOver = {type:'bancarotta', s:G.season, w:G.week};
  }
}

/* ---------- mercato IA ---------- */
function aiMarket(){
  if(!isMarketOpen()) return;
  // scambi tra squadre IA
  const nDeals = ri(0,2);
  for(let i=0;i<nDeals;i++){
    const l = pick(G.listed.filter(x=>x.tid!==G.teamId));
    if(!l) break;
    const fp = findPlayer(l.pid); if(!fp||!fp.t) continue;
    const buyers = G.teams.filter(t=> t.id!==l.tid && t.id!==G.teamId && t.budget > l.ask*1.4 && t.players.length<24);
    if(!buyers.length) continue;
    const b = pick(buyers);
    transferPlayer(fp.p, fp.t, b, l.ask);
    G.listed = G.listed.filter(x=>x.pid!==l.pid);
    addNews(`Mercato: ${fp.p.nm} passa da ${fp.t.name} a ${b.name} per ${fmtK(l.ask)}.`,'mercato');
  }
  // offerte per i tuoi giocatori in lista
  const myListed = G.listed.filter(x=>x.tid===G.teamId);
  for(const l of myListed){
    if(chance(0.5)){
      const fp = findPlayer(l.pid); if(!fp) continue;
      const buyers = G.teams.filter(t=> t.id!==G.teamId && t.budget > l.ask*0.8);
      if(!buyers.length) continue;
      const b = pick(buyers);
      const amount = Math.round(l.ask * rf(0.75,1.1));
      if(!G.offersIn.find(o=>o.pid===l.pid))
        G.offersIn.push({pid:l.pid, tid:b.id, amount, exp:G.week+2});
      addNews(`<b>Offerta</b>: ${b.name} propone ${fmtK(amount)} per ${fp.p.nm}.`,'mercato');
    }
  }
  // occasionale offerta non richiesta per un tuo gioiello
  if(chance(0.10)){
    const gems = playerTeam().players.filter(p=>p.age<=24 && ovr(p)>=68);
    const p = pick(gems);
    if(p && !G.offersIn.find(o=>o.pid===p.id)){
      const rich = G.teams.filter(t=>t.id!==G.teamId && t.budget>p.val*1.2);
      const b = pick(rich);
      if(b){
        const amount = Math.round(p.val*rf(1.0,1.5));
        G.offersIn.push({pid:p.id, tid:b.id, amount, exp:G.week+2});
        addNews(`<b>Offerta a sorpresa</b>: ${b.name} mette sul piatto ${fmtK(amount)} per ${p.nm}!`,'mercato');
      }
    }
  }
  G.offersIn = G.offersIn.filter(o=>o.exp>=G.week);
}
function transferPlayer(p, from, to, price){
  from.players = from.players.filter(x=>x!==p);
  to.players.push(p);
  from.budget += price; to.budget -= price;
  from.wageBill = Math.round(sum(from.players,x=>x.wage));
  to.wageBill = Math.round(sum(to.players,x=>x.wage));
  p.contract = Math.max(p.contract, ri(2,4));
}

/* ---------- allenamento e recupero ---------- */
function weeklyTraining(){
  const t = playerTeam(), st = G.club.staff;
  for(const p of t.players){
    p.cond = Math.min(100, p.cond + 30 + st.prep*4 + (G.club.training==='riposo'?12:0));
    if(p.inj>0){ p.inj--; if(p.inj===0) addNews(`${p.nm} è di nuovo disponibile.`,'squadra'); }
  }
  // crescita da allenamento (giovani, piccola)
  const focus = G.club.training;
  if(focus!=='riposo'){
    for(const p of t.players){
      if(p.age>24 || ovr(p)>=p.pot) continue;
      if(!chance(0.10 + st.vice*0.05)) continue;
      const gain = 1;
      if(focus==='attacco') p.att=clamp(p.att+gain,1,99);
      else if(focus==='difesa') p.dif=clamp(p.dif+gain,1,99);
      else if(focus==='tecnica') p.tec=clamp(p.tec+gain,1,99);
      else if(focus==='fisico'){ if(chance(.5)) p.vel=clamp(p.vel+gain,1,99); else p.res=clamp(p.res+gain,1,99); }
      else { const k=pick(['att','dif','tec','vel','res']); p[k]=clamp(p[k]+gain,1,99); }
      p.val = playerValue(p);
    }
  }
  // recupero e infortuni per le squadre IA
  for(const q of G.teams){
    if(q.id===G.teamId) continue;
    for(const p of q.players){
      p.cond = Math.min(100, p.cond + 32);
      if(p.inj>0) p.inj--;
    }
  }
  if(G.euroTeams) for(const q of G.euroTeams) for(const p of q.players){
    p.cond=Math.min(100,p.cond+32); if(p.inj>0) p.inj--;
  }
}
function weeklyFinance(){
  for(const t of G.teams){
    t.wageBill = Math.round(sum(t.players,p=>p.wage));
    t.budget += Math.round(t.sponsor/38) - t.wageBill + (CONTRIB_LEGA[t.div]||0);
    if(t.id!==G.teamId && t.budget < 50){ t.budget = 50 + ri(0,100); } // ripianamento soci IA
  }
}

/* ---------- avanzamento della settimana ---------- */
function advanceWeek(playerSim){
  if(G.gameOver) return {over:true};
  if(G.week > G.calendar.length){ endSeason(); return {season:true}; }
  const wk = G.calendar[G.week-1];
  const pm = weekMatch();
  if(pm && !playerSim) return {need:'match', pm, wk};

  // 1) registra la partita del giocatore
  if(pm && playerSim){
    const m = pm.m;
    m.gh = playerSim.gh; m.ga = playerSim.ga; m.p = 1;
    if(pm.comp!=='L'){ m.pen = playerSim.pens; m.win = playerSim.winnerId(); }
    applySimToPlayers(playerSim, pm.comp);
    updateConfidence(playerSim, pm.comp);
    // incasso casalingo
    const t = playerTeam();
    if(playerSim.H.team.id===G.teamId){
      const inc = gateIncome(t, pm.comp);
      t.budget += inc;
      G.lastGate = inc;
    }
    // squalifiche scontate (solo campionato; chi è squalificato non era schierabile)
    if(pm.comp==='L') for(const p of t.players) if(p.squal>0) p.squal--;
  } else if(wk.t==='L'){
    // niente partita mia (già giocata?) — sconta comunque squalifiche
    for(const p of playerTeam().players) if(p.squal>0) p.squal--;
  }

  // 2) simula il resto del turno
  if(wk.t==='L'){
    for(const d of DIVS) simLeagueRound(d, wk.r, G.teamId);
    // le squalifiche degli avversari si scontano a ogni giornata
    for(const q of G.teams){
      if(q.id===G.teamId) continue;
      for(const p of q.players) if(p.squal>0) p.squal--;
    }
  } else if(wk.t==='C' && G.cup && !G.cup.winner && G.cup.round===wk.r){
    simCupTies(G.cup,'C', G.teamId);
  } else if(wk.t==='E' && G.ecup && !G.ecup.winner && G.ecup.round===wk.r){
    simCupTies(G.ecup,'E', G.teamId);
  }

  // 3) amministrazione settimanale
  weeklyTraining();
  weeklyFinance();
  aiMarket();
  if(chance(0.35)) genFreeAgents(1);
  if(G.week%4===0) refreshListedPlayers();
  weeklyBoardCheck();

  G.week++;
  if(G.week > G.calendar.length && !G.gameOver){ endSeason(); return {season:true}; }
  return {ok:true};
}

/* ---------- fine stagione ---------- */
function resolveEuroPending(){
  // l'Europa si è giocata senza di noi: esito sintetico
  if(!G.euroPending || !G.euroPending.length) return null;
  const its = G.euroPending.map(id=>T(id));
  G.euroPending = null;
  if(chance(0.62)){
    const gr = pick(Object.keys(EST_SQUADRE));
    const nome = pick(EST_SQUADRE[gr]);
    addNews(`La Coppa dei Campioni va agli stranieri del <b>${nome}</b>.`,'coppa');
    return nome;
  }
  const w = its.length>1 && teamOvr(its[1])>teamOvr(its[0]) && chance(.5) ? its[1] : its[0];
  w.budget += PREMI_EURO.win;
  w.trophies.push({s:G.season, type:'Coppa dei Campioni'});
  addNews(`Impresa italiana: la Coppa dei Campioni è del <b>${w.name}</b>!`,'coppa');
  return w.name;
}
function endSeason(){
  const t = playerTeam();
  const ST = {}; for(const d of DIVS) ST[d] = standings(d);
  const stA = ST.A, stB = ST.B;
  const champ = T(stA[0].id);
  const euroWName = G.ecup ? (G.ecup.winner!==null&&G.ecup.winner!==undefined?T(G.ecup.winner).name:null) : resolveEuroPending();
  champ.trophies.push({s:G.season, type:'Serie A'});
  for(const d of ['B','C','D']) T(ST[d][0].id).trophies.push({s:G.season, type:'Serie '+d});
  addNews(`<b>${champ.name}</b> è Campione d'Italia!`, 'coppa');

  // premi e diritti TV per tutte le serie
  for(const d of DIVS)
    ST[d].forEach((r,i)=>{ T(r.id).budget += PREMI_DIV[d][i] + Math.max(20, TV_DIV[d](i)); });
  if(G.cup && G.cup.winner!==null){
    // gettone alle eliminate in base al turno raggiunto
    const off = PREMI_CUP_ROUND.length - G.cup.rounds.length; // allinea coppe a 32 o 64
    for(let ri_=0; ri_<G.cup.rounds.length; ri_++)
      for(const m of G.cup.rounds[ri_]){
        const loser = m.win===m.h?m.a:m.h;
        if(T(loser)) T(loser).budget += PREMI_CUP_ROUND[ri_+Math.max(0,off)]||0;
      }
  }

  const myPos = leaguePos(t.id);
  const myDiv = t.div;

  // verdetto della società
  let verdict;
  const beat = t.expect - myPos;
  if(myDiv!=='A' && myPos<=3) { G.club.confidence = clamp(G.club.confidence+30,0,100); verdict='promo'; }
  else if(beat>=3){ G.club.confidence = clamp(G.club.confidence+22,0,100); verdict='great'; }
  else if(beat>=0){ G.club.confidence = clamp(G.club.confidence+10,0,100); verdict='ok'; }
  else if(beat>=-4){ G.club.confidence = clamp(G.club.confidence-8,0,100); verdict='meh'; }
  else { G.club.confidence = clamp(G.club.confidence-24,0,100); verdict='bad'; }
  if(myDiv!=='A' && t.legend && myPos>3) G.club.confidence = clamp(G.club.confidence-8,0,100);
  if(G.club.confidence<=12){ G.gameOver = {type:'esonero-fine', s:G.season}; }

  // storico
  G.history.push({
    s:G.season, team:t.name, div:myDiv, pos:myPos,
    cup: G.cup && G.cup.winner===t.id ? 'VINTA' : cupRunText(G.cup, t.id),
    euro: G.ecup ? (G.ecup.winner===t.id?'VINTA':cupRunText(G.ecup,t.id)) : '—',
    conf: Math.round(G.club.confidence), verdict
  });

  // riepilogo per la schermata di fine stagione (promosse/retrocesse ai confini della MIA serie)
  const upDiv = myDiv==='A' ? 'B' : myDiv;
  G.recap = {
    s: G.season, myPos, myDiv, verdict,
    champ: champ.name,
    cupW: (G.cup && G.cup.winner!==null && G.cup.winner!==undefined) ? T(G.cup.winner).name : null,
    euroW: euroWName,
    up: ST[upDiv].slice(0,3).map(r=>T(r.id).name),
    down: ST[myDiv==='A'?'A':divUpper(myDiv)].slice(-3).map(r=>T(r.id).name)
  };

  // promozioni / retrocessioni a catena: A↔B, B↔C, C↔D
  for(const [hi, lo] of [['A','B'],['B','C'],['C','D']]){
    for(const r of ST[hi].slice(-3)){ T(r.id).div = lo; addNews(`${T(r.id).name} retrocede in Serie ${lo}.`,'lega'); }
    for(const r of ST[lo].slice(0,3)){ T(r.id).div = hi; addNews(`${T(r.id).name} è promossa in Serie ${hi}!`,'lega'); }
  }
  G.divA = G.teams.filter(x=>x.div==='A').map(x=>x.id);
  G.divB = G.teams.filter(x=>x.div==='B').map(x=>x.id);
  G.divC = G.teams.filter(x=>x.div==='C').map(x=>x.id);
  G.divD = G.teams.filter(x=>x.div==='D').map(x=>x.id);

  // qualificate alla Coppa dei Campioni della prossima stagione
  G.euroQ = [stA[0].id, stA[1].id];

  // invecchiamento, crescita, ritiri, contratti
  for(const q of G.teams){
    const keep=[];
    for(const p of q.players){
      p.age++;
      seasonGrowth(p);
      p.contract--;
      p.yc=0; p.sGoals=0; p.sApps=0; p.sVoti=0; p.sVotiN=0; p.sAssists=0; p.cond=100; p.frm=clamp(p.frm,4,8);
      const retires = p.age>=36 || (p.age>=33 && ovr(p)<52 && chance(.5));
      if(retires){ if(q.id===G.teamId) addNews(`${p.nm} appende gli scarpini al chiodo. Grazie di tutto!`,'squadra'); continue; }
      if(p.contract<=0){
        if(q.id===G.teamId){ addNews(`${p.nm} è a fine contratto e saluta la squadra.`,'squadra'); }
        p.contract=0; G.freeAgents.push(p); continue;
      }
      keep.push(p);
    }
    q.players = keep;
    // le IA ricomprano se la rosa è corta
    while(q.players.length<15 || q.players.filter(p=>p.role==='POR').length<2){
      const need = q.players.filter(p=>p.role==='POR').length<2 ? 'POR' : pick(['DIF','CEN','ATT']);
      q.players.push(genPlayer(need, TIER_Q[q.tier]-4));
    }
  }
  G.freeAgents = G.freeAgents.filter(p=>{ p.age; return p.age<35; }).slice(-30);

  // settore giovanile
  const nY = G.club.youth>0 ? ri(1, Math.min(3,G.club.youth+1)) : (chance(.4)?1:0);
  for(let i=0;i<nY;i++){
    if(t.players.length>=26) break;
    const p = genPlayer(pick(RUOLI), 40+G.club.youth*5, [16,18]);
    p.pot = clamp(ovr(p)+ri(8,30), 50, 96);
    p.youth = true; p.contract = 3;
    t.players.push(p);
    addNews(`Dal vivaio arriva in prima squadra <b>${p.nm}</b> (${p.role}, ${p.age} anni).`,'squadra');
  }

  // nuova stagione
  G.season++;
  G.week = 1;
  _rebuildSeason();
  return true;
}
function cupRunText(cup, tid){
  if(!cup) return '—';
  let last = 0;
  cup.rounds.forEach((ties,i)=>{ if(ties.find(m=>m.h===tid||m.a===tid)) last=i+1; });
  if(last===0) return '—';
  return cupRoundNames(cup)[last-1] || '—';
}
function seasonGrowth(p){
  const o = ovr(p);
  if(p.age<=23 && o<p.pot){
    const gain = Math.min(p.pot-o, ri(1,4));
    for(let i=0;i<gain;i++){
      const k = p.role==='POR'?'par': pick(p.role==='DIF'?['dif','vel','res']:p.role==='CEN'?['tec','res','att']:['att','tec','vel']);
      p[k] = clamp(p[k]+ri(1,2),1,99);
    }
  } else if(p.age>=30){
    const dec = (p.age-29);
    p.vel = clamp(p.vel-ri(1,dec+1),20,99);
    p.res = clamp(p.res-ri(0,dec),20,99);
    if(p.age>=33 && p.role!=='POR'){ p.att=clamp(p.att-1,20,99); p.dif=clamp(p.dif-1,20,99); }
  }
  p.val = playerValue(p); p.wage = Math.max(p.wage, playerWage(p));
}
function _rebuildSeason(){
  G.fixturesA = genFixtures(G.divA);
  G.fixturesB = genFixtures(G.divB);
  G.fixturesC = genFixtures(G.divC);
  G.fixturesD = genFixtures(G.divD);
  const meInEuro = G.euroQ.includes(G.teamId);
  G.calendar = buildCalendar(meInEuro, 6);
  G.cup = initCup();
  if(meInEuro){
    G.ecup = initEuro(G.euroQ);
    addNews(`Sorteggiata la <b>Coppa dei Campioni</b>: ci siamo anche noi!`, 'coppa');
  } else {
    G.ecup = null;
    if(G.euroQ.length){
      // l'Europa si gioca senza di noi: esito lampo a fine anno
      G.euroPending = G.euroQ.slice();
    }
  }
  computeExpectations();
  initSeasonEconomy();
  refreshListedPlayers();
  G.offersIn = [];
  const t = playerTeam();
  addNews(`Stagione ${G.season}: obiettivo <b>${objText(t)}</b>.`,'club');
}

/* ---------- azioni di mercato del giocatore ---------- */
function tryBuy(listing, mode){ // mode: 'ribasso'|'pieno'|'rilancio'
  const fp = findPlayer(listing.pid);
  if(!fp || !fp.t) return {ok:false, msg:'Giocatore non più disponibile.'};
  const t = playerTeam();
  if(t.players.length>=26) return {ok:false, msg:'Rosa al completo (max 26).'};
  if(!isMarketOpen()) return {ok:false, msg:'Il mercato è chiuso.'};
  const price = Math.round(listing.ask * (mode==='ribasso'?0.82: mode==='rilancio'?1.12:1));
  if(t.budget < price) return {ok:false, msg:'Budget insufficiente.'};
  const pAcc = mode==='ribasso'?0.4: mode==='rilancio'?0.97:0.8;
  if(!chance(pAcc)) return {ok:false, msg:`${fp.t.name} rifiuta l'offerta di ${fmtK(price)}.`};
  // il giocatore accetta? dipende da divisione e ingaggio
  const wage = Math.round(fp.p.wage * rf(1.05,1.35));
  const divF = t.div==='A'?0.92: fp.t.div==='A'?0.45:0.85;
  if(!chance(divF)) return {ok:false, msg:`${fp.p.nm} non è convinto del progetto e rifiuta.`};
  transferPlayer(fp.p, fp.t, t, price);
  fp.p.wage = wage;
  G.listed = G.listed.filter(x=>x.pid!==listing.pid);
  addNews(`<b>Colpo di mercato!</b> ${fp.p.nm} è un nuovo giocatore: ${fmtK(price)} a ${fp.t.name}.`,'mercato');
  return {ok:true, msg:`${fp.p.nm} firma! Costo ${fmtK(price)}, ingaggio ${fmtK(wage)}/sett.`};
}
function signFree(pid){
  const p = G.freeAgents.find(x=>x.id===pid);
  if(!p) return {ok:false,msg:'Non disponibile.'};
  const t = playerTeam();
  if(t.players.length>=26) return {ok:false,msg:'Rosa al completo (max 26).'};
  const wage = Math.round(playerWage(p)*1.2);
  if(!chance(t.div==='A'?0.95:0.8)) return {ok:false,msg:`${p.nm} rifiuta la proposta.`};
  p.wage = wage; p.contract = ri(1,2);
  t.players.push(p);
  G.freeAgents = G.freeAgents.filter(x=>x.id!==pid);
  addNews(`${p.nm} firma da svincolato.`,'mercato');
  return {ok:true,msg:`${p.nm} firma! Ingaggio ${fmtK(wage)}/sett.`};
}
function listMyPlayer(pid){
  const t = playerTeam();
  const p = t.players.find(x=>x.id===pid);
  if(!p) return;
  if(G.listed.find(x=>x.pid===pid)){ G.listed = G.listed.filter(x=>x.pid!==pid); return; }
  G.listed.push({pid, tid:t.id, ask:Math.round(p.val*1.05)});
}
function acceptOffer(off){
  const t = playerTeam();
  const p = t.players.find(x=>x.id===off.pid);
  if(!p) return {ok:false,msg:'Giocatore non trovato.'};
  if(t.players.length<=14) return {ok:false,msg:'Rosa troppo corta per vendere (min 14).'};
  if(p.role==='POR' && t.players.filter(x=>x.role==='POR').length<=1)
    return {ok:false,msg:'Non puoi restare senza portieri.'};
  transferPlayer(p, t, T(off.tid), off.amount);
  G.offersIn = G.offersIn.filter(o=>o.pid!==off.pid);
  G.listed = G.listed.filter(x=>x.pid!==off.pid);
  addNews(`${p.nm} ceduto a ${T(off.tid).name} per ${fmtK(off.amount)}.`,'mercato');
  return {ok:true,msg:`Ceduto per ${fmtK(off.amount)}.`};
}
function renewContract(pid){
  const t = playerTeam();
  const p = t.players.find(x=>x.id===pid);
  if(!p) return {ok:false,msg:''};

  p.wage = wage; p.contract = Math.min(4, p.contract + ri(2,3));
  t.budget -= wage*4;
  addNews(`${p.nm} rinnova fino a +${p.contract} stagioni.`,'squadra');
  return {ok:true, msg:`Rinnovo firmato: ${fmtK(wage)}/sett per ${p.contract} stagioni (bonus ${fmtK(wage*4)}).`};
}

/* ---------- integrità degli identificativi dei giocatori ----------
   Il contatore _pid vive in memoria: ricaricando la pagina ripartiva da 1
   e i giocatori generati dopo (svincolati, vivaio, rinforzi dell'IA)
   finivano per avere un id già in uso, con il risultato che una ricerca
   per id restituiva un altro giocatore. Qui si ripara e si riallinea.   */
function repairIds(){
  const tutti = [];
  for(const t of G.teams) for(const p of t.players) tutti.push(p);
  if(G.euroTeams) for(const t of G.euroTeams) for(const p of t.players) tutti.push(p);
  for(const p of (G.freeAgents||[])) tutti.push(p);
  let maxId = 0;
  for(const p of tutti) if(typeof p.id==='number' && p.id>maxId) maxId = p.id;
  _pid = Math.max(_pid, maxId + 1, (G.nextPid||0));
  const visti = new Set();
  let riparati = 0;
  for(const p of tutti){
    if(typeof p.id!=='number' || visti.has(p.id)){ p.id = _pid++; riparati++; }
    visti.add(p.id);
  }
  if(riparati){
    // i riferimenti per id potevano puntare al giocatore sbagliato: si rifanno
    G.xiPids = bestXI(playerTeam()).map(p=>p.id);
    refreshListedPlayers();
    G.offersIn = [];
    addNews(`Archivio della lega riordinato: ${riparati} tesserati avevano un codice duplicato.`,'lega');
  }
  G.nextPid = _pid;
  return riparati;
}

/* ---------- migrazione dei salvataggi v1 (senza Serie C/D) ---------- */
function migrateSave(){
  if(!G || (G.ver||1)>=2) return false;
  // id giocatori: riparti dopo il massimo esistente
  let maxPid = 0;
  for(const t of G.teams) for(const p of t.players) maxPid = Math.max(maxPid, p.id);
  if(G.euroTeams) for(const t of G.euroTeams) for(const p of t.players) maxPid = Math.max(maxPid, p.id);
  for(const p of (G.freeAgents||[])) maxPid = Math.max(maxPid, p.id);
  _pid = maxPid + 1;
  // nascono Serie C e D
  const start = G.teams.length;
  const defsCD = TEAMS_DEF.filter(d=>d.div==='C'||d.div==='D');
  defsCD.forEach((d,i)=> G.teams.push(genTeam(d, start+i)));
  G.divC = G.teams.filter(t=>t.div==='C').map(t=>t.id);
  G.divD = G.teams.filter(t=>t.div==='D').map(t=>t.id);
  G.fixturesC = genFixtures(G.divC);
  G.fixturesD = genFixtures(G.divD);
  computeExpectations();
  initSeasonEconomy();
  // nuova curva ingaggi per tutti
  for(const t of G.teams) for(const p of t.players){ p.val = playerValue(p); p.wage = playerWage(p); }
  for(const p of (G.freeAgents||[])){ p.val = playerValue(p); p.wage = playerWage(p); }
  G.ver = 2;
  addNews('La federazione allarga la piramide: nascono <b>Serie C</b> e <b>Serie D</b>! Dalla prossima stagione coppa a 64 squadre.','lega');
  return true;
}

/* =====================================================
   05_audio: rumore stadio ed effetti (WebAudio, generati)
   ===================================================== */
const AU = { ctx:null, master:null, crowdGain:null, ready:false };

function initAudio(){
  if(AU.ready || typeof AudioContext==='undefined' && typeof webkitAudioContext==='undefined') return;
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    AU.ctx = new Ctx();
    AU.master = AU.ctx.createGain();
    AU.master.gain.value = 0.7;
    AU.master.connect(AU.ctx.destination);
    // rumore folla: buffer di rumore filtrato in loop
    const len = AU.ctx.sampleRate * 2;
    const buf = AU.ctx.createBuffer(1, len, AU.ctx.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for(let i=0;i<len;i++){ // rumore "rosa" approssimato
      const w = Math.random()*2-1;
      last = (last + 0.02*w)/1.02;
      d[i] = last*3.5;
    }
    AU.crowdSrc = AU.ctx.createBufferSource();
    AU.crowdSrc.buffer = buf; AU.crowdSrc.loop = true;
    const bp = AU.ctx.createBiquadFilter();
    bp.type='bandpass'; bp.frequency.value=750; bp.Q.value=0.5;
    AU.crowdGain = AU.ctx.createGain(); AU.crowdGain.gain.value=0;
    AU.crowdSrc.connect(bp); bp.connect(AU.crowdGain); AU.crowdGain.connect(AU.master);
    AU.crowdSrc.start();
    AU.ready = true;
  }catch(e){ /* audio non disponibile: pazienza */ }
}
function sndOn(){ return AU.ready && G && G.opts.sound; }
function crowdSet(level, t){ // 0..1
  if(!sndOn()) { if(AU.ready) AU.crowdGain.gain.value=0; return; }
  AU.crowdGain.gain.setTargetAtTime(level*0.14, AU.ctx.currentTime, t||0.5);
}
function crowdStop(){ if(AU.ready) AU.crowdGain.gain.setTargetAtTime(0, AU.ctx.currentTime, 0.3); }
function beep(freq, dur, type, vol, when){
  if(!sndOn()) return;
  const t0 = AU.ctx.currentTime + (when||0);
  const o = AU.ctx.createOscillator(), g = AU.ctx.createGain();
  o.type = type||'square'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||0.12, t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+(dur||0.1));
  o.connect(g); g.connect(AU.master);
  o.start(t0); o.stop(t0+(dur||0.1)+0.05);
}
function sndWhistle(n){
  for(let i=0;i<(n||1);i++){ beep(2350,0.22,'square',0.10,i*0.3); beep(2340,0.22,'square',0.06,i*0.3+0.02); }
}
function sndGoal(mine){
  if(!sndOn()) return;

  setTimeout(()=>crowdSet(0.35,1.2), 1800);

/* =====================================================
   06_matchview: campo 2D pixel, animazione sincronizzata
   con gli eventi del motore, cronaca e comandi in diretta
   ===================================================== */

const MV = {
  sim:null, pm:null, onEnd:null,
  canvas:null, ctx:null, pitch:null,
  speed:2, running:false, raf:0,
  minuteMs:500, acc:0, lastT:0,
  scene:null, ball:{x:192,y:120}, ballPath:[], pathT:0,
  ppos:{}, banner:'', bannerT:0, waitHalf:false, carrier:null,
  pauseMs:0, flashT:0,
  SPEEDS:{1:2800, 2:1400, 4:620, 8:210}   // ms di gioco reale per minuto di partita
};
const PW=384, PH=240, FX0=12, FX1=372, FY0=16, FY1=224;
const GW=9, GH=17;   // profondità e mezza altezza della porta

/* ---------- disegno del campo (pre-render) ---------- */
function buildPitch(){
  const c = document.createElement('canvas');
  c.width=PW; c.height=PH;
  const x = c.getContext('2d');
  x.fillStyle='#1d4a24'; x.fillRect(0,0,PW,PH);
  for(let i=0;i<10;i++){
    x.fillStyle = i%2? '#2f7d3a' : '#2a7034';
    x.fillRect(FX0 + i*(FX1-FX0)/10, FY0, (FX1-FX0)/10+1, FY1-FY0);
  }
  x.strokeStyle='rgba(240,255,240,.85)'; x.lineWidth=2;
  x.strokeRect(FX0,FY0,FX1-FX0,FY1-FY0);
  x.beginPath(); x.moveTo(PW/2,FY0); x.lineTo(PW/2,FY1); x.stroke();
  x.beginPath(); x.arc(PW/2,PH/2,26,0,7); x.stroke();
  // aree
  for(const side of [0,1]){
    const dir = side?-1:1;
    const bx = side?FX1:FX0;
    x.strokeRect(Math.min(bx,bx+dir*44), PH/2-44, 44, 88);
    x.strokeRect(Math.min(bx,bx+dir*16), PH/2-22, 16, 44);
    // porte: rete SCURA con maglie chiare, così il pallone bianco che entra si vede
    const gx = side ? FX1 : FX0-GW;
    x.fillStyle = 'rgba(8,12,20,.88)';
    x.fillRect(gx, PH/2-GH, GW, GH*2);
    x.strokeStyle = 'rgba(255,255,255,.40)'; x.lineWidth = 1;
    for(let i=1;i<GW/2;i++){
      x.beginPath(); x.moveTo(gx+i*2+.5, PH/2-GH); x.lineTo(gx+i*2+.5, PH/2+GH); x.stroke();
    }
    for(let i=1;i<GH*2/5;i++){
      x.beginPath(); x.moveTo(gx, PH/2-GH+i*5+.5); x.lineTo(gx+GW, PH/2-GH+i*5+.5); x.stroke();
    }
    x.strokeStyle = '#ffffff'; x.lineWidth = 2;
    x.strokeRect(gx, PH/2-GH, GW, GH*2);
    x.strokeStyle='rgba(240,255,240,.85)'; x.lineWidth=2;
  }
  // bandierine corner
  x.fillStyle='#ffd23f';
  [[FX0,FY0],[FX0,FY1],[FX1,FY0],[FX1,FY1]].forEach(([cx,cy])=>x.fillRect(cx-1,cy-4,2,4));
  return c;
}

/* ---------- posizioni di riferimento ---------- */
function anchors(sideK){
  const s = MV.sim.side(sideK);
  const f = FORMATIONS[s.formation];
  const home = sideK==='H';
  const lines = {POR:0.05, DIF:0.20, CEN:0.46, ATT:0.72};
  const res = {};
  const byLine = {POR:[],DIF:[],CEN:[],ATT:[]};
  for(const p of s.xi){ if(!s.rc.has(p.id)) byLine[s.lineOf[p.id]||p.role].push(p); }
  const possK = MV.scene ? MV.scene.poss : null;
  const shift = possK===sideK ? 0.10 : possK ? -0.05 : 0;
  for(const line of ["POR","DIF","CEN","ATT"]){
    const arr = byLine[line];
    arr.forEach((p,i)=>{
      let lx = clamp(lines[line] + (line==='POR'?0:shift), 0.03, 0.93);
      let fx = home ? FX0 + lx*(FX1-FX0) : FX1 - lx*(FX1-FX0);
      const span = arr.length;
      let fy = FY0 + (FY1-FY0) * (span===1 ? 0.5 : 0.13 + 0.74*i/(span-1));
      res[p.id] = {x:fx, y:fy};
    });
  }
  return res;
}

/* ---------- traiettoria del pallone per la scena ---------- */
function planBall(scene){
  const pts = [{x:MV.ball.x, y:MV.ball.y}];
  const atk = scene.poss==='H';
  const dir = atk?1:-1;
  const zoneX = (z)=> {
    const t = atk ? [0.25,0.5,0.78][z] : [0.75,0.5,0.22][z];
    return FX0 + t*(FX1-FX0);
  };
  const gx = atk? FX1 : FX0;             // porta attaccata
  const gy = PH/2;
  const ry = ()=> ri(FY0+22, FY1-22);
  let shotSeg = -1;                        // quale tratto è la conclusione
  if(!scene.ev || ['foul','yellow','red'].includes(scene.ev.t)){
    // manovra: la palla circola nella metà campo di chi ha il possesso,
    // così il gioco sale e scende invece di restare inchiodato a centrocampo
    const z1 = chance(.45) ? 0 : 1;
    const z2 = chance(.55) ? 2 : 1;
    pts.push({x:zoneX(z1)+ri(-28,28), y:ry()});
    pts.push({x:zoneX(z2)+ri(-28,28), y:ry()});
    if(scene.ev) pts.push({x:zoneX(z2)+ri(-16,16), y:ry()}); // fallo: palla ferma lì
  } else {
    const e = scene.ev.t;
    // costruzione dell'azione: la si vede arrivare, tratto dopo tratto
    pts.push({x:zoneX(1)+ri(-26,26), y:ry()});
    pts.push({x:zoneX(2)+ri(-20,20), y:gy+ri(-60,60)});
    pts.push({x:(zoneX(2)+gx)/2+ri(-12,12), y:gy+ri(-42,42)});   // ingresso in area
    shotSeg = pts.length-1;                                       // il prossimo tratto è il tiro
    if(e==='goal'){ pts.push({x:gx+(atk?6:-6), y:gy+ri(-11,11)}); }
    else if(e==='save'){ pts.push({x:gx+(atk?-7:7), y:gy+ri(-10,10)}); pts.push({x:gx+(atk?-30:30), y:gy+ri(-40,40)}); }
    else if(e==='wide'){ pts.push({x:gx+(atk?8:-8), y: chance(.5)?FY0+ri(0,14):FY1-ri(0,14)}); }
    else if(e==='post'){ pts.push({x:gx+(atk?2:-2), y:gy+(chance(.5)?-17:17)}); pts.push({x:gx+(atk?-44:44), y:gy+ri(-50,50)}); }
    else if(e==='blocked'){ pts.push({x:gx+(atk?-52:52), y:gy+ri(-30,30)}); pts.push({x:zoneX(1), y:ry()}); }
    else if(e==='corner'){ pts.push({x:atk?FX1:FX0, y:chance(.5)?FY0:FY1}); }
    else { pts.push({x:zoneX(1), y:ry()}); }
  }
  // tempi per tratto: la manovra scorre, il TIRO è una fucilata, il rimbalzo è rapido
  const n = pts.length-1;
  const w = [];
  for(let i=0;i<n;i++) w.push(1);
  if(shotSeg>=0 && shotSeg<n){
    w[shotSeg] = 0.26;
    for(let i=shotSeg+1;i<n;i++) w[i] = 0.45;   // respinta / rimbalzo
  }
  const tot = w.reduce((a,b)=>a+b,0) || 1;
  const cum = [0];
  for(let i=0;i<n;i++) cum.push(cum[i] + w[i]/tot);
  MV.ballPath = pts; MV.pathT = 0; MV.pathCum = cum;
  // l'azione da gol va a rilento: c'è la pausa di esultanza che le fa spazio,
  // così si vede la palla salire, entrare in area e finire in rete
  MV.pathSpeed = (scene.ev && scene.ev.t==='goal') ? 0.7 : 1;
}

/* ---------- sprite giocatore ---------- */
function drawGuy(x, px, py, c1, c2, frame, gk){
  px = Math.round(px); py = Math.round(py);
  const shirt = gk ? '#3aa76d' : c1;
  const short = gk ? '#222222' : c2;
  x.fillStyle = '#0a0a0a'; x.fillRect(px-3, py+7, 7, 2); // ombra
  x.fillStyle = '#e0b088'; x.fillRect(px-1, py-6, 3, 3);  // testa
  x.fillStyle = shirt; x.fillRect(px-2, py-3, 5, 4);      // maglia
  x.fillStyle = c2; if(!gk) x.fillRect(px-2, py-3, 5, 1); // colletto
  x.fillStyle = short; x.fillRect(px-2, py+1, 5, 2);      // calzoncini
  x.fillStyle = '#e0b088';
  if(frame){ x.fillRect(px-2, py+3, 2, 3); x.fillRect(px+1, py+3, 2, 4); }
  else     { x.fillRect(px-2, py+3, 2, 4); x.fillRect(px+1, py+3, 2, 3); }
}

/* ---------- frame ---------- */
function mvFrame(ts){
  if(!MV.running){ return; }
  MV.raf = requestAnimationFrame(mvFrame);
  if(!MV.lastT) MV.lastT = ts;
  let dt = ts - MV.lastT; MV.lastT = ts;
  if(dt>200) dt = 200;
  // in pausa (intervallo, pannello tattico) l'orologio NON accumula:
  // altrimenti alla ripresa smaltirebbe in un colpo tutti i minuti di lettura
  if(MV.waitHalf){ MV.acc = 0; }
  else if(MV.pauseMs>0){ MV.pauseMs -= dt; MV.acc = 0; }   // esultanza dopo il gol
  else { MV.acc += dt; }
  // avanza il motore di un minuto quando serve (al massimo 2 per frame,
  // così nemmeno una scheda rimasta in background fa volare la partita)
  let guard = 0;
  while(MV.acc >= MV.minuteMs && !MV.sim.finished && !MV.waitHalf && MV.pauseMs<=0 && guard++ < 2){
    MV.acc -= MV.minuteMs;
    mvStepMinute();
  }
  if(MV.acc > MV.minuteMs*2) MV.acc = MV.minuteMs;
  mvDraw(ts);
  if(MV.sim.finished && !MV.ended){
    MV.ended = true;
    setTimeout(()=>mvFullTime(), 700);
  }
}
function mvStepMinute(){
  const scene = MV.sim.step();
  if(!scene) return;
  MV.scene = scene;
  planBall(scene);
  // cronaca dei nuovi eventi
  const evs = MV.sim.events;
  let goalEv = null;
  while(MV.logIdx < evs.length){
    const e = evs[MV.logIdx++];
    if(e.type==='goal' || e.type==='pengoal') goalEv = e;
    mvLog(e);
    mvSoundFor(e);
  }
  mvScore();
  mvPossession(scene.poss);
  if(scene.ev){
    const t = scene.ev.t;
    if(t==='goal'){ mvGoalCelebration(scene.ev.side, goalEv, scene.min); }
    else if(t==='post'){ mvBanner('PALO!'); }
    else if(t==='red'){ mvBanner('ROSSO!'); }
    else if(t==='yellow'){ mvBanner('GIALLO'); }
  }
  if(scene.extra) mvBanner('SUPPLEMENTARI');
  if(scene.pens) mvBanner('RIGORI!');
  if(scene.half) mvHalfTime();   // sempre, anche se al 45' è successo altro
}
