<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Racing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="1000" height="700"></canvas>
        <div id="ui-layer">
            <div id="hud" style="display: none;">
                <div id="lap-counter">Lap: 1/10</div>
                <div id="position-counter">Pos: 1/4</div>
                <div id="speedometer">0 km/h</div>
                <button id="quitBtn" class="hud-btn">Quit</button>
            </div>
            <div id="menu">
                <h1>2D Racing</h1>
                <div class="menu-group">
                    <label>Track:</label>
                    <select id="track-select">
                        <option value="oval">Oval (Simple)</option>
                        <option value="f1">F1 Circuit (Complex)</option>
                        <option value="peanut">Peanut Track</option>
                        <option value="circomassimo">Circo Massimo</option>
                    </select>
                </div>
                <div class="menu-group">
                    <label>Choose your car color:</label>
                    <select id="color-select">
                        <option value="red">Red</option>
                        <option value="blue">Blue</option>
                        <option value="yellow">Yellow</option>
                        <option value="purple">Purple</option>
                        <option value="orange">Orange</option>
                        <option value="white">White</option>
                    </select>
                </div>
                <div class="menu-group">
                    <label>Number of Laps:</label>
                    <input type="number" id="laps-select" min="1" max="100" value="10" style="padding: 10px; border-radius: 4px; border: 1px solid #444; background: #222; color: white; width: 100%; box-sizing: border-box; font-size: 16px;">
                </div>
                <div class="menu-group">
                    <label>Number of Opponents:</label>
                    <select id="opponents-select">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3" selected>3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                    </select>
                </div>
                <div class="menu-group">
                    <label>AI Difficulty:</label>
                    <select id="difficulty-select">
                        <option value="easy">Easy</option>
                        <option value="medium" selected>Medium</option>
                        <option value="hard">Hard</option>
                    </select>
                </div>
                <button id="start-btn">Single Race</button>
                <button id="champ-btn" style="margin-top: 10px; background: #FFD700; color: #000;">Start Championship</button>
            </div>
            <div id="game-over" style="display: none; padding: 20px; min-width: 400px;">
                <h1 id="result-message">You Won!</h1>
                <table id="stats-table" style="width: 100%; margin-bottom: 20px; border-collapse: collapse;">
                    <thead>
                        <tr style="border-bottom: 1px solid #fff;">
                            <th>Pos</th>
                            <th>Car</th>
                            <th>Time</th>
                            <th>Gap</th>
                            <th>Reaction</th>
                        </tr>
                    </thead>
                    <tbody id="stats-body">
                    </tbody>
                </table>
                <div id="champ-recap-section" style="display: none; margin-top: 20px; border-top: 2px solid #555; padding-top: 10px;">
                    <h2>Current Standings</h2>
                    <table id="champ-recap-table" style="width: 100%; border-collapse: collapse;">
                        <thead>
                            <tr style="border-bottom: 1px solid #fff;">
                                <th>Pos</th>
                                <th>Car</th>
                                <th>Points</th>
                            </tr>
                        </thead>
                        <tbody id="champ-recap-body">
                        </tbody>
                    </table>
                </div>
                <button id="restart-btn">Menu</button>
                <button id="next-round-btn" style="display: none; margin-top: 10px; background: #FFD700; color: #000;">Next Round</button>
            </div>
            <div id="championship-final" style="display: none; padding: 20px; min-width: 400px;">
                <h1>Championship Results</h1>
                <table id="champ-stats-table" style="width: 100%; margin-bottom: 20px; border-collapse: collapse;">
                    <thead>
                        <tr style="border-bottom: 1px solid #fff;">
                            <th>Pos</th>
                            <th>Car</th>
                            <th>Points</th>
                        </tr>
                    </thead>
                    <tbody id="champ-stats-body">
                    </tbody>
                </table>
                <button id="champ-restart-btn">Main Menu</button>
            </div>
            <div id="winner-announcement" style="display: none; position: absolute; top: 20%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; border: 2px solid #555; text-align: center; font-size: 24px;">
                <h2 id="winner-text" style="margin: 0;"></h2>
            </div>
        </div>
        
        <div id="mobile-controls" style="display: none;">
            <div id="mobile-left-group">
                <button id="btnUp">Gas</button>
                <button id="btnDown">Brake</button>
            </div>
            <div id="mobile-right-group">
                <button id="btnLeft">Left</button>
                <button id="btnRight">Right</button>
            </div>
        </div>
    </div>
    <script src="track.js"></script>
    <script src="car.js"></script>
    <script src="ai.js"></script>
    <script src="audio.js"></script>
    <script src="main.js"></script>
</body>
</html>
