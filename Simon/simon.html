<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simon - Memory Game</title>
    <link rel="stylesheet" href="style_simon.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1 class="logo">SIMON</h1>
            <div class="scores">
                <div class="score-card glass">
                    <span class="label">Punteggio</span>
                    <span id="score" class="value">0</span>
                </div>
                <div class="score-card glass">
                    <span class="label">Migliore</span>
                    <span id="high-score" class="value">0</span>
                </div>
            </div>
        </header>

        <main class="game-area">
            <div class="simon-board">
                <div class="row">
                    <button class="simon-btn green" id="green" data-color="green" aria-label="Verde"></button>
                    <button class="simon-btn red" id="red" data-color="red" aria-label="Rosso"></button>
                </div>
                <div class="row">
                    <button class="simon-btn yellow" id="yellow" data-color="yellow" aria-label="Giallo"></button>
                    <button class="simon-btn blue" id="blue" data-color="blue" aria-label="Blu"></button>
                </div>
                
                <div class="center-display glass-dark">
                    <button id="start-btn" class="start-btn">PLAY</button>
                    <span id="status-text" class="status-text hidden">GUARDA</span>
                </div>
            </div>
        </main>
        
        <div id="game-over-modal" class="modal hidden">
            <div class="modal-content glass">
                <h2>Game Over</h2>
                <p class="final-score-text">Hai totalizzato <span id="final-score" class="highlight">0</span> punti</p>
                <button id="restart-btn" class="primary-btn">Riprova</button>
            </div>
        </div>
    </div>
    <script src="app_simon.js"></script>
</body>
</html>
