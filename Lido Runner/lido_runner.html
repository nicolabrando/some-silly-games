<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lido Runner</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛱️</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,700;0,900;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style_lido.css">
</head>
<body>
    <div class="game-shell">
        <div class="game-container">
            <canvas id="gameCanvas" width="960" height="560"></canvas>
        </div>
        <div id="touchControls" aria-hidden="true">
            <div class="tc-group">
                <button class="tc" id="tcLeft" aria-label="Sinistra">◀</button>
                <button class="tc" id="tcRight" aria-label="Destra">▶</button>
            </div>
            <button class="tc tc-small" id="tcPause" aria-label="Pausa">❚❚</button>
            <div class="tc-group">
                <button class="tc" id="tcDown" aria-label="Accucciati / picchiata">▼</button>
                <button class="tc tc-jump" id="tcJump" aria-label="Salta">▲</button>
            </div>
        </div>
    </div>
    <noscript>Lido Runner ha bisogno di JavaScript per funzionare.</noscript>
    <script src="main_lido.js"></script>
</body>
</html>
